    while (riverFishShadows.filter((f) => f.zone === "mid").length < nMid) spawnIn(zones.mid, "mid", 1);
    while (riverFishShadows.filter((f) => f.zone === "down").length < nDown) spawnIn(zones.down, "down", 1.05);
  }

  function updateAndDrawFishShadows(allSamples, growth) {
    if (growth < 0.32) {
      riverFishShadows = [];
      return;
    }
    ensureRiverFishShadows(allSamples, growth);
    const zones = collectFishZones(allSamples);
    if (!zones.all.length) return;

    for (let i = 0; i < riverFishShadows.length; i++) {
      const f = riverFishShadows[i];
      f.phase += 0.045;
      if (Math.random() < 0.012) {
        f.vx = (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.38);
        f.vy = (Math.random() - 0.5) * 0.16;
      }
      f.x += f.vx;
      f.y += f.vy + Math.sin(f.phase) * 0.07;

      const list =
        f.zone === "up" ? zones.up : f.zone === "mid" ? zones.mid : zones.down;
      const search = list.length ? list : zones.all;
      let best = search[0];
      let bestD = 1e9;
      for (let j = 0; j < search.length; j++) {
        const s = search[j];
        const d = (s.x - f.x) * (s.x - f.x) + (s.y - f.y) * (s.y - f.y);
        if (d < bestD) {
          bestD = d;
          best = s;
        }
      }
      if (list.length && bestD > 900) {
        const s = list[(Math.random() * list.length) | 0];
        f.x = s.x;
        f.y = s.y;
        best = s;
      }
      const maxOff = Math.max(1.0, best.halfW * 0.5);
      const dx = f.x - best.x;
      const dy = f.y - best.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist > maxOff) {
        f.x = best.x + (dx / dist) * maxOff * 0.85;
        f.y = best.y + (dy / dist) * maxOff * 0.85;
        f.vx *= -0.55;
        f.vy *= -0.55;
      }

      // 鮟偵＞蠖ｱ
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(Math.atan2(f.vy * 2, f.vx || 0.01));
      const s = f.size;
      ctx.fillStyle = "rgba(12, 22, 32, 0.48)";
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 1.45, s * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(8, 16, 24, 0.4)";
      ctx.beginPath();
      ctx.moveTo(-s * 1.2, 0);
      ctx.lineTo(-s * 2.0, -s * 0.45);
      ctx.lineTo(-s * 2.0, s * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawRivers() {
    const u = Math.max(greenProgress, vineGrowth * 0.35);
    const growth = riverGrowth(u, true);
    RiverSurge.update(growth);
    if (growth < 0.02 && !RiverSurge.active && !RiverSheen.active) return;

    const flow = t * 0.035;
    const defs = getRiverDefs(growth);
    const allSamples = [];

    for (let di = 0; di < defs.length; di++) {
      const def = defs[di];
      if (growth < def.minG) continue;
      allSamples.push(drawLiveRiverWater(def, growth, flow));
    }

    // 豌ｴ荳ｭ縺ｮ鮟偵＞鬲壼ｽｱ縺ｮ縺ｿ・磯｣帙・霍ｳ縺ｭ貍泌・縺ｯ蜑企勁・・    updateAndDrawFishShadows(allSamples, growth);
  }

  /**
   * 2.5D 遶倶ｽ灘慍髱｢
   * - 謇句燕縺悟ｺ・￥繝ｻ螂･縺檎強縺・剰ｦ門床蠖｢・磯□霑大ｼｷ繧・ｼ・   * - 譏弱ｋ縺・悄濶ｲ・句・・丞ｽｱ縺ｧ遶倶ｽ捺─
   * - 謇句燕縺ｮ譁ｭ髱｢・亥ｴ厄ｼ峨〒蜴壹∩
   */
  /**
   * 繧ｳ繝ｭ繝九・陲ｫ螳ｳ縺ｮ繝ｩ繧､繝匁緒逕ｻ
   * ICBM: 蝨溷慍繝吶・繧ｹ・句ｻｺ迚ｩ繧偵げ繝ｬ繝ｼ蛹厄ｼ狗↓轣ｽ/辣呻ｼ亥､ｧ縺阪↑鮟呈･募・繧ｪ繝ｼ繝舌・繝ｬ繧､縺ｪ縺暦ｼ・   * 關ｽ髮ｷ: 蝨溷慍縺ｯ縺昴・縺ｾ縺ｾ繝ｻ蟒ｺ迚ｩ縺縺題埋縺・げ繝ｬ繝ｼ
   * ICBM 陦ｨ遉ｺ縺ｯ關ｽ髮ｷ繧医ｊ蜆ｪ蜈・   */
  function drawColonyDamageOverlay() {
    ensureLandDecor();
    if (!_landTowns || urbanPeakWisdom <= 0) return;
    const padRx0 = 24;
    const padRy0 = 10;

    // ICBM 谿ｵ髫弱＃縺ｨ縺ｮ蝨溷慍繝ｻ蟒ｺ迚ｩ濶ｲ・・竊・ 縺ｧ蠕舌・↓譏弱ｋ縺乗綾縺呻ｼ・    const stagePal = {
      3: {
        pad0: "#5c5c60",
        pad1: "#48484c",
        pad2: "#3a3a3e",
        padEdge: "#6a6a70",
        bld: "#4a4a4e",
        bldTop: "#3e3e42",
        alpha: 0.95,
      },
      2: {
        pad0: "#7a7a80",
        pad1: "#68686e",
        pad2: "#58585e",
        padEdge: "#8a8a90",
        bld: "#6a6a70",
        bldTop: "#5e5e64",
        alpha: 0.88,
      },
      1: {
        pad0: "#a8a8ae",
        pad1: "#98989e",
        pad2: "#88888e",
        padEdge: "#b8b8be",
        bld: "#9a9aa0",
        bldTop: "#8e8e94",
        alpha: 0.78,
      },
    };

    for (let ti = 0; ti < _landTowns.length; ti++) {
      const site = _landTowns[ti];
      ensureColonyDamageFields(site);
      const grow = urbanSiteGrow(site.unlockAt || 0);
      if (grow < 0.04) continue;
      const eg = grow * grow * (3 - 2 * grow);
      const scale = 0.32 + 0.68 * eg;
      const padRx = padRx0 * scale;
      const padRy = padRy0 * scale;
      const cx = site.cx;
      const cy = site.cy;
      const dmg = site.icbmDmg | 0;
      const out = !!site.blackout;
      const sc = 0.85 + 0.4 * eg;
      const spreadX = padRx * 0.5;
      const spreadY = padRy * 0.32;
      const s = site.seed | 0;

      // 窶披・ICBM・郁誠髮ｷ繧医ｊ蜆ｪ蜈茨ｼ俄披・      if (dmg > 0) {
        const pal = stagePal[dmg] || stagePal[1];
        ctx.save();
        ctx.globalAlpha = pal.alpha;
        // 蝨溷慍繝吶・繧ｹ縺縺代ｒ豼・＞縲懆埋縺・げ繝ｬ繝ｼ縺ｧ蝪励ｊ逶ｴ縺暦ｼ亥､ｧ縺阪↑鮟呈･募・縺ｯ莉倥￠縺ｪ縺・ｼ・        const pg = ctx.createRadialGradient(cx, cy, 1, cx, cy, padRx);
        pg.addColorStop(0, pal.pad0);
        pg.addColorStop(0.4, pal.pad1);
        pg.addColorStop(0.78, pal.pad2);
        pg.addColorStop(1, "rgba(80,80,86,0.12)");
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 0.5, padRx, padRy, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = pal.padEdge;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 0.5, padRx * 0.94, padRy * 0.9, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // 蟒ｺ迚ｩ繧偵げ繝ｬ繝ｼ縺ｧ荳頑緒縺・        ctx.save();
        ctx.globalAlpha = 0.92;
        const nHouse = dmg >= 2 ? 3 + (s % 2) : 2 + (s % 2);
        for (let hi = 0; hi < nHouse; hi++) {
          const hx = cx + (landHash(s + hi, 70) - 0.5) * 2 * spreadX;
          const hy = cy + (landHash(s + hi, 71) - 0.5) * 2 * spreadY;
          const bw = 4.0 * sc * (0.85 + landHash(s + hi, 72) * 0.2);
          const bh = 3.2 * sc * (0.85 + landHash(s + hi, 72) * 0.2);
          ctx.fillStyle = pal.bld;
          ctx.fillRect(hx - bw * 0.5, hy - bh, bw, bh);
          ctx.strokeStyle = pal.bldTop;
          ctx.lineWidth = 0.8;
          ctx.strokeRect(hx - bw * 0.5, hy - bh, bw, bh);
          ctx.fillStyle = pal.bldTop;
          ctx.beginPath();
          ctx.moveTo(hx - bw * 0.7, hy - bh);
          ctx.lineTo(hx, hy - bh - 2.5 * sc);
          ctx.lineTo(hx + bw * 0.7, hy - bh);
          ctx.closePath();
          ctx.fill();
        }
        if (dmg >= 2) {
          const nTall = 1 + (s % 2);
          for (let vi = 0; vi < nTall; vi++) {
            const tx = cx + (landHash(s + vi, 92) - 0.5) * 2 * spreadX * 0.85;
            const th = (7 + landHash(s + vi, 93) * 3.2) * sc * 0.9;
            const tw = 3.2 + landHash(s + vi, 94) * 1.3;
            ctx.fillStyle = pal.bld;
            ctx.fillRect(tx - tw * 0.5, cy - th, tw, th);
            ctx.fillStyle = pal.bldTop;
            ctx.fillRect(tx - tw * 0.6, cy - th - 1.2, tw * 1.2, 1.3);
          }
        }
        ctx.restore();

        // 轣ｫ轣ｽ / 辣呻ｼ域怙謔ｪ谿ｵ髫弱・縺ｿ・・        if (dmg >= 3) {
          site.smokePhase = (site.smokePhase || 0) + 0.045;
          for (let si = 0; si < 4; si++) {
            const sp = site.smokePhase + si * 1.15;
            const sx = cx + Math.sin(sp * 0.7 + si) * (2.5 + si * 1.8);
            const sy = cy - 6 - ((sp * 8 + si * 5) % 22);
            const sr = 2.2 + si * 0.9 + Math.sin(sp) * 0.9;
            ctx.fillStyle = `rgba(${60 + si * 10}, ${58 + si * 8}, ${56 + si * 6}, ${0.3 - si * 0.04})`;
            ctx.beginPath();
            ctx.ellipse(sx, sy, sr, sr * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          for (let fi = 0; fi < 3; fi++) {
            const fp = site.smokePhase * 1.3 + fi * 1.7;
            const fx = cx + (landHash(s + fi, 55) - 0.5) * padRx * 0.75;
            const fy = cy - 1 - Math.abs(Math.sin(fp)) * 5;
            const fh = 3.5 + Math.sin(fp * 2) * 2;
            ctx.fillStyle = `rgba(255, ${100 + fi * 18}, 30, ${0.55 + Math.sin(fp) * 0.2})`;
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.quadraticCurveTo(fx - 2, fy - fh * 0.5, fx, fy - fh);
            ctx.quadraticCurveTo(fx + 2, fy - fh * 0.5, fx, fy);
            ctx.fill();
            ctx.fillStyle = `rgba(255, 220, 90, ${0.4 + Math.sin(fp + 1) * 0.15})`;
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.quadraticCurveTo(fx - 1, fy - fh * 0.4, fx, fy - fh * 0.6);
            ctx.quadraticCurveTo(fx + 1, fy - fh * 0.4, fx, fy);
            ctx.fill();
          }
        }
      } else if (out) {
        // 關ｽ髮ｷ・壼悄蝨ｰ繝吶・繧ｹ縺ｯ縺昴・縺ｾ縺ｾ縲∝ｻｺ迚ｩ縺縺題埋縺・げ繝ｬ繝ｼ
        ctx.save();
        ctx.globalAlpha = 0.82;
        const nHouse = 3 + (s % 2);
        for (let hi = 0; hi < nHouse; hi++) {
          const hx = cx + (landHash(s + hi, 70) - 0.5) * 2 * spreadX;
          const hy = cy + (landHash(s + hi, 71) - 0.5) * 2 * spreadY;
          const bw = 4.0 * sc * (0.85 + landHash(s + hi, 72) * 0.2);
          const bh = 3.2 * sc * (0.85 + landHash(s + hi, 72) * 0.2);
          ctx.fillStyle = "#c0c0c6";
          ctx.fillRect(hx - bw * 0.5, hy - bh, bw, bh);
          ctx.strokeStyle = "#a8a8ae";
          ctx.lineWidth = 0.8;
          ctx.strokeRect(hx - bw * 0.5, hy - bh, bw, bh);
          ctx.fillStyle = "#b0b0b6";
          ctx.beginPath();
          ctx.moveTo(hx - bw * 0.7, hy - bh);
          ctx.lineTo(hx, hy - bh - 2.5 * sc);
          ctx.lineTo(hx + bw * 0.7, hy - bh);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(40,40,48,0.45)";
          ctx.fillRect(hx - bw * 0.2, hy - bh * 0.7, bw * 0.22, bh * 0.2);
        }
        if (grow >= 0.68) {
          const nTall = 1 + (s % 2);
          for (let vi = 0; vi < nTall; vi++) {
            const tx = cx + (landHash(s + vi, 92) - 0.5) * 2 * spreadX * 0.85;
            const th = (7 + landHash(s + vi, 93) * 3.2) * sc * 0.9;
            const tw = 3.2 + landHash(s + vi, 94) * 1.3;
            ctx.fillStyle = "#b8b8be";
            ctx.fillRect(tx - tw * 0.5, cy - th, tw, th);
            ctx.fillStyle = "#a8a8ae";
            ctx.fillRect(tx - tw * 0.6, cy - th - 1.2, tw * 1.2, 1.3);
          }
        }
        ctx.restore();
      }
    }
  }

  function drawGround() {
    ensureSceneCaches();
    // 髱咏噪縺ｪ蠎翫・蟯ｩ繝ｻ譁ｭ髱｢縺ｯ繧ｭ繝｣繝・す繝･縺九ｉ
    ctx.drawImage(_groundBaseCache, 0, 0);

    // 繧ｳ繝ｭ繝九・陲ｫ螳ｳ繧ｪ繝ｼ繝舌・繝ｬ繧､・育・繝ｻ蛛憺崕繝ｻ遐ｴ螢頑ｮｵ髫趣ｼ・    drawColonyDamageOverlay();

    // 螟ｧ蝨ｰ縺ｮ蟾・    drawRivers();

    const u = greenProgress;
    const nearY = GROUND_Y;

    // 闃晉函・郁牡縺縺代〒縺ｪ縺冗洒縺・拷縺檎函縺医ｋ・・    drawLiveGrass(ctx, u);

    // 繝斐け繝医げ繝ｩ繝鬚ｨ縺ｮ蜿瑚痩繝ｻ闃ｱ繝ｻ譛ｨ縺ｯ髱櫁｡ｨ遉ｺ・・lora 驟榊・縺ｯ邱大喧險育ｮ礼畑縺ｫ谿九☆・・
    // 譬ｹ・域妙髱｢・俄・繝代Ν繧ｹ險育ｮ励ｒ邁｡逡･
    const faceTop = nearY;
    const faceBottom = Math.min(H, GROUND_Y + GROUND_FACE);
    const faceH = faceBottom - faceTop - 16;
    for (let ri = 0; ri < roots.length; ri++) {
      const r = roots[ri];
      const ry = faceTop + 10 + ((r.y - GROUND_Y) / GROUND_H) * faceH;
      ctx.fillStyle = u > 0.4 ? "#3a6a28" : "#5a4a30";
      ctx.beginPath();
      ctx.ellipse(r.x, ry, r.r * 1.4, r.r * 0.85, 0, 0, 6.283185307179586);
      ctx.fill();
    }

    // 譁ｭ髱｢縺ｫ縺ｫ縺倥・蝨ｰ荳区ｰｴ・育ｷ大喧縺碁ｲ繧縺ｨ貉ｿ繧頑ｰ励・蟆上＆縺ｪ豌ｴ閼茨ｼ・    if (u > 0.15) {
      const seeps = 2 + ((u * 5) | 0);
      for (let si = 0; si < seeps; si++) {
        const sx = 20 + ((si * 89 + seeds * 11) % (W - 40));
        const sy = faceTop + 8 + (si % 3) * 6;
        const len = 6 + u * 14;
        ctx.strokeStyle = `rgba(70, 140, 180, ${0.12 + u * 0.28})`;
        ctx.lineWidth = 1 + u;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo(
          sx + Math.sin(t * 0.03 + si) * 4,
          sy + len * 0.5,
          sx + (si % 2 ? 3 : -3),
          sy + len
        );
        ctx.stroke();
        if (u > 0.45) {
          ctx.fillStyle = `rgba(180, 220, 240, ${0.15 + u * 0.2})`;
          ctx.beginPath();
          ctx.ellipse(sx + (si % 2 ? 3 : -3), sy + len + 1, 2 + u, 1, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

  }
  /**
   * 蜑埼擇繧ｬ繝ｼ繝牙梛繧ｷ繝ｼ繝ｫ繝峨・・｣\縲・   * 讓ｪ譽抵ｼ倶ｸ｡繧ｵ繧､繝臥洒繧∵万繧∵｣偵る搨縺冗匱蜈峨☆繧句濠騾乗・繧ｨ繝阪Ν繧ｮ繝ｼ譽偵・   * 閠蝉ｹ・・縺ｧ邏ｰ縺冗せ貊・∬｢ｫ蠑ｾ縺ｧ荳迸ｬ譏弱ｋ縺上Ｔhield===0 縺ｧ縺ｯ蜻ｼ縺ｰ繧後↑縺・・   */
  function drawPolyShield(g, cx, cy, pw, ph, durability, flashT) {
    const maxD = 2;
    const d = Math.max(0, Math.min(maxD, durability | 0));
    const life = d / maxD; // 1 or 0.5
    const flash = flashT > 0 ? Math.min(1, flashT / 12) : 0;

    // 騾乗・蠎ｦ繝代Ν繧ｹ轤ｹ貊・ｼ亥ｮ悟・髱櫁｡ｨ遉ｺ縺ｫ縺励↑縺・ｼ峨り蝉ｹ・・縺ｻ縺ｩ騾溘￥縲∵怙螟ｧ閠蝉ｹ・・繧・▲縺上ｊ
    // life=1 竊・驕・ａ縲〕ife=0.5 竊・騾溘ａ縲Ｃlink 縺ｯ蟶ｸ縺ｫ minB縲・
    const pulseSpeed = 0.05 + (1 - life) * 0.2;
    const minB = 0.58; // 荳矩剞・亥ｮ悟・縺ｫ豸医∴縺ｪ縺・ｼ・    const wave = 0.5 + 0.5 * Math.sin(t * pulseSpeed);
    let blink = minB + (1 - minB) * wave;
    if (flash >= 0.2) blink = Math.max(blink, 0.85); // 陲ｫ蠑ｾ荳ｭ縺ｯ轤ｹ貊・ｒ謚代∴縺ｦ譏弱ｋ縺・
    // 邱壹・螟ｪ縺輔・譏弱ｋ縺・    let coreW = 2.2 + life * 1.6; // 閠蝉ｹ・〒邏ｰ縺上↑繧・    let glowW = coreW + 3.5 + life * 1.5;
    let coreA = (0.55 + life * 0.35) * blink;
    let glowA = (0.35 + life * 0.25) * blink;
    if (flash > 0) {
      coreA = Math.min(1, coreA + flash * 0.55);
      glowA = Math.min(1, glowA + flash * 0.45);
      coreW += flash * 1.2;
      glowW += flash * 2;
    }

    // 縲・・｣\縲坂・閾ｪ讖溷燕髱｢・井ｸ雁・・峨ｒ隕・≧・郁・讖溷ｹ・↓蜿弱∪繧九さ繝ｳ繝代け繝亥ｯｸ豕包ｼ・    // cy 縺ｯ閭ｴ菴謎ｸｭ螟ｮ莉倩ｿ代〒貂｡縺輔ｌ繧九・縺ｧ縲∽ｸ願ｾｺ縺ｸ繧ｪ繝輔そ繝・ヨ
    const topY = cy - ph * 0.55 - 4;
    const halfBar = pw * 0.38 + 1; // 讓ｪ譽偵・蜊雁ｹ・ｼ郁・讖溷ｹ・↓蜷医ｏ縺帷洒繧・ｼ・    const wingX = pw * 0.16 + 2; // 譁懊ａ縺ｮ讓ｪ譁ｹ蜷托ｼ域而縺医ａ・・    const wingY = 5 + ph * 0.08; // 譁懊ａ縺ｮ荳区婿蜷托ｼ育洒繧・ｼ・
    const pL = { x: cx - halfBar - wingX, y: topY + wingY }; // 蟾ｦ荳・    const pLT = { x: cx - halfBar, y: topY }; // 讓ｪ譽貞ｷｦ遶ｯ
    const pRT = { x: cx + halfBar, y: topY }; // 讓ｪ譽貞承遶ｯ
    const pR = { x: cx + halfBar + wingX, y: topY + wingY }; // 蜿ｳ荳・
    function pathBar() {
      g.beginPath();
      g.moveTo(pL.x, pL.y);
      g.lineTo(pLT.x, pLT.y);
      g.lineTo(pRT.x, pRT.y);
      g.lineTo(pR.x, pR.y);
    }

    g.save();
    g.lineCap = "square";
    g.lineJoin = "miter";

    // 螟門・繧ｰ繝ｭ繝ｼ・磯搨縺・匱蜈会ｼ・    pathBar();
    g.strokeStyle =
      flash > 0.25
        ? `rgba(220, 245, 255, ${glowA})`
        : `rgba(80, 180, 255, ${glowA})`;
    g.lineWidth = glowW;
    g.stroke();

    // 荳ｭ髢薙・蜊企乗・繧ｨ繝阪Ν繧ｮ繝ｼ
    pathBar();
    g.strokeStyle =
      flash > 0.25
        ? `rgba(180, 230, 255, ${coreA * 0.7})`
        : `rgba(100, 200, 255, ${coreA * 0.55})`;
    g.lineWidth = coreW + 1.5;
    g.stroke();

    // 闃ｯ縺ｮ譏弱ｋ縺・ｷ・    pathBar();
    g.strokeStyle =
      flash > 0.25
        ? `rgba(255, 255, 255, ${Math.min(1, coreA + 0.2)})`
        : `rgba(200, 240, 255, ${coreA})`;
    g.lineWidth = Math.max(1.2, coreW * 0.55);
    g.stroke();

    // 縺斐￥阮・＞蜀・・縺ｮ蟶ｯ・域ｨｪ譽帝Κ蛻・□縺代・蜊企乗・・・    const bandA = (0.06 + life * 0.08) * blink * (flash > 0.2 ? 1.8 : 1);
    if (bandA > 0.03) {
      g.fillStyle =
        flash > 0.2
          ? `rgba(255, 255, 255, ${bandA})`
          : `rgba(120, 200, 255, ${bandA})`;
      g.beginPath();
      const bh = Math.max(2, coreW * 0.45);
      g.moveTo(pLT.x, pLT.y - bh);
      g.lineTo(pRT.x, pRT.y - bh);
      g.lineTo(pRT.x, pRT.y + bh * 0.35);
      g.lineTo(pLT.x, pLT.y + bh * 0.35);
      g.closePath();
      g.fill();
    }

    g.restore();
  }

  /**
   * 闕峨・譬ｹ髦ｲ陦帙Θ繝九ャ繝・X 窶・豬ｮ驕雁梛 SpaceX繧ｫ繝ｼ鬚ｨ / 繝｡繧ｫ辟｡髯占ｻ碁％
   */
  function drawPlayer() {
    if (invuln > 0 && Math.floor(invuln / 3) % 2 === 0) return;
    const x = player.x, y = player.y;
    const frozen = freezeT > 0;
    const muted = muteShootT > 0;
    const tint = statusTint; // "red" | "purple" | null
    const isRed = tint === "red";
    const isPurple = tint === "purple";
    const cx0 = x + player.w / 2;
    const sc = 1.06;
    const useSprite = imgPlayerShip && imgPlayerShip.complete && imgPlayerShip.naturalWidth > 0;

    // 隕九◆逶ｮ繧ｵ繧､繧ｺ・医ヲ繝・ヨ繝懊ャ繧ｯ繧ｹ player.w/h 縺ｯ縺昴・縺ｾ縺ｾ・・    const visW = useSprite ? 52 : player.w;
    const visH = useSprite ? 58 : player.h;
    const vx = cx0 - visW / 2;
    const vy = y + player.h / 2 - visH * 0.62;

    drawGroundShadow(cx0, 0.03, useSprite ? 22 : 18, useSprite ? 7 : 5.5, 0.4);

    ctx.save();
    ctx.translate(cx0, y + player.h * 0.55);
    ctx.scale(sc, sc * 0.96);
    if (player.tilt !== 0) ctx.rotate(player.tilt);
    ctx.translate(-cx0, -(y + player.h * 0.55));

    if (player.shield > 0) {
      drawPolyShield(
        ctx,
        cx0,
        y + player.h * 0.35,
        Math.max(player.w, visW * 0.72),
        Math.max(player.h, visH * 0.55),
        player.shield,
        player.shieldFlashT
      );
    }

    // 繧ｨ繝ｳ繧ｸ繝ｳ蝎ｴ蟆・ｼ医せ繝励Λ繧､繝井ｸ矩Κ・・    if (!frozen) {
      const glow = isRed
        ? "rgba(240,80,60,0.45)"
        : isPurple
          ? "rgba(180,80,220,0.45)"
          : "rgba(80,170,255,0.4)";
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(cx0, vy + visH - 2, visW * 0.22, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (useSprite) {
      ctx.save();
      if (isRed) ctx.filter = "sepia(0.55) hue-rotate(-25deg) saturate(1.4)";
      else if (isPurple) ctx.filter = "sepia(0.4) hue-rotate(230deg) saturate(1.35)";
      if (frozen) ctx.globalAlpha = 0.72;
      ctx.drawImage(imgPlayerShip, vx, vy, visW, visH);
      ctx.restore();
    } else {
      // 闕峨・譬ｹ髦ｲ陦帙Θ繝九ャ繝・X 窶・豬ｮ驕雁梛 SpaceX繧ｫ繝ｼ鬚ｨ・医・繝ｭ繧ｷ繝ｼ繧ｸ繝｣繝ｫ・・      let body = "#161618";
      if (isRed) body = "#b03838";
      else if (isPurple) body = "#7a38a8";
      const edge = isRed ? "#ffb0a0" : isPurple ? "#e0b0ff" : "#e8e8ec";
      const accent = isRed ? "#ff6040" : isPurple ? "#c060ff" : "#6ec8ff";
      const track = isRed ? "#3a1010" : isPurple ? "#2a1038" : "#0a0a0c";

      // 辟｡髯占ｻ碁％・亥ｷｦ蜿ｳ・・      ctx.fillStyle = track;
      ctx.fillRect(x - 3, y + 8, 11, 14);
      ctx.fillRect(x + player.w - 8, y + 8, 11, 14);
      ctx.fillStyle = "#2a2a30";
      for (let i = 0; i < 4; i++) {
        const ty = y + 9 + i * 3 + ((player.track || 0) % 3);
        ctx.fillRect(x - 2, ty, 9, 1.5);
        ctx.fillRect(x + player.w - 7, ty, 9, 1.5);
      }

      // 霆贋ｽ捺悽菴・      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(x + 5, y + 5);
      ctx.lineTo(x + player.w - 5, y + 5);
      ctx.lineTo(x + player.w + 1, y + 12);
      ctx.lineTo(x + player.w - 1, y + player.h - 1);
      ctx.lineTo(x + 1, y + player.h - 1);
      ctx.lineTo(x - 1, y + 12);
      ctx.closePath();
      ctx.fill();

      // 逋ｽ蟶ｯ・医ヵ繝ｭ繝ｳ繝医懊さ繝・け繝斐ャ繝茨ｼ・      ctx.fillStyle = edge;
      ctx.fillRect(x + 6, y + 9, player.w - 12, 3.5);
      // 繧ｵ繧､繝峨Λ繧､繝・      ctx.fillStyle = accent;
      ctx.fillRect(x + 3, y + 10, 3, 2);
      ctx.fillRect(x + player.w - 6, y + 10, 3, 2);

      // 螟匁棧
      ctx.strokeStyle = edge;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(x + 5, y + 5);
      ctx.lineTo(x + player.w - 5, y + 5);
      ctx.lineTo(x + player.w + 1, y + 12);
      ctx.lineTo(x + player.w - 1, y + player.h - 1);
      ctx.lineTo(x + 1, y + player.h - 1);
      ctx.lineTo(x - 1, y + 12);
      ctx.closePath();
      ctx.stroke();

      // 遐ｲ蝪・      ctx.fillStyle = "#a8c8e8";
      ctx.fillRect(cx0 - 1.5, y - 5, 3, 9);
      ctx.fillStyle = accent;
      ctx.fillRect(cx0 - 1, y - 6, 2, 3);

      // 荳矩Κ繧ｹ繝ｩ繧ｹ繧ｿ繝ｼ・医・繝舌・・・      if (!frozen) {
        const flick = 0.55 + Math.sin(t * 0.45) * 0.25;
        ctx.fillStyle = `rgba(80, 180, 255, ${0.35 * flick})`;
        ctx.beginPath();
        ctx.ellipse(cx0 - 8, y + player.h + 2, 5, 3.5, 0, 0, Math.PI * 2);
        ctx.ellipse(cx0 + 8, y + player.h + 2, 5, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(180, 230, 255, ${0.55 * flick})`;
        ctx.beginPath();
        ctx.ellipse(cx0 - 8, y + player.h + 1, 2.5, 2, 0, 0, Math.PI * 2);
        ctx.ellipse(cx0 + 8, y + player.h + 1, 2.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

        // 閾ｪ讖溘・繝ｼ繧ｯ・夐壼ｸｸ縲傾縲搾ｼ城｣蟆・ｼ晉區邵・ｻ貞ｭ暦ｼ丈ｸ蛾｣・拗XX・丈ｸ｡譁ｹ・晉區邵々XX
    // 谿区ｩ溘〒轤ｹ貊・ｼ・讖滂ｼ壹ｆ縺｣縺上ｊ・・讖滂ｼ夐溘￥・・    const markVisible =
      player.lives >= 3 ||
      (player.lives === 2 && Math.floor(t / 18) % 2 === 0) ||
      (player.lives === 1 && Math.floor(t / 6) % 2 === 0);
    if (markVisible) {
      const mark = player.triple ? "XXX" : "X";
      const outlined = !!player.rapid; // 騾｣蟆・ｸｭ縺ｯ逋ｽ繧｢繧ｦ繝医Λ繧､繝ｳ・矩ｻ貞｡励ｊ
      const cy = y + player.h * 0.38;
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = player.triple
        ? "bold 11px 'Segoe UI', Meiryo, sans-serif"
        : "bold 13px 'Segoe UI', Meiryo, sans-serif";
      if (outlined) {
        ctx.lineJoin = "round";
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = isRed ? "#ffc0b0" : isPurple ? "#f0c0ff" : "#ffffff";
        ctx.strokeText(mark, cx0, cy);
        ctx.fillStyle = isRed ? "#2a0808" : isPurple ? "#180818" : "#0a0a0a";
        ctx.fillText(mark, cx0, cy);
      } else {
        // 騾壼ｸｸ・夂區縺・X / XXX
        ctx.fillStyle = isRed ? "#ffe0d8" : isPurple ? "#f8e8ff" : "#ffffff";
        ctx.fillText(mark, cx0, cy);
      }
      ctx.restore();
    }

    let labelY = vy - 6;
    if (frozen) {
      ctx.fillStyle = "rgba(160,80,220,0.22)";
      ctx.fillRect(vx - 4, vy - 4, visW + 8, visH + 10);
      ctx.fillStyle = "#d080ff";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("遘ｻ蜍募●豁｢", cx0, labelY);
      labelY -= 10;
    }
    if (muted) {
      ctx.fillStyle = "#ff7070";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("蟆・茶荳榊庄", cx0, labelY);
    }
    ctx.restore();
  }

  function drawEnemies() {
    // 繧ｽ繝ｼ繝医・filter 縺ｼ縺九＠縺ｪ縺暦ｼ郁ｻｽ驥擾ｼ峨ょ･･陦後″縺ｯ scale / alpha 縺ｮ縺ｿ
    for (let ei = 0; ei < enemies.length; ei++) {
      const e = enemies[ei];
      const et = ETYPES[e.type];
      const bob = Math.sin(e.anim) * 2;
      const x = e.x;
      const y = e.y + bob;
      const kind = et.kind;
      const depth = yToGroundDepth(e.y + e.h);
      const sc = depthDrawScale(depth);
      const haze = depthHazeAlpha(depth);
      // 謇句燕蟇・ｊ縺ｮ謨ｵ縺縺大ｽｱ
      if (depth < 0.75) {
        drawGroundShadow(x + e.w * 0.5, depth * 0.9, e.w * 0.4, 3, 0.16 + (1 - depth) * 0.1);
      }

      ctx.save();
      ctx.globalAlpha = haze;
      if (sc !== 1) {
        ctx.translate(x + e.w * 0.5, y + e.h * 0.5);
        ctx.scale(sc, sc);
        ctx.translate(-(x + e.w * 0.5), -(y + e.h * 0.5));
      }

      if (kind === "smog") {
        const cx = x + e.w * 0.5;
        const cy = y + e.h * 0.5;
        ctx.fillStyle = "rgba(160, 210, 235, 0.75)";
        ctx.beginPath();
        ctx.ellipse(cx, cy, e.w * 0.5, e.h * 0.42, 0, 0, 6.283185307179586);
        ctx.fill();
        ctx.fillStyle = "rgba(220,250,255,0.65)";
        ctx.fillRect(cx - 6, cy - 3, 3, 3);
        ctx.fillRect(cx + 3, cy, 2, 2);
      } else if (kind === "plastic") {
        ctx.fillStyle = "#5a8a9a";
        ctx.strokeStyle = "#a0d0e0";
        ctx.lineWidth = 1.2;
        ctx.fillRect(x + 2, y + 4, e.w - 4, e.h - 6);
        ctx.strokeRect(x + 2, y + 4, e.w - 4, e.h - 6);
        ctx.fillStyle = "#7ab0c0";
        ctx.fillRect(x + 4, y + 2, 8, 6);
        ctx.fillStyle = "#c0e8f0";
        ctx.font = "bold 7px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("PFAS", x + e.w * 0.5, y + e.h * 0.5 + 3);
      } else {
        const cx = x + e.w * 0.5;
        const cy = y + e.h * 0.5;
        ctx.fillStyle = "rgba(180, 60, 140, 0.8)";
        ctx.beginPath();
        ctx.ellipse(cx, cy, e.w * 0.45, e.h * 0.42, 0, 0, 6.283185307179586);
        ctx.fill();
        ctx.fillStyle = "#401030";
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, 6.283185307179586);
        ctx.fill();
      }

      if (e.hp < e.maxHp) {
        ctx.fillStyle = "rgba(255,80,40,0.3)";
        ctx.fillRect(x, y, e.w, e.h);
      }
      ctx.restore();
    }
  }

  function drawUfo() {
    if (!ufo) return;
    const x = ufo.x, y = ufo.y;
    drawGroundShadow(x + ufo.w * 0.5, yToGroundDepth(y + ufo.h), ufo.w * 0.35, 3.5, 0.18);
    ctx.fillStyle = "#6a5a48";
    ctx.beginPath();
    ctx.ellipse(x + ufo.w * 0.5, y + ufo.h * 0.5 + 4, ufo.w * 0.5, ufo.h / 2.5, 0, 0, 6.283185307179586);
    ctx.fill();
    ctx.fillStyle = "#8a7a60";
    ctx.beginPath();
    ctx.ellipse(x + ufo.w * 0.5, y + 8, ufo.w / 2.8, 8, 0, 0, 6.283185307179586);
    ctx.fill();
    for (let i = 0; i < ufo.maxHp; i++) {
      ctx.fillStyle = i < ufo.hp ? "#e04040" : "#333";
      ctx.fillRect(x + 14 + i * 10, y - 6, 8, 4);
    }
    ctx.fillStyle = "#e0c080";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("蟾ｨ螟ｧ蟒・｣・黄", x + ufo.w * 0.5, y + ufo.h + 10);
  }

  function drawGiantSmog() {
    if (!giantSmog) return;
    const s = giantSmog;
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;
    const pulse = 1 + Math.sin(s.pulse) * 0.08;
    drawGroundShadow(cx, yToGroundDepth(s.y + s.h), s.w * 0.35, 6, 0.2);
    ctx.save();
    ctx.globalAlpha = 0.85;
    const gr = ctx.createRadialGradient(cx, cy, 4, cx, cy, s.w / 2 * pulse);
    gr.addColorStop(0, "rgba(140, 140, 155, 0.95)");
    gr.addColorStop(0.5, "rgba(90, 95, 110, 0.75)");
    gr.addColorStop(1, "rgba(50, 55, 70, 0)");
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.ellipse(cx, cy, s.w / 2 * pulse, s.h / 2 * pulse, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#c0e040";
    ctx.beginPath();
    ctx.arc(cx - 12, cy - 2, 4, 0, Math.PI * 2);
    ctx.arc(cx + 12, cy - 2, 4, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < s.maxHp; i++) {
      ctx.fillStyle = i < s.hp ? "#a0c040" : "#333";
      ctx.fillRect(s.x + 16 + i * 12, s.y - 8, 10, 4);
    }
    ctx.fillStyle = "#b0c0a0";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("蟾ｨ螟ｧ繧ｹ繝｢繝・げ", cx, s.y + s.h + 12);
  }

  function drawDisasters() {
    // ICBM / 謾ｾ蟆・・ 逹蠑ｾ蠎・′繧・    for (const ex of explosions) {
      const a = ex.life / ex.max;
      if (ex.kind === "rad") {
        const r = Math.max(4, ex.r || (ex.maxR || 70) * (1 - a));
        const gr = ctx.createRadialGradient(ex.x, ex.y, 2, ex.x, ex.y, r);
        gr.addColorStop(0, `rgba(180, 200, 255, ${0.65 * a})`);
        gr.addColorStop(0.35, `rgba(80, 120, 240, ${0.4 * a})`);
        gr.addColorStop(0.7, `rgba(60, 80, 200, ${0.2 * a})`);
        gr.addColorStop(1, `rgba(40, 40, 120, 0)`);
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(160, 200, 255, ${0.5 * a})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, r * 0.85, 0, Math.PI * 2);
        ctx.stroke();
        // 髮ｻ蟄舌・繝ｼ繧ｯ轤ｹ貊・        if (a > 0.3) {
          ctx.fillStyle = `rgba(220, 240, 255, ${0.6 * a})`;
          ctx.font = "bold 12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("e竅ｻ", ex.x, ex.y + 4);
        }
        continue;
      }
      const r = (ex.r || ex.maxR || 60) * (0.7 + a * 0.4);
      const gr = ctx.createRadialGradient(ex.x, ex.y, 2, ex.x, ex.y, r);
      gr.addColorStop(0, `rgba(255, 220, 120, ${0.7 * a})`);
      gr.addColorStop(0.4, `rgba(240, 100, 40, ${0.45 * a})`);
      gr.addColorStop(1, `rgba(80, 40, 20, 0)`);
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const m of disasters) {
      if (m.kind === "radiation") {
        // 髱偵・蜊企乗・髮ｲ + 髮ｻ蟄舌・繝ｼ繧ｯ・亥慍荳頑焔蜑阪〒繝輔ぉ繝ｼ繝会ｼ・        const cx = m.x + m.w / 2;
        const cy = m.y + m.h / 2;
        ctx.save();
        const fa = (m.fade != null ? m.fade : 1);
        ctx.globalAlpha = (0.55 + Math.sin(m.phase) * 0.1) * fa;
        const gr = ctx.createRadialGradient(cx, cy, 4, cx, cy, m.w * 0.7);
        gr.addColorStop(0, "rgba(160, 190, 255, 0.85)");
        gr.addColorStop(0.5, "rgba(80, 120, 220, 0.45)");
        gr.addColorStop(1, "rgba(40, 60, 160, 0)");
        ctx.fillStyle = gr;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2 + m.phase * 0.5;
          const rr = m.w / 2 + Math.sin(m.phase + i) * 4;
          const px = cx + Math.cos(a) * rr;
          const py = cy + Math.sin(a) * rr * 0.7;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        // 髮ｻ蟄舌・繝ｼ繧ｯ e竅ｻ・亥酔縺倥ヵ繧ｧ繝ｼ繝牙・・・        ctx.strokeStyle = "rgba(200, 230, 255, 0.9)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 10, 6, m.phase * 0.3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(cx, cy, 10, 6, m.phase * 0.3 + 1.1, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#c0e0ff";
        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e8f0ff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("e竅ｻ", cx, cy + 16);
        ctx.restore();
        continue;
      }

      if (m.kind === "em") {
        const cx = m.x + m.w / 2;
        const cy = m.y + m.h / 2;
        // 邱代・髮ｻ逎∵ｳ｢繝ｪ繝ｳ繧ｰ
        for (let k = 0; k < 3; k++) {
          const rr = m.r - k * 8;
          if (rr <= 0) continue;
          ctx.strokeStyle = `rgba(80, 230, 120, ${0.75 - k * 0.2})`;
          ctx.lineWidth = 2 - k * 0.4;
          ctx.beginPath();
          ctx.arc(cx, cy, rr, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = "rgba(120, 255, 160, 0.35)";
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(200, 255, 200, 0.85)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 12, cy);
        ctx.lineTo(cx - 4, cy - 6);
        ctx.lineTo(cx + 2, cy + 4);
        ctx.lineTo(cx + 12, cy - 2);
        ctx.stroke();
        continue;
      }

      if (m.kind === "icbm" || m.kind === "icbm_colony") {
        const colonyIcbm = m.kind === "icbm_colony";
        // 繧ｳ繝ｭ繝九・逕ｨ縺ｯ騾壼ｸｸ謾ｻ謦・・邵ｮ蟆丞梛
        const sc = colonyIcbm ? 0.58 : 1;
        // 蝎ｴ蟆・ヨ繝ｬ繧､繝ｫ
        if (m.trail) {
          for (let ti = 0; ti < m.trail.length; ti++) {
            const p = m.trail[ti];
            const a = ti / m.trail.length;
            ctx.fillStyle = `rgba(255, ${100 + a * 100}, 40, ${0.15 + a * 0.45})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, (1.2 + a * 2.5) * sc, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.save();
        ctx.translate(m.x + m.w / 2, m.y + m.h / 2);
        ctx.rotate(Math.atan2(m.vy, m.vx || 0.01) - Math.PI / 2);
        // 繝ｭ繧ｱ繝・ヨ譛ｬ菴難ｼ磯壼ｸｸ縺ｨ蜷後ョ繧ｶ繧､繝ｳ繝ｻ繧ｳ繝ｭ繝九・縺ｯ邵ｮ蟆擾ｼ・        ctx.fillStyle = "#8a8a98";
        ctx.fillRect(-6 * sc, -16 * sc, 12 * sc, 30 * sc);
        ctx.fillStyle = "#c8c8d8";
        ctx.fillRect(-4 * sc, -14 * sc, 8 * sc, 22 * sc);
        ctx.fillStyle = "#d04040";
        ctx.beginPath();
        ctx.moveTo(0, -22 * sc);
        ctx.lineTo(7 * sc, -12 * sc);
        ctx.lineTo(-7 * sc, -12 * sc);
        ctx.closePath();
        ctx.fill();
        // 繝輔ぅ繝ｳ
        ctx.fillStyle = "#606078";
        ctx.beginPath();
        ctx.moveTo(-6 * sc, 8 * sc);
        ctx.lineTo(-12 * sc, 16 * sc);
        ctx.lineTo(-6 * sc, 14 * sc);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(6 * sc, 8 * sc);
        ctx.lineTo(12 * sc, 16 * sc);
        ctx.lineTo(6 * sc, 14 * sc);
        ctx.fill();
        // 蝎ｴ蟆・        const flick = (8 + Math.sin(t * 0.8) * 4) * sc;
        ctx.fillStyle = "#ffaa30";
        ctx.beginPath();
        ctx.moveTo(-4 * sc, 14 * sc);
        ctx.lineTo(0, 14 * sc + flick);
        ctx.lineTo(4 * sc, 14 * sc);
        ctx.fill();
        ctx.fillStyle = "#fff080";
        ctx.beginPath();
        ctx.moveTo(-2 * sc, 14 * sc);
        ctx.lineTo(0, 14 * sc + flick * 0.7);
        ctx.lineTo(2 * sc, 14 * sc);
        ctx.fill();
        ctx.restore();
        continue;
      }

      // 繧ｳ繝ｭ繝九・關ｽ髮ｷ繧ｭ繝｣繝ｩ・育ｨｲ螯ｻ縺ｮ邊ｾ髴翫▲縺ｽ縺・誠荳倶ｽ難ｼ・      if (m.kind === "lightning_colony") {
        const cx = m.x + m.w / 2;
        const cy = m.y + m.h / 2;
        const flick = Math.sin((m.phase || 0) * 2) * 2;
        ctx.save();
        ctx.translate(cx, cy);
        // 螟門・
        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
        glow.addColorStop(0, "rgba(255,255,200,0.55)");
        glow.addColorStop(1, "rgba(255,220,60,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        // 遞ｲ螯ｻ繧ｷ繝ｫ繧ｨ繝・ヨ譛ｬ菴・        ctx.fillStyle = "#fff8a0";
        ctx.strokeStyle = "#ffe040";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-2 + flick * 0.2, -14);
        ctx.lineTo(6, -2);
        ctx.lineTo(1, -2);
        ctx.lineTo(8, 14);
        ctx.lineTo(-4, 2);
        ctx.lineTo(1, 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 繧ｳ繧｢
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(3, -1);
        ctx.lineTo(0, -1);
        ctx.lineTo(4, 8);
        ctx.lineTo(-2, 1);
        ctx.lineTo(1, 1);
        ctx.closePath();
        ctx.fill();
        // 逶ｮ・医く繝｣繝ｩ諢滂ｼ・        ctx.fillStyle = "#4060a0";
        ctx.beginPath();
        ctx.arc(-1.5, -3, 1.2, 0, Math.PI * 2);
        ctx.arc(2.5, -3, 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 蟆ｾ縺ｮ謾ｾ髮ｻ
        ctx.strokeStyle = `rgba(255, 240, 120, ${0.5 + Math.sin(t * 0.9) * 0.3})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy + 12);
        ctx.lineTo(cx - 4 + flick, cy + 20);
        ctx.lineTo(cx + 3, cy + 26);
        ctx.stroke();
        continue;
      }
    }

    // 遞ｲ螯ｻ・壼慍荳奇ｼ医∪縺溘・繧ｳ繝ｭ繝九・逹蝨ｰ轤ｹ・峨ｒ襍ｰ繧矩ｻ・牡縺・ｷ・    if (groundBolt) {
      const a = groundBolt.life / groundBolt.max;
      const gy =
        groundBolt.groundY != null ? groundBolt.groundY : GROUND_Y - 1;
      ctx.strokeStyle = `rgba(255, 230, 60, ${0.4 + a * 0.6})`;
      ctx.lineWidth = (groundBolt.colonyOnly ? 1.5 : 2) + a * 2;
      ctx.shadowColor = "#ffe040";
      ctx.shadowBlur = groundBolt.colonyOnly ? 5 : 8;
      ctx.beginPath();
      ctx.moveTo(groundBolt.x, gy);
      for (let si = 0; si < groundBolt.segs.length; si++) {
        const s = groundBolt.segs[si];
        // 蝗ｺ螳壹が繝輔そ繝・ヨ・域ｯ弱ヵ繝ｬ繝ｼ繝 random 縺縺ｨ繝√き繝√き縺励☆縺弱ｋ・・        const jy = ((si * 17 + (groundBolt.life | 0)) % 3) * 0.6;
        ctx.lineTo(s.x1, gy - jy);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      // 邵ｦ縺ｮ繝斐き・育捩蝨ｰ轤ｹ縺ｾ縺ｧ・・      if (flashT > 0 || groundBolt.colonyOnly) {
        const fa = flashT > 0 ? flashT / 14 : a;
        ctx.strokeStyle = `rgba(255, 255, 180, ${Math.max(0.25, fa)})`;
        ctx.lineWidth = groundBolt.colonyOnly ? 1.8 : 2.5;
        ctx.beginPath();
        ctx.moveTo(groundBolt.x, 0);
        ctx.lineTo(groundBolt.x - 10, gy * 0.35);
        ctx.lineTo(groundBolt.x + 7, gy * 0.55);
        ctx.lineTo(groundBolt.x - 4, gy);
        ctx.stroke();
      }
    }

    if (emFlashT > 0) {
      const a = emFlashT / 28;
      ctx.fillStyle = `rgba(60, 200, 100, ${0.06 + a * 0.15})`;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = `rgba(120, 255, 160, ${0.25 + a * 0.45})`;
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const yy = 40 + i * 70 + Math.sin(t * 0.2 + i) * 4;
        ctx.beginPath();
        ctx.moveTo(0, yy);
        ctx.lineTo(W, yy + 8);
        ctx.stroke();
      }
    }

    if (flashT > 0 && !groundBolt) {
      const a = flashT / 14;
      ctx.fillStyle = `rgba(255, 255, 220, ${0.12 + a * 0.4})`;
      ctx.fillRect(0, 0, W, H);
    } else if (flashT > 0) {
      const a = flashT / 14;
      ctx.fillStyle = `rgba(255, 255, 200, ${0.1 + a * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawBullets() {
    // 閾ｪ讖滂ｼ夂峩邱壹・邱大ｼｾ
    for (const b of bullets) {
      ctx.fillStyle = (b.dmg || 1) >= 2 ? "#e0f080" : "#a0e860";
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = "rgba(200, 255, 160, 0.5)";
      ctx.fillRect(b.x, b.y + b.h, b.w, 4);
    }

    for (const b of enemyBullets) {
      if (b.kind === "straight") {
        // 繧ｹ繝｢繝・げ・夂悄縺｣縺吶＄蠑ｾ・磯搨逋ｽ・・        ctx.fillStyle = "#a8d0e8";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "rgba(200, 240, 255, 0.6)";
        ctx.fillRect(b.x, b.y - 3, b.w, 3);
        continue;
      }
      if (b.kind === "zigzag") {
        if (b.trail && b.trail.length > 1) {
          for (let ti = 0; ti < b.trail.length; ti++) {
            const p = b.trail[ti];
            const a = 0.2 + (ti / b.trail.length) * 0.7;
            ctx.fillStyle = `rgba(100, 160, 180, ${a})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.5 + ti * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        ctx.fillStyle = "#6a9aaa";
        ctx.beginPath();
        ctx.ellipse(cx, cy, 3.5, 5, Math.sin(b.zigPhase || 0) * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#b0e0f0";
        ctx.fillRect(cx - 2, cy - 1, 4, 3);
        continue;
      }
      if (b.kind === "mini") {
        // 蟆丞梛繧｢繝｡繝ｼ繝仙ｼｾ・・0%・・        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        const anim = b.anim || 0;
        ctx.fillStyle = "rgba(180, 60, 140, 0.8)";
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2 + anim;
          const r = b.w / 2.3 + Math.sin(anim * 2 + i) * 2.5;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r * 0.85;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#f080d0";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = "#401030";
        ctx.beginPath();
        ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      ctx.fillStyle = "#c07050";
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }

  /** 騾｣蟆・・荳蛾｣繝峨Ο繝・・縺ｮ縺阪ｉ縺阪ｉ・・ranslate 貂医∩繝ｻ蜴溽せ・昴い繧､繝・Β荳ｭ蠢・ｼ・*/
  function drawWeaponPowerSparkles(d, isRapid) {
    const sp = d.spark || 0;
    const pulse = 0.55 + Math.sin(sp * 0.18) * 0.35;
    // 螟門・縺ｮ蜈芽ｼｪ
    const col0 = isRapid ? "255, 220, 100" : "200, 160, 255";
    const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, 16 + pulse * 4);
    gr.addColorStop(0, `rgba(${col0}, ${0.35 * pulse})`);
    gr.addColorStop(0.45, `rgba(${col0}, ${0.12 * pulse})`);
    gr.addColorStop(1, `rgba(${col0}, 0)`);
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    // 蝗櫁ｻ｢縺吶ｋ縺阪ｉ繧√″轤ｹ
    const n = 6;
    for (let i = 0; i < n; i++) {
      const a = sp * 0.08 + (i / n) * Math.PI * 2;
      const r = 9 + Math.sin(sp * 0.15 + i) * 3;
      const sx = Math.cos(a) * r;
      const sy = Math.sin(a) * r * 0.85;
      const tw = 0.4 + Math.sin(sp * 0.25 + i * 1.3) * 0.45;
      if (tw < 0.15) continue;
      ctx.fillStyle = `rgba(255, 255, 255, ${tw})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.1 + tw, 0, Math.PI * 2);
      ctx.fill();
      // 蜊∝ｭ励・蟆上＆縺ｪ霈昴″
      if (i % 2 === 0) {
        ctx.strokeStyle = `rgba(255, 250, 220, ${tw * 0.85})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx - 2.5, sy);
        ctx.lineTo(sx + 2.5, sy);
        ctx.moveTo(sx, sy - 2.5);
        ctx.lineTo(sx, sy + 2.5);
        ctx.stroke();
      }
    }
    // 譛ｬ菴薙・邵∝・
    ctx.strokeStyle = isRapid
      ? `rgba(255, 240, 160, ${0.5 + pulse * 0.4})`
      : `rgba(230, 200, 255, ${0.5 + pulse * 0.4})`;
    ctx.lineWidth = 1.5 + pulse;
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.stroke();
  }

      } else if (d.type === "spanner") {
        // 蝓区ｲ｡・壻ｸ九↓豐医∩縺､縺､阮・￥・亥悄縺ｫ鬟溘ｏ繧後ｋ・・        const sink = d.sink || 0;

        // 關ｽ縺｡蠖ｱ
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath();
        ctx.ellipse(0.5, 11, 8, 2.4, 0, 0, Math.PI * 2);
        ctx.fill();
        // 驥大ｱ槭げ繝ｩ繝・ｼ磯ｭ縲懈氛・・        const metal = ctx.createLinearGradient(-8, -10, 6, 14);
        metal.addColorStop(0, "#f0f4f8");
        metal.addColorStop(0.35, "#b0b8c0");
        metal.addColorStop(0.7, "#e8ecf0");

        ctx.fillStyle = metal;
        ctx.strokeStyle = "#1e242c";
        ctx.lineWidth = 1.5;

        ctx.lineCap = "round";
        // 鬆ｭ・壼､ｧ縺阪↑縲靴 / 蜿｣縲搾ｼ昴せ繝代リ縺ｮ鬘費ｼ医％縺薙′荳逡ｪ縺ｮ隴伜挨轤ｹ・・        ctx.beginPath();
        // 螟冶ｼｪ驛ｭ・・ 縺ｮ蜿｣繧剃ｸ雁髄縺搾ｼ・        ctx.moveTo(-8, -11);
        ctx.lineTo(-8, -1);
        ctx.quadraticCurveTo(-8, 4, -2.5, 4);
        ctx.lineTo(2.5, 4);
        ctx.quadraticCurveTo(8, 4, 8, -1);
        ctx.lineTo(8, -11);
        // 蜀・・縺上ｊ謚懊″縺ｸ・亥承鬘趣ｼ・        ctx.lineTo(4.5, -11);
        ctx.lineTo(4.5, -2.5);

        ctx.lineTo(-2, 0.8);
        ctx.quadraticCurveTo(-4.5, 0.8, -4.5, -2.5);
        ctx.lineTo(-4.5, -11);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 蜿｣縺ｮ荳ｭ縺ｮ蠖ｱ・亥･･陦後″・・        ctx.fillStyle = "rgba(30,36,44,0.35)";

        ctx.strokeStyle = "#5a3a08";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = -Math.PI / 2 + (k * Math.PI) / 3;
          const hx = Math.cos(a) * 2.6;
          const hy = -5.2 + Math.sin(a) * 2.6;
          if (k === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 莉倥￠譬ｹ縺ｮ繝翫ャ繝磯｢ｨ繝ｪ繝ｳ繧ｰ
        ctx.fillStyle = metal;

        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(0, 5.2, 3.4, 0, Math.PI * 2);

        ctx.stroke();

        ctx.arc(0, 5.2, 1.3, 0, Math.PI * 2);

        ctx.lineTo(-2.2, 17);
        ctx.lineTo(2.2, 17);

        ctx.strokeStyle = "#1e242c";
        ctx.stroke();
        // 縺阪ｉ縺阪ｉ・医♀驕翫・・・        const tw = 0.5 + 0.5 * Math.sin((d.bob || 0) * 2.4);
        ctx.fillStyle = `rgba(255,255,200,${0.25 + tw * 0.55})`;
        ctx.beginPath();

        ctx.rotate(0.62 - Math.sin(d.bob || 0) * 0.06);

      } else {
        ctx.fillStyle = "rgba(100, 200, 240, 0.4)";

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      if (p.kind === "smoke") {
        ctx.globalAlpha = a * 0.42;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.s * 0.65, p.s * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.s, p.s);
      }
    }
    ctx.globalAlpha = 1;
  }

  /** 蜊ｱ髯ｺ繝・ヶ繝ｪ・夐強縺・ｸ芽ｧ貞ｽ｢縺ｮ骭・・遐ｴ迚・*/
  function drawDebris() {

      // 驪ｭ縺・お繝・ず縺ｮ繝上う繝ｩ繧､繝茨ｼ亥些髯ｺ濶ｲ・・      ctx.strokeStyle = "rgba(255, 120, 60, 0.95)";

  function drawHUD() {

    // 窶披・蜿ｳ遶ｯ繧ｯ繝ｩ繧ｹ繧ｿ・域ｮ区ｩ・竊・髮｣譏灘ｺｦ 竊・蠑ｷ蛹・竊・轣ｽ螳ｳ・峨ｒ蜈医↓貂ｬ縺｣縺ｦ蠅・阜繧堤｢ｺ菫・窶披・    const dShort =
      difficulty === "easy" ? "E" :
      difficulty === "hard" ? "H" :
      difficulty === "super" ? "SH" : "N";
    const dColor =
      difficulty === "super" ? "#e05050" :
      difficulty === "hard" ? "#e09060" :
      difficulty === "easy" ? "#80d0a0" : "#a0c090";
    const showEnrage = enrageActive && enemies.length > 0 && enemies.length <= 10;
    const enrageText = showEnrage ? ("蠑ｷ蛹姪・ + enemies.length) : "";
    const showDisaster = wave >= 4;
    const lifeSlots = Math.max(1, player.lives | 0);
    const lifeBlockW = lifeSlots * 14 + 4;
    let rightNeed = lifeBlockW + gap;
    rightNeed += ctx.measureText(dShort).width + gap;
    if (showEnrage) rightNeed += ctx.measureText(enrageText).width + gap;
    if (showDisaster) rightNeed += ctx.measureText("轣ｽ螳ｳ").width + gap;
    const rightEdge = Math.max(W * 0.42, W - rightNeed); // 蟾ｦ蛻励′鬟溘＞霎ｼ縺ｾ縺ｪ縺・ｸ企剞

    // 窶披・蟾ｦ縺九ｉ讓ｪ荳ｦ縺ｳ・・easureText 縺ｧ髢馴囈遒ｺ菫昴・蝗ｺ螳壼ｺｧ讓吶ｒ菴ｿ繧上↑縺・ｼ俄披・    ctx.textAlign = "left";
    let x = 6;
    function hudItem(text, color) {
      if (!text) return;
      const tw = ctx.measureText(text).width;
      if (x + tw > rightEdge - 2) return; // 蜿ｳ繧ｯ繝ｩ繧ｹ繧ｿ縺ｨ驥阪・縺ｪ縺・      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      x += tw + gap;
    }
    hudItem("SCORE " + score, "#c8e0c0");
    hudItem("WAVE " + wave + "/" + MAX_WAVE, "#c8e0c0");
    hudItem("S:" + seeds + " W:" + wisdom, "#c8e0c0");
    hudItem("邱・ + Math.round(greenProgress * 100) + "%", "#c8e0c0");
    hudItem("驛ｽ蟶・ + urbanStageOf(), "#b8c0c8");
    if (player.rapid) hudItem("笞｡", "#e0c040");
    if (player.triple) hudItem("竕｡", "#c090e0");
    if (player.shield > 0) hudItem("孱" + player.shield, "#60c0e0");
    // 迥ｶ諷狗焚蟶ｸ縺ｯ驛ｽ蟶ゅ・蠑ｷ蛹悶・蜿ｳ髫｣・亥ｷｦ蛻励・邯壹″・峨↓迢ｬ遶矩・鄂ｮ
    if (freezeT > 0) hudItem("遘ｻ蛛・ + Math.ceil(freezeT / 60) + "s", "#d080ff");
    if (muteShootT > 0) hudItem("蟆・茶ﾃ・ + (muteShootT / 60).toFixed(1) + "s", "#ff7070");

    // 窶披・蜿ｳ遶ｯ・壽ｮ区ｩ滂ｼ遺夢・峨ｒ蜿ｳ遶ｯ蝗ｺ螳壹√◎縺ｮ蟾ｦ縺ｸ髮｣譏灘ｺｦ繝ｻ蠑ｷ蛹悶・轣ｽ螳ｳ 窶披・    ctx.fillStyle = "#5a9e48";
    for (let i = 0; i < player.lives; i++) {
      const cx = W - 10 - i * 14;
      ctx.beginPath();
      ctx.moveTo(cx, 9);
      ctx.lineTo(cx + 6, 26);
      ctx.lineTo(cx - 6, 26);
      ctx.closePath();
      ctx.fill();
    }
    ctx.textAlign = "right";
    let rx = W - lifeBlockW - 2;
    ctx.fillStyle = dColor;
    ctx.fillText(dShort, rx, y);
    rx -= ctx.measureText(dShort).width + gap;
    if (showEnrage) {
      ctx.fillStyle = "#e08050";
      ctx.fillText(enrageText, rx, y);
      rx -= ctx.measureText(enrageText).width + gap;
    }
    if (showDisaster) {
      ctx.fillStyle = "#e0c060";
      ctx.fillText("轣ｽ螳ｳ", rx, y);
    }

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    if (toastT > 0 && toast) {
      const a = Math.min(1, toastT / 20);
      ctx.globalAlpha = a;
      ctx.font = "12px 'Segoe UI', Meiryo, sans-serif";
      const tw = Math.min(ctx.measureText(toast).width, W - 40);
      const bx = W / 2 - tw / 2 - 10;
      ctx.fillStyle = "rgba(20, 40, 24, 0.92)";
      ctx.fillRect(bx, 44, tw + 20, 24);
      ctx.strokeStyle = "#5a9e48";
      ctx.strokeRect(bx, 44, tw + 20, 24);
      ctx.fillStyle = "#c8e870";
      ctx.textAlign = "center";
      ctx.fillText(toast, W / 2, 60, W - 48);
      ctx.globalAlpha = 1;
    }
  }

  function drawPause() {

  /** 繧ｹ繝｢繝・げ髴ｧ・郁ｦ九◆逶ｮ縺ｮ縺ｿ・峨る壼ｸｸ縺ｯ縺斐￥縺・▲縺吶ｉ蜈ｨ逕ｻ髱｢縲ょｷｨ螟ｧ縺ｯ縺ｾ縺繧俄・蠕舌・↓諡｡謨｣・育悄縺｣逋ｽ荳譫壹↓縺励↑縺・ｼ・*/
  function drawSmogFog() {
    let smogCount = 0;
    for (const e of enemies) {
      const et = ETYPES[e.type];
      if (et && et.kind === "smog") smogCount += 1;
    }
    // 蜻ｨ譛・竕・2.5遘偵・豼・ｷ｡・医ち繝ｼ繧ｲ繝・ヨ蛛ｴ縲よ緒逕ｻ縺ｯ繧ｹ繝繝ｼ繧ｺ蛟､・・    const wave = 0.5 + 0.5 * Math.sin(t * 0.042);
    let target = 0;
    if (giantSmog) {
      // 蠑ｷ蠎ｦ繝斐・繧ｯ縺ｯ謚代∴繧・ｼ亥ｱ謇繝悶Ο繝悶〒隕也阜荳崎憶繧貞・縺呻ｼ・      target = 0.42 + 0.12 * wave; // 竕・.42縲・.54
    } else if (smogCount > 0) {
      // 騾壼ｸｸ繧ｹ繝｢繝・げ・壹＃縺上≧縺｣縺吶ｉ
      const base = Math.min(0.075, smogCount * 0.01);
      target = base * (0.72 + 0.28 * wave);
    }
    // 謖・焚繧ｹ繝繝ｼ繧ｺ・壼・迴ｾ縺ｯ蠕舌・↓縲∵ｨｪ蛻・ｊ蠕後・譌ｩ繧√↓縺吶・縺｣縺ｨ阮・￥
    let k;
    if (target > smogFogAlphaSmooth) {
      k = giantSmog ? 0.013 : 0.1;
    } else if (giantSmog) {
      k = 0.04;
    } else {
      k = 0.09;
    }
    smogFogAlphaSmooth += (target - smogFogAlphaSmooth) * k;

    // 遨ｺ髢灘ｺ・′繧奇ｼ壼・迴ｾ荳ｭ縺縺・0竊・縲よｶ域ｻ・ｾ後・蠎・￡縺溘∪縺ｾ alpha 縺ｧ阮・ｌ繧・    if (giantSmog) {
      if (smogFogSpread < 1) {
        smogFogSpread = Math.min(1, smogFogSpread + 0.0055); // 竕・遘偵〒蜈ｨ髱｢蟇・ｊ
      }
    } else if (smogFogAlphaSmooth < 0.05) {
      smogFogSpread = 0;
    }

    if (smogFogAlphaSmooth < 0.003) {
      smogFogAlphaSmooth = 0;
      return;
    }

    // 蟾ｨ螟ｧ荳ｭ縲√∪縺溘・蟾ｨ螟ｧ蟶ｯ縺ｮ谿狗蕗・壹∪縺繧牙､壼ｱ､縲る壼ｸｸ阮・悸縺ｮ縺ｿ縺ｪ繧我ｸ譫壼｡励ｊ
    const mottled = !!giantSmog || smogFogAlphaSmooth > 0.12;
    if (!mottled) {
      ctx.fillStyle = `rgba(160, 190, 210, ${smogFogAlphaSmooth})`;
      ctx.fillRect(0, 0, W, H);
      return;
    }

    const intensity = smogFogAlphaSmooth;
    const spread = smogFogSpread;
    // ease: 蠎冗乢繧・▲縺上ｊ 竊・邨ら乢縺ｾ縺ｨ繧√※蠎・′繧・    const ease = spread * spread * (3 - 2 * spread);
    // 繝吶・繧ｹ閹懊・阮・￥・育悄縺｣逋ｽ髦ｲ豁｢・峨らｵら乢縺ｧ繧ょ・菴薙・繝ｼ繝ｫ縺ｯ謗ｧ縺医ａ
    const baseA = intensity * (0.10 + 0.16 * ease);
    ctx.fillStyle = `rgba(150, 180, 200, ${baseA})`;
    ctx.fillRect(0, 0, W, H);

    // 縺ｾ縺繧峨ヶ繝ｭ繝厄ｼ壼崋螳壹す繝ｼ繝我ｽ咲ｽｮ・句ｼｱ繝峨Μ繝輔ヨ縲Ｔpread 縺ｧ蜊雁ｾ・・蜃ｺ迴ｾ縺梧・髟ｷ
    const nBlobs = 11;
    for (let i = 0; i < nBlobs; i++) {
      // 豎ｺ螳夂噪縺ｪ逍台ｼｼ荵ｱ謨ｰ・域ｯ弱ヵ繝ｬ繝ｼ繝蜷後§驟咲ｽｮ・・      const u = ((i * 73 + 19) % 97) / 97;
      const v = ((i * 41 + 7) % 89) / 89;
      const dens = 0.55 + 0.45 * (((i * 17 + 3) % 11) / 10); // 豼・ｷ｡蟾ｮ
      // 蜃ｺ迴ｾ鬆・ｒ縺壹ｉ縺呻ｼ壼ｺ冗乢縺ｯ荳驛ｨ縺ｮ繝悶Ο繝悶□縺・      const appear = Math.min(1, Math.max(0, (spread - i * 0.055) / 0.35));
      if (appear <= 0.02) continue;
      const driftX = Math.sin(t * 0.011 + i * 1.7) * (10 + i * 1.2);
      const driftY = Math.cos(t * 0.009 + i * 2.1) * (8 + i * 0.9);
      const cx = u * W + driftX;
      const cy = 20 + v * (H - 40) + driftY;
      // 蠎冗乢縺ｯ蟆上＆繧√・邨ら乢縺ｯ螟ｧ縺阪￥驥阪↑繧・      const rBase = 28 + dens * 36 + (i % 3) * 10;
      const r = rBase * (0.35 + 0.95 * ease) * (0.75 + 0.35 * dens);
      const peak = Math.min(0.48, intensity * (0.38 + 0.28 * dens) * appear * (0.55 + 0.45 * ease));
      if (peak < 0.01) continue;
      const gr = ctx.createRadialGradient(cx, cy, r * 0.08, cx, cy, r);
      gr.addColorStop(0, `rgba(165, 195, 215, ${peak})`);
      gr.addColorStop(0.45, `rgba(145, 175, 200, ${peak * 0.55})`);
      gr.addColorStop(1, "rgba(140, 170, 195, 0)");
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * (0.72 + 0.12 * dens), 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw() {
    if (mode === "space") {
      drawSpaceStage();
      return;
    }
    drawBg();
    if (mode === "play" || mode === "clear" || mode === "over") {
      // 蠎企擇 竊・繝・ち・亥ｺ翫・荳奇ｼ俄・ 謨ｵ蠖ｱ縺､縺・竊・閾ｪ讖・縺ｮ鬆・〒 2.5D 縺ｮ蜑榊ｾ碁未菫・      drawGround();
      drawVines();
      drawEnemies();
      drawUfo();
      drawGiantSmog();
      drawDrops();
      drawDebris();
      drawBullets();
      drawDisasters();
      drawPlayer();
      drawTripleFx();
      drawParticles();
      // 繧ｹ繝｢繝・げ縺ｫ繧医ｋ隕也阜謔ｪ蛹厄ｼ医Ρ繝ｼ繝ｫ繝峨・荳翫・HUD/髮ｨ縺ｮ荳具ｼ・      drawSmogFog();
      drawHUD();
      // 髮ｨ縺ｯ HUD 縺ｮ荳翫↓驥阪・繧具ｼ域桃菴懊・邱大喧縺ｯ豁｢繧√↑縺・ｼ・      RainSystem.draw(ctx);
      drawPause();
    } else if (mode === "title" || mode === "opening" || mode === "howto" || mode === "void" || mode === "ground-ending" || mode === "emergency" || mode === "newmission" || mode === "dock") {
      t++;
      // 繝励Ξ繝薙Η繝ｼ縺ｯ蝗ｺ螳壹・邱大喧繧ｹ繝・ャ繝暦ｼ域ｯ弱ヵ繝ｬ繝ｼ繝 rebuildRoots 縺励↑縺・ｼ・      const saveG = greenProgress;
      greenProgress = 0.55;
      vineGrowth = 0.55;
      drawGround();
      if ((t & 1) === 0) drawVines(); // 繧ｿ繧､繝医Ν縺ｯ1繝輔Ξ繝ｼ繝縺翫″縺ｫ繝・ち
      greenProgress = saveG;
      const px = W / 2 - 18, py = GROUND_Y - 32;
      drawGroundShadow(px + 18, 0.04, 16, 5, 0.3);
      ctx.fillStyle = "#141414";
      ctx.fillRect(px + 2, py + 8, 32, 12);
      ctx.strokeStyle = "#d0d0d0";
      ctx.strokeRect(px + 2, py + 8, 32, 12);
      ctx.fillStyle = "#0a0a0a";
      ctx.fillRect(px + 15, py + 2, 6, 8);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px 'Segoe UI', Meiryo, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("X", px + 18, py + 14);
    }
  }

  function clearOpeningTimer() {
    if (openingTimer != null) {
      clearTimeout(openingTimer);
      openingTimer = null;
    }
  }

  function scheduleOpeningAuto() {
    clearOpeningTimer();
    // 3騾｣縺ｮ譛邨ゆｻ･螟悶・縺ｿ閾ｪ蜍包ｼ医ち繧､繝医Ν繝ｻ譛邨ゅ・蠕・ｩ滂ｼ・    if (mode !== "opening" || !isOpeningAutoSlide()) return;
    openingTimer = setTimeout(() => {
      openingTimer = null;
      if (mode !== "opening" || !isOpeningAutoSlide()) return;
      advanceOpening(false);
    }, OPENING_AUTO_MS);
  }

  /** 繧｢繧ｯ繧ｻ繧ｹ 竊・OPINFO・医せ繝医・繝ｪ繝ｼ・・*/
  function leaveAccessToStory() {
    if (mode !== "opening" || !isOpeningTitleSlide()) return;
    clearTitleEnterDebounce();
    clearOpeningTimer();
    ensureAudio();
    if (actx && actx.state === "suspended") {
      try { actx.resume(); } catch (_) {}
    }
    try { sfxConfirm(); } catch (_) {}
    openingStep = 1;
    applyOpeningSlide();
  }

  /** OPINFO 竊・howto・域桃菴懆ｪｬ譏趣ｼ・*/
  function leaveStoryToHowto() {
    if (mode !== "opening" || openingStep < 1) return;
    clearOpeningTimer();
    ensureAudio();
    if (actx && actx.state === "suspended") {
      try { actx.resume(); } catch (_) {}
    }
    try { sfxConfirm(); } catch (_) {}
    showHowto();
  }

  /**
   * 繧ｿ繧､繝医Ν・医い繧ｯ繧ｻ繧ｹ・画桃菴懊・   * 繧ｹ繧ｿ繝ｼ繝茨ｼ拾nter 竊・OPINFO
   * Enter騾｣謇・竊・繧､繝ｼ繧ｸ繝ｼ縺ｧ譛ｬ邱ｨ逶ｴ繧ｹ繧ｿ繝ｼ繝・   */
  function handleTitleStart(fromButton) {
    if (mode !== "opening" || !isOpeningTitleSlide()) return;
    ensureAudio();
    if (actx && actx.state === "suspended") {
      try { actx.resume(); } catch (_) {}
    }
    if (fromButton) {
      leaveAccessToStory();
      return;
    }
    titleEnterCount++;
    if (titleEnterCount >= 2) {
      clearTitleEnterDebounce();
      setDifficulty("easy");
      try { sfxConfirm(); } catch (_) {}
      start();
      return;
    }
    if (titleEnterDebounce != null) clearTimeout(titleEnterDebounce);
    titleEnterDebounce = setTimeout(() => {
      titleEnterDebounce = null;
      titleEnterCount = 0;
      if (mode === "opening" && isOpeningTitleSlide()) {
        leaveAccessToStory();
      }
    }, TITLE_ENTER_MASH_MS);
  }

  /** Enter / 繝懊ち繝ｳ縺ｮ遒ｺ螳壼・逅・ｼ医い繧ｯ繧ｻ繧ｹ or OPINFO・・*/
  function handleOpeningConfirm() {
    if (mode !== "opening") return;
    if (isOpeningTitleSlide()) {
      handleTitleStart(false);
      return;
    }
    // OPINFO・哢EXT / Enter 竊・howto
    leaveStoryToHowto();
  }

  function applyOpeningSlide() {
    if (openingStep < 0) openingStep = 0;
    if (openingStep >= OPENING_SLIDES.length) openingStep = OPENING_SLIDES.length - 1;
    const slide = OPENING_SLIDES[openingStep] || OPENING_SLIDES[0];
    const isAccess = openingStep === 0;
    const isStory = openingStep === 1;
    if (openingEl) {
      openingEl.classList.toggle("story-mode", !!isStory);
    }
    if (opDrama) {
      // 逕ｻ蜒丞・縺ｫ繧ｿ繧､繝医Ν縺後≠繧九・縺ｧ譫荳翫ユ繧ｭ繧ｹ繝医・謗ｧ縺医ａ・上せ繝医・繝ｪ繝ｼ縺ｯ髱櫁｡ｨ遉ｺ蟇・ｊ
      opDrama.textContent = isAccess ? slide.title : "";
      opDrama.style.display = isAccess ? "" : "none";
    }
    if (opSkipBtn) opSkipBtn.classList.add("hidden");
    if (opStartBtn) {
      if (isAccess) {
        opStartBtn.textContent = "繧ｹ繧ｿ繝ｼ繝・;
        opStartBtn.classList.remove("hidden");
      } else if (isStory) {
        opStartBtn.textContent = "NEXT";
        opStartBtn.classList.remove("hidden");
      } else {
        opStartBtn.classList.add("hidden");
      }
    }
    if (opHintEl) {
      if (isAccess) {
        opHintEl.textContent = "繧ｹ繧ｿ繝ｼ繝・= ENTER 竊・繧ｹ繝医・繝ｪ繝ｼ ﾂｷ 騾｣謇薙〒繧､繝ｼ繧ｸ繝ｼ蜊ｳ髢句ｧ・;
      } else if (isStory) {
        opHintEl.textContent = "NEXT / ENTER 竊・謫堺ｽ懆ｪｬ譏・;
      } else {
        opHintEl.textContent = "";
      }
    }
    if (opPoster) {
      const src = slide.image;
      opPoster.alt = slide.title || "Opening";
      opPoster.onload = () => {
        if (mode === "opening" && opPoster.getAttribute("src") === src) {
          opPoster.classList.add("show");
        }
      };
      opPoster.onerror = () => {
        if (opPoster.getAttribute("src") === src) opPoster.classList.remove("show");
      };
      if (opPoster.getAttribute("src") !== src) {
        opPoster.classList.remove("show");
        opPoster.src = src;
      } else if (opPoster.complete && opPoster.naturalWidth > 0) {
        opPoster.classList.add("show");
      }
    }
    clearOpeningTimer();
  }

  /** 蝨ｰ荳顔ｷｨ繧ｨ繝ｳ繝・ぅ繝ｳ繧ｰ 竊・繧ｲ繝ｼ繝髢句ｧ句燕縺ｮ繧ｿ繧､繝医Ν・医い繧ｯ繧ｻ繧ｹ・臥判髱｢ */

  function dockThrusterHum(dur, vol, pitch) {
    if (!actx) return;

      const c = actx;
      const t0 = c.currentTime;

      const g = c.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(50 * (pitch || 1), t0);
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.3);
      g.gain.linearRampToValueAtTime(vol * 0.7, t0 + dur * 0.8);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (_) {}
  }
  function dockSideHum(dur, vol) {
    if (!actx) return;

      const o = c.createOscillator();

      o.type = "sawtooth";

      g.gain.setValueAtTime(0.001, t0);

    } catch (_) {}
  }
  function dockShuuu(dur, vol) {
    if (!actx) return;
    try {
      const c = actx;
      const t0 = c.currentTime;
      const n = c.createBufferSource();
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.7;
      n.buffer = buf;
      const f = c.createBiquadFilter();
      f.type = "bandpass";
      f.frequency.setValueAtTime(1500, t0);
      f.frequency.exponentialRampToValueAtTime(320, t0 + dur);
      f.Q.value = 0.7;
      const g = c.createGain();
      const v = vol || 0.065;
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(v, t0 + 0.12);
      g.gain.linearRampToValueAtTime(v * 0.4, t0 + dur * 0.55);
      g.gain.linearRampToValueAtTime(0.001, t0 + dur);
      n.connect(f); f.connect(g); g.connect(c.destination);
      n.start(t0); n.stop(t0 + dur + 0.05);
    } catch (_) {}
  }

  /** 繧ｷ繝･繝代・・磯ｫ倬溘せ繧ｦ繧｣繝ｼ繝暦ｼ・*/
  function sfxWhoosh() {
    if (!audioOk || !actx) {
      ensureAudio();
      if (!audioOk || !actx) return;
    }
    try {
      const t0 = actx.currentTime;
      const o1 = actx.createOscillator();
      const g1 = actx.createGain();
      o1.type = "sawtooth";
      o1.frequency.setValueAtTime(2200, t0);
      o1.frequency.exponentialRampToValueAtTime(260, t0 + 0.42);
      g1.gain.setValueAtTime(0.001, t0);
      g1.gain.linearRampToValueAtTime(0.09, t0 + 0.02);
      g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.48);
      o1.connect(g1);
      g1.connect(actx.destination);
      o1.start(t0);
      o1.stop(t0 + 0.5);

      const o2 = actx.createOscillator();
      const g2 = actx.createGain();
      o2.type = "square";
      o2.frequency.setValueAtTime(880, t0);
      o2.frequency.exponentialRampToValueAtTime(110, t0 + 0.36);
      g2.gain.setValueAtTime(0.001, t0);
      g2.gain.linearRampToValueAtTime(0.05, t0 + 0.015);
      g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
      o2.connect(g2);
      g2.connect(actx.destination);
      o2.start(t0);
      o2.stop(t0 + 0.42);

      const o3 = actx.createOscillator();
      const g3 = actx.createGain();
      o3.type = "sine";
      o3.frequency.setValueAtTime(160, t0 + 0.05);
      o3.frequency.exponentialRampToValueAtTime(50, t0 + 0.55);
      g3.gain.setValueAtTime(0.001, t0 + 0.05);
      g3.gain.linearRampToValueAtTime(0.065, t0 + 0.1);
      g3.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
      o3.connect(g3);
      g3.connect(actx.destination);
      o3.start(t0 + 0.05);
      o3.stop(t0 + 0.62);
    } catch (_) {}
  }
