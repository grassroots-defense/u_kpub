      ctx.save();
      ctx.globalAlpha = a;
      // 謇・憾繝ｻ蜷悟ｿ・・蠑ｧ・亥承荳頑婿蜷代∈・・      const maxR = 120 + (90 - vr.radioT) * 1.2;
      const rings = 6;
      for (let i = 0; i < rings; i++) {
        const prog = (i / rings + (t * 0.015)) % 1;
        const r = 20 + prog * maxR;
        const alpha = (1 - prog) * a * 0.85;
        ctx.strokeStyle = `rgba(100, 220, 150, ${alpha})`;
        ctx.lineWidth = 1.5 + (1 - prog) * 1.2;
        ctx.beginPath();
        // 蝨ｰ逅・°繧牙承荳翫∈謇・ｽ｢・育ｴ・-20ﾂｰ縲・-70ﾂｰ・・        ctx.arc(ex, ey, r, -Math.PI * 0.42, -Math.PI * 0.08, false);
        ctx.stroke();
      }
      // 遏ｭ縺・叛蟆・ぎ繧､繝臥ｷ・      ctx.strokeStyle = `rgba(140, 240, 180, ${0.35 * a})`;
      ctx.lineWidth = 1;
      for (let k = 0; k < 3; k++) {
        const ang = -Math.PI * (0.12 + k * 0.12);
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(ang) * 12, ey + Math.sin(ang) * 12);
        ctx.lineTo(ex + Math.cos(ang) * (maxR * 0.55), ey + Math.sin(ang) * (maxR * 0.55));
        ctx.stroke();
      }
      // 繝ｩ繝吶Ν
      ctx.fillStyle = `rgba(120, 230, 160, ${0.95 * a})`;
      ctx.font = "11px 'Segoe UI', Meiryo, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("蝨ｰ逅・欠莉､螳､ 菫｡蜿ｷ騾∽ｿ｡", 70, H - 36);
      ctx.restore();
    }

    // 縺雁勧縺代い繧､繝・Β
    for (const a of spaceAssists) {
      const yy = a.y + Math.sin(a.bob) * 3;
      ctx.save();
      ctx.translate(a.x, yy);
      // 縺阪ｉ縺阪ｉ
      ctx.globalAlpha = 0.35 + Math.sin(a.bob * 2) * 0.15;
      ctx.fillStyle = a.kind === "repair" ? "#7ec850" : (a.kind === "shield" ? "#60c0e0" : "#e0c040");
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px 'Segoe UI', Meiryo, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const icon = a.kind === "repair" ? "肌" : (a.kind === "shield" ? "孱" : "笞｡");
      ctx.fillText(icon, 0, 1);
      ctx.restore();
    }

    // VOID HP繧ｲ繝ｼ繧ｸ・井ｸ贋ｸｭ螟ｮ・・    if (vr.hpVisible) {
      const gw = 220, gh = 10;
      const gx = (W - gw) / 2, gy = 36;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(gx - 2, gy - 2, gw + 4, gh + 4);
      ctx.fillStyle = "rgba(40,10,60,0.9)";
      ctx.fillRect(gx, gy, gw, gh);
      const ratio = Math.max(0, vr.hp / vr.hpMax);
      const grad = ctx.createLinearGradient(gx, 0, gx + gw, 0);
      grad.addColorStop(0, "#c060ff");
      grad.addColorStop(1, "#ff40c0");
      ctx.fillStyle = grad;
      ctx.fillRect(gx, gy, gw * ratio, gh);
      ctx.strokeStyle = "rgba(200,160,255,0.7)";
      ctx.lineWidth = 1;
      ctx.strokeRect(gx, gy, gw, gh);
      ctx.fillStyle = "rgba(220,200,255,0.9)";
      ctx.font = "10px 'Segoe UI', Meiryo, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("VOID", W / 2, gy - 4);
    }

    // UNIT繧ｲ繝ｼ繧ｸ・亥承荳九・蟆上＆繧・ｼ俄・VOID縺ｨ蜷梧凾・・pVisible・・    if (vr.hpVisible) {
      const pgw = 110, pgh = 8;
      const pgx = W - pgw - 14;
      const pgy = H - 28;
      const maxU = player.unitHpMax || 100;
      const curU = player.unitHp != null ? player.unitHp : maxU;
      const lifeR = Math.max(0, Math.min(1, curU / maxU));
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(pgx - 2, pgy - 2, pgw + 4, pgh + 4);
      ctx.fillStyle = "rgba(10,30,16,0.9)";
      ctx.fillRect(pgx, pgy, pgw, pgh);
      const pg = ctx.createLinearGradient(pgx, 0, pgx + pgw, 0);
      pg.addColorStop(0, "#3a8a40");
      pg.addColorStop(1, "#7ec850");
      ctx.fillStyle = pg;
      ctx.fillRect(pgx, pgy, pgw * lifeR, pgh);
      ctx.strokeStyle = "rgba(140,200,120,0.75)";
      ctx.lineWidth = 1;
      ctx.strokeRect(pgx, pgy, pgw, pgh);
      ctx.fillStyle = "rgba(180,230,160,0.9)";
      ctx.font = "10px 'Segoe UI', Meiryo, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("UNIT", pgx + pgw, pgy - 4);
    }
  }

  function drawSpaceStage() {
    // Phase1繝吶・繧ｹ・壽囓縺・ｮ・ｮ吶・縺ｿ・域弌髮ｲ繝ｻspace_bg縺ｪ縺暦ｼ・    ctx.fillStyle = "#03060f";
    ctx.fillRect(0, 0, W, H);
    // 譏溘・蟆代↑繧・    for (let i = 0; i < spaceStars.length; i++) {
      const s = spaceStars[i];
      if (i % 3 !== 0) continue;
      ctx.globalAlpha = 0.35 + (Math.sin(t * s.spd + s.tw) * 0.25 + 0.25) * s.a * 0.5;
      ctx.fillStyle = "#d0dce8";
      ctx.fillRect(s.x, s.y, s.r > 1 ? 1.4 : 1, s.r > 1 ? 1.4 : 1);
    }
    ctx.globalAlpha = 1;

    // 蟾ｦ荳具ｼ壼慍逅・ｼ医さ繝ｳ繧ｻ繝励ヨ蜷梧ｧ倥・髱堤帥菴難ｼ狗ｷ大､ｧ髯ｸ・冗判蜒上↓萓晏ｭ倥＠縺ｪ縺・ｼ・    {
      const er = Math.min(W, H) * 0.145;
      const ex = er * 0.55;
      const ey = H - er * 0.55;
      // 譛ｬ菴・      const g = ctx.createRadialGradient(ex - er * 0.28, ey - er * 0.32, er * 0.08, ex, ey, er);
      g.addColorStop(0, "#7ec8e8");
      g.addColorStop(0.35, "#3a90c0");
      g.addColorStop(0.7, "#1a4e78");
      g.addColorStop(1, "#071828");
      ctx.beginPath();
      ctx.arc(ex, ey, er, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      // 邱代・螟ｧ髯ｸ・壼圏邀ｳ蝙具ｼ医い繝ｩ繧ｹ繧ｫ・九き繝翫ム蠎・＞蝪奇ｼ狗ｱｳ蝗ｽ・九ヵ繝ｭ繝ｪ繝・九Γ繧ｭ繧ｷ繧ｳ・・      ctx.save();
      ctx.beginPath();
      ctx.arc(ex, ey, er * 0.98, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = "rgba(58, 138, 64, 0.92)";
      ctx.beginPath();
      // 繧｢繝ｩ繧ｹ繧ｫ蜊雁ｳｶ・亥ｷｦ縺ｸ遯√″蜃ｺ縺暦ｼ・      ctx.moveTo(ex - er * 0.22, ey - er * 0.22);
      ctx.quadraticCurveTo(ex - er * 0.48, ey - er * 0.28, ex - er * 0.55, ey - er * 0.18);
      ctx.quadraticCurveTo(ex - er * 0.50, ey - er * 0.08, ex - er * 0.38, ey - er * 0.12);
      // 繧ｫ繝翫ム蛹苓･ｿ縲懷圏讌ｵ蟇・ｊ
      ctx.quadraticCurveTo(ex - er * 0.30, ey - er * 0.36, ex - er * 0.08, ey - er * 0.42);
      ctx.quadraticCurveTo(ex + er * 0.12, ey - er * 0.44, ex + er * 0.22, ey - er * 0.32);
      // 繧ｫ繝翫ム譚ｱ縲應ｺ泌､ｧ貉悶≠縺溘ｊ
      ctx.quadraticCurveTo(ex + er * 0.30, ey - er * 0.18, ex + er * 0.26, ey - er * 0.02);
      // 譚ｱ豬ｷ蟯ｸ蜊嶺ｸ・      ctx.quadraticCurveTo(ex + er * 0.28, ey + er * 0.12, ex + er * 0.24, ey + er * 0.20);
      // 繝輔Ο繝ｪ繝蜊雁ｳｶ
      ctx.quadraticCurveTo(ex + er * 0.28, ey + er * 0.30, ex + er * 0.18, ey + er * 0.36);
      ctx.quadraticCurveTo(ex + er * 0.12, ey + er * 0.30, ex + er * 0.10, ey + er * 0.22);
      // 繝｡繧ｭ繧ｷ繧ｳ縺ｸ邏ｰ縺丞漉荳・      ctx.quadraticCurveTo(ex + er * 0.02, ey + er * 0.34, ex - er * 0.08, ey + er * 0.40);
      ctx.quadraticCurveTo(ex - er * 0.14, ey + er * 0.32, ex - er * 0.12, ey + er * 0.20);
      // 隘ｿ豬ｷ蟯ｸ蛹嶺ｸ・      ctx.quadraticCurveTo(ex - er * 0.22, ey + er * 0.06, ex - er * 0.28, ey - er * 0.08);
      ctx.quadraticCurveTo(ex - er * 0.26, ey - er * 0.18, ex - er * 0.22, ey - er * 0.22);
      ctx.closePath();
      ctx.fill();
      // 蜀・匣縺ｮ豼・＞邱托ｼ医Ο繝・く繝ｼ縲應ｸｭ驛ｨ・・      ctx.fillStyle = "rgba(40, 105, 48, 0.55)";
      ctx.beginPath();
      ctx.ellipse(ex - er * 0.04, ey - er * 0.04, er * 0.13, er * 0.16, -0.15, 0, Math.PI * 2);
      ctx.fill();
      // 繧ｰ繝ｪ繝ｼ繝ｳ繝ｩ繝ｳ繝蛾｢ｨ
      ctx.fillStyle = "rgba(72, 155, 78, 0.7)";
      ctx.beginPath();
      ctx.ellipse(ex + er * 0.20, ey - er * 0.34, er * 0.07, er * 0.05, 0.25, 0, Math.PI * 2);
      ctx.fill();
      // 荳ｭ邀ｳ縺ｮ邏ｰ縺・ｶ壹″
      ctx.fillStyle = "rgba(55, 130, 60, 0.75)";
      ctx.beginPath();
      ctx.ellipse(ex - er * 0.06, ey + er * 0.38, er * 0.05, er * 0.07, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // 螟ｧ豌励Μ繝ｳ繧ｰ
      ctx.strokeStyle = "rgba(140, 210, 255, 0.55)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(ex, ey, er + 1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(100, 180, 255, 0.18)";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(ex, ey, er + 5, 0, Math.PI * 2);
      ctx.stroke();
    }

    // VOID蜃ｺ迴ｾ・壼･･縺ｮ螳・ｮ吶ぎ繧ｹ 竊・譎ｴ繧・竊・繧ｳ繧｢
    drawVoidReveal();
    drawVoidCracks();

    // 蠑ｾ / 繝ｬ繝ｼ繧ｶ繝ｼ
    for (const b of bullets) {
      if (b.kind === "laser") {
        const g = ctx.createLinearGradient(b.x, b.y + b.h, b.x, b.y);
        g.addColorStop(0, "rgba(120,220,255,0.15)");
        g.addColorStop(0.4, "rgba(160,240,255,0.95)");
        g.addColorStop(1, "rgba(255,255,255,0.9)");
        ctx.fillStyle = g;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "rgba(200,250,255,0.5)";
        ctx.fillRect(b.x - 1, b.y, b.w + 2, 4);
      } else {
        ctx.fillStyle = "#a0e8ff";
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
    }

    // 繝悶・繧ｹ繧ｿ繝ｼX・医せ繧ｿ繝ｼ繝ｪ繝ｳ繧ｯ縺ｪ縺暦ｼ・    const sx = player.x;
    const sy = player.y;
    // 荳頑・荳ｭ・壹お繝ｳ繧ｸ繝ｳ蝎ｴ蟆・ン繝ｼ繝・医⊇縺ｮ逋ｽ竊帝搨・・    if (spaceAscentT > 0) {
      const cx = sx + player.w / 2;
      const by = sy + player.h - 1;
      const len = 36 + (spaceAscentT / 90) * 28;
      const g = ctx.createLinearGradient(cx, by, cx, by + len);
      g.addColorStop(0, "rgba(255,255,255,0.95)");
      g.addColorStop(0.2, "rgba(180,230,255,0.85)");
      g.addColorStop(0.55, "rgba(60,150,255,0.45)");
      g.addColorStop(1, "rgba(30,80,200,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx - 5, by);
      ctx.lineTo(cx + 5, by);
      ctx.lineTo(cx + 2, by + len);
      ctx.lineTo(cx - 2, by + len);
      ctx.closePath();
      ctx.fill();
      // 螟門・繧ｰ繝ｭ繝ｼ
      const g2 = ctx.createLinearGradient(cx, by, cx, by + len * 0.85);
      g2.addColorStop(0, "rgba(140,210,255,0.35)");
      g2.addColorStop(1, "rgba(40,100,220,0)");
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(cx - 11, by);
      ctx.lineTo(cx + 11, by);
      ctx.lineTo(cx + 3, by + len * 0.85);
      ctx.lineTo(cx - 3, by + len * 0.85);
      ctx.closePath();
      ctx.fill();
    }
    if (imgSpaceShip && imgSpaceShip.complete && imgSpaceShip.naturalWidth > 0) {
      ctx.drawImage(imgSpaceShip, sx, sy, player.w, player.h);
    } else {
      ctx.fillStyle = "#1a1a22";
      ctx.fillRect(sx, sy, player.w, player.h);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("X", sx + player.w / 2, sy + player.h / 2 + 4);
    }
    // 蝎ｴ蟆・ヱ繝ｼ繝・ぅ繧ｯ繝ｫ・井ｸ頑・荳ｭ縺ｮ縺ｿ・・    if (spaceAscentT > 0) {
      for (const p of particles) {
        const a = Math.max(0, p.life / (p.max || 30));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color || "#9cf";
        const sz = p.size || 2;
        ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
      }
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = "rgba(180,220,255,0.7)";
    ctx.font = "12px 'Segoe UI', Meiryo, sans-serif";
    ctx.textAlign = "left";
    const hudLabel =
      voidReveal.phase === "linked" || voidReveal.phase === "aggro"
        ? "THE VOID 窶・Phase1  繝ｪ繝ｳ繧ｯ螻暮幕"
        : voidReveal.phase === "present" || voidReveal.phase === "clear"
          ? "THE VOID 窶・隨ｬ荳驕ｭ驕・
          : "VOID Phase1 窶・蝨ｰ逅・ｼ九ヶ繝ｼ繧ｹ繧ｿ繝ｼX";
    ctx.fillText(hudLabel, 12, 22);
    if (toastT > 0 && toast) {
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(200,240,255,0.9)";
      ctx.font = "bold 14px 'Segoe UI', Meiryo, sans-serif";
      ctx.fillText(toast, W / 2, 48);
    }
  }

  function update() {
    if (mode === "space") {
      if (!paused) updateSpace();
      return;
    }
    if (mode !== "play" || paused) return;
    t++;
    if (toastT > 0) toastT--;
    if (invuln > 0) invuln--;
    if (player.cool > 0) player.cool--;
    if (freezeT > 0) freezeT--;
    if (muteShootT > 0) muteShootT--;
    if (player.shieldFlashT > 0) player.shieldFlashT--;
    refreshStatusTint();
    syncVineGrowth();
    // 繧ｳ繝ｭ繝九・蛻晏・迴ｾ繝ｻ蛻晏ｮ梧・縺ｯ蠢・★譛ｪ陲ｫ蠑ｾ陦ｨ遉ｺ
    if (_landTowns) syncColonySpawnHealth();
    updateTripleFx();
    RainSystem.update();
    RiverSheen.update();

    // 騾｣蟆・・荳蛾｣縺ｮ譎る俣蛻ｶ髯撰ｼ育ｴ・遘抵ｼ・    if (player.rapidT > 0) {
      player.rapidT--;
      if (player.rapidT <= 0) {
        player.rapid = false;
        player.rapidT = 0;
        showToast("笞｡ 騾溷ｰ・邨ゆｺ・);
      }
    }
    if (player.tripleT > 0) {
      player.tripleT--;
      if (player.tripleT <= 0) {
        player.triple = false;
        player.tripleT = 0;
        showToast("竕｡ 3轤ｹ蟆・茶 邨ゆｺ・);
      }
    }

    // 繝帙ヰ繝ｼ豬ｮ驕・+ 蟆・茶蜿榊虚・亥燕繝輔Ξ繝ｼ繝蛻・ｒ貂幄｡ｰ縺励※縺九ｉ菴咲ｽｮ遒ｺ螳夲ｼ・    updatePlayerRecoil();
    updatePlayerTilt();
    player.y = playerBaseY();

    const L = keys["ArrowLeft"] || keys["KeyA"];
    const R = keys["ArrowRight"] || keys["KeyD"];
    if (freezeT <= 0) {
      if (L) {
        player.x -= player.speed;
        player.track -= 1.2;
      }
      if (R) {
        player.x += player.speed;
        player.track += 1.2;
      }
    }
    if (player.x < 8) player.x = 8;
    if (player.x + player.w > W - 8) player.x = W - 8 - player.w;

    // Can still shoot while frozen (only movement stops)
    if (keys["Space"] || keys["KeyZ"]) shoot();

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y += b.vy;
      if (b.vx) b.x += b.vx;
      if (b.y + b.h < 0 || b.x < -20 || b.x > W + 20) {
        bullets.splice(i, 1);
        continue;
      }
      const dmg = b.dmg || 1;

      if (ufo && hitRect(b, ufo)) {
        bullets.splice(i, 1);
        ufo.hp -= dmg;
        burst(b.x, b.y, "#e0c060", 5);
        if (ufo.hp <= 0) destroyUfo();
        continue;
      }
      if (giantSmog && hitRect(b, giantSmog)) {
        bullets.splice(i, 1);
        giantSmog.hp -= dmg;
        burst(b.x, b.y, "#b0b0c8", 5);
        if (giantSmog.hp <= 0) destroyGiantSmog();
        continue;
      }
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!hitRect(b, e)) continue;
        bullets.splice(i, 1);
        e.hp -= dmg;
        burst(e.x + e.w / 2, e.y + e.h / 2, ETYPES[e.type].color, 4);
        if (e.hp <= 0) killEnemy(e, j);
        break;
      }
    }

    updateBossTimers();
    updateDisasters();
    if (mode !== "play") return;

    let hitEdge = false;
    const speed = enemyMoveSpeed() + (1 - enemies.length / Math.max(1, 50)) * 0.35;
    for (const e of enemies) {
      e.x += dir * speed;
      e.anim += 0.08;
      if (e.x < 10 || e.x + e.w > W - 10) hitEdge = true;
    }
    if (hitEdge) {
      dir *= -1;
      for (const e of enemies) {
        e.y += 12;
        e.x += dir * speed;
      }
    }

    for (const e of enemies) {
      if (e.y + e.h >= player.y) {
        gameOver(false);
        return;
      }
    }

    fireTimer--;
    if (fireTimer <= 0 && enemies.length) {
      fireTimer = enemyFireInterval();
      // 髱｢繧ｯ繝ｪ繧｢縺斐→蠑ｾ謨ｰ+2%・壹ム繝悶Ν繧ｷ繝ｧ繝・ヨ遒ｺ邇・ｸ頑・
      const multiChance = Math.min(0.55, (0.08 + waveScale() * 0.02) * attackVolume());
      const multi = Math.random() < multiChance ? 2 : 1;
      for (let k = 0; k < multi; k++) {
        const shooter = enemies[Math.floor(Math.random() * enemies.length)];
        const et = ETYPES[shooter.type];
        const ox = k === 1 ? 6 : 0;
        const sx = shooter.x + shooter.w / 2;
        const sy = shooter.y + shooter.h;
        // 謨ｵ繧ｿ繧､繝怜挨謾ｻ謦・        if (et.kind === "smog") {
          // 逵溘▲縺吶＄蠑ｾ
          enemyBullets.push({
            kind: "straight",
            x: sx - 2 + ox,
            y: sy,
            w: 4, h: 9,
            vy: enemyBulletSpeed(),
            vx: 0,
          });
        } else if (et.kind === "plastic") {
          // 繧ｸ繧ｰ繧ｶ繧ｰ蠑ｾ
          enemyBullets.push({
            kind: "zigzag",
            x: sx - 2.5 + ox,
            y: sy,
            w: 5, h: 9,
            vy: enemyBulletSpeed(),
            vx: 0,
            zigPhase: Math.random() * Math.PI * 2,
            zigAmp: 1.4 + Math.random() * 0.9,
            zigFreq: 0.14 + Math.random() * 0.09,
            trail: [],
          });
        } else {
          // 逞・次菴難ｼ壼ｰ丞梛繧ｭ繝｣繝ｩ蠑ｾ・・0%邵ｮ蟆上・繧｢繝｡繝ｼ繝撰ｼ・          const sc = 0.8;
          enemyBullets.push({

            vy: enemyBulletSpeed() * 0.92,

        }
      }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      if (b.kind === "zigzag") {
        b.zigPhase = (b.zigPhase || 0) + (b.zigFreq || 0.16);
        const zig = Math.sin(b.zigPhase) * (b.zigAmp || 1.4);
        b.x += zig;
        if (!b.trail) b.trail = [];
        b.trail.push({ x: b.x + b.w / 2, y: b.y + b.h / 2 });
        if (b.trail.length > 7) b.trail.shift();
      } else if (b.kind === "mini") {
        b.anim = (b.anim || 0) + 0.15;
        b.x += Math.sin(b.anim) * 0.35;
      }
      // straight: vx=0
      b.y += b.vy;

      if (player.shield > 0) {
        const pad = 7;
        const box = {
          x: player.x - pad,
          y: player.y - pad,
          w: player.w + pad * 2,
          h: player.h + pad * 2,
        };
        if (hitRect(b, box)) {
          enemyBullets.splice(i, 1);
          if (hurtPlayer({ hitX: b.x + b.w / 2 })) return;
          continue;
        }
      }

      if (b.y + b.h >= GROUND_Y) {
        enemyBullets.splice(i, 1);
        applyGroundHit();
        burst(b.x + b.w / 2, GROUND_Y, b.kind === "mini" ? "#c060a0" : "#886644", 6);
        continue;
      }
      if (b.y > H || b.x < -40 || b.x > W + 40) {

        continue;

        if (hurtPlayer({ hitX: b.x + b.w / 2 })) return;
      }
    }

    updateDebris();

    emitCriticalSmoke();
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.kind === "smoke") {
        p.vy -= 0.018;
        p.vx *= 0.98;
        p.s += 0.06;

      if (p.life <= 0) particles.splice(i, 1);
    }

      } else {

  // 窶披・Drawing 窶披・  // 16bit鬚ｨ繝ｻ蟯ｩ螻ｱ・亥崋螳壹す繝ｼ繝臥沿・・  function drawRockyMountain(ctx, baseX, baseY, width, height, seed = 1) {
    function rand() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    const points = [];
    const steps = 18;

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = baseX + width * t;
      const mainShape = Math.sin(t * Math.PI);
      const rough =
        Math.sin(t * Math.PI * 5) * 0.10 +
        Math.sin(t * Math.PI * 11) * 0.04 +
        (rand() - 0.5) * 0.08;
      const y = baseY - height * Math.max(0, mainShape + rough);
      points.push({ x, y });
    }

    // 螂･縺ｮ螻ｱ (seed 5/6)・夊牡繧呈囓縺上・菴弱さ繝ｳ繝医Λ繧ｹ繝医↓・域焔蜑阪・縺昴・縺ｾ縺ｾ・・    const far = seed === 5 || seed === 6;
    const mul = far ? 0.68 : 1;
    function dimHex(hex, m) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.round(((n >> 16) & 255) * m);
      const g = Math.round(((n >> 8) & 255) * m);
      const b = Math.round((n & 255) * m);
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    // 驕譎ｯ縺ｯ縺輔ｉ縺ｫ髱｢蜷悟｣ｫ縺ｮ蟾ｮ繧貞ｯ・○縺ｦ菴弱さ繝ｳ繝医Λ繧ｹ繝亥喧
    const colFill = far ? dimHex("#594b3e", mul) : "#594b3e";
    const colFacet1 = far ? dimHex("#786957", mul * 0.95) : "#786957";
    const colFacet2 = far ? dimHex("#665747", mul * 0.92) : "#665747";
    const colFacet3 = far ? dimHex("#40372f", mul * 1.05) : "#40372f";
    const colCrack = far ? dimHex("#302923", mul * 0.9) : "#302923";
    const colRidge = far ? dimHex("#8c7a63", mul * 0.85) : "#8c7a63";

    ctx.beginPath();
    ctx.moveTo(baseX, baseY);
    for (const p of points) ctx.lineTo(p.x, p.y);
    ctx.lineTo(baseX + width, baseY);
    ctx.closePath();
    ctx.fillStyle = colFill;
    ctx.fill();

    drawFacet(ctx, [
      pointAt(0.22), pointAt(0.40), pointAt(0.50),
      { x: baseX + width * 0.42, y: baseY },
      { x: baseX + width * 0.18, y: baseY }
    ], colFacet1);

    drawFacet(ctx, [
      pointAt(0.48), pointAt(0.58), pointAt(0.72),
      { x: baseX + width * 0.66, y: baseY },
      { x: baseX + width * 0.50, y: baseY }
    ], colFacet2);

    drawFacet(ctx, [
      pointAt(0.50), pointAt(0.63), pointAt(0.79),
      { x: baseX + width * 0.76, y: baseY },
      { x: baseX + width * 0.58, y: baseY }
    ], colFacet3);

    ctx.strokeStyle = colCrack;
    ctx.lineWidth = 2;
    ctx.globalAlpha = far ? 0.55 : 0.8;
    drawCrack(0.32, 0.34);
    drawCrack(0.47, 0.28);
    drawCrack(0.61, 0.42);
    drawCrack(0.72, 0.48);
    ctx.globalAlpha = 1;

    ctx.beginPath();
    points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.strokeStyle = colRidge;
    ctx.lineWidth = far ? 1.5 : 2;
    ctx.stroke();

    function pointAt(t) {
      const index = Math.min(steps, Math.max(0, Math.round(t * steps)));
      return points[index];
    }

    function drawFacet(ctx, pts, color) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawCrack(t, depth) {
      const p = pointAt(t);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + width * 0.02, p.y + height * depth * 0.35);
      ctx.lineTo(p.x - width * 0.015, p.y + height * depth * 0.65);
      ctx.lineTo(p.x + width * 0.01, p.y + height * depth);
      ctx.stroke();
    }
  }

  // 窶披・蝨溷慍陬・｣ｾ・育ｷ大喧 u 隱ｭ蜿悶・縺ｿ繝ｻgreenProgress 繝ｭ繧ｸ繝・け縺ｯ螟画峩縺励↑縺・ｼ俄披・  let _landRocks = null;

    // 譌ｧ繝輔か繝ｼ繝槭ャ繝医・謐ｨ縺ｦ縺ｦ蜀咲函謌・    if (_landTowns && (_landTowns.length !== 5 || _landTowns[0].unlockAt == null)) {

      const townSlots = [
        { cxFrac: 0.2, depth01: 0.16, unlockAt: 0 },
        { cxFrac: 0.55, depth01: 0.26, unlockAt: 3 },
        { cxFrac: 0.82, depth01: 0.2, unlockAt: 5 },
        // 謇句燕蟇・ｊ・医・繝ｬ繧､蠎顔峩荳翫・驕ｿ縺代ｋ・・        { cxFrac: 0.32, depth01: 0.52, unlockAt: 8 },
        { cxFrac: 0.7, depth01: 0.58, unlockAt: 11 },
      ];
      _landTowns = [];
      for (let ti = 0; ti < townSlots.length; ti++) {
        const slot = townSlots[ti];
        const h0 = landHash(ti, 60);
        _landTowns.push({
          cx: slot.cxFrac * W + (h0 - 0.5) * 14,
          cy: farY + depth * slot.depth01,
          depth01: slot.depth01,
          seed: ti * 17 + 3,
          unlockAt: slot.unlockAt,
          icbmDmg: 0,
          blackout: false,
          smokePhase: Math.random() * Math.PI * 2,
        });
      }
    }
  }

  /** 蟯ｩ繝ｻ邱代ヱ繝・メ・医く繝｣繝・す繝･逕ｨ繝ｻu=greenProgress 逶ｸ蠖難ｼ・*/
  function paintLandDecor(g, u) {
    ensureLandDecor();
    const farY = GROUND_Y - GROUND_DEPTH;
    const nearY = GROUND_Y;
    const bleed = GROUND_BLEED;

    g.save();
    g.beginPath();
    g.rect(-bleed, farY, W + bleed * 2, nearY - farY);
    g.clip();

    // 邱代・譁托ｼ郁茅逕溘・荳句慍・・    for (let i = 0; i < _landPatches.length; i++) {
      const p = _landPatches[i];
      const grow = landSmooth(p.appearAt, p.appearAt + 0.3, u);
      if (grow < 0.05) continue;
      g.globalAlpha = grow * (0.3 + u * 0.45);
      g.fillStyle = lerpColor("#5a7040", "#3cb848", Math.min(1, u * 1.15));
      g.beginPath();
      g.ellipse(p.x, p.y, p.rx * (0.55 + grow * 0.55), p.ry * (0.55 + grow * 0.55), 0, 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;

    // 蟆冗浹・育ｷ大喧縺ｧ豸医∴繧具ｼ・    for (let i = 0; i < _landPebbles.length; i++) {
      const p = _landPebbles[i];
      const vis = 1 - landSmooth(p.fadeAt, p.fadeAt + 0.4, u);
      if (vis < 0.05) continue;
      g.globalAlpha = vis * 0.75;
      g.fillStyle = lerpColor("#6a6058", "#4a6a48", u * 0.4);
      g.beginPath();
      g.ellipse(p.x, p.y, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;

    // 蟯ｩ・育ｽｮ縺・※縺ゅｋ諢溘§繝ｻ邱大喧縺ｧ鬚ｨ蛹厄ｼ・    const sorted = _landRocks.slice().sort((a, b) => a.y - b.y);
    for (let i = 0; i < sorted.length; i++) {
      const r = sorted[i];
      let vis = 1 - landSmooth(r.fadeAt, Math.min(0.95, r.fadeAt + 0.38), u);
      if (r.kind === "boulder") vis = Math.max(vis, (1 - landSmooth(0.55, 0.95, u)) * 0.3);
      if (vis < 0.04) continue;
      const moss = landSmooth(0.32, 0.85, u);
      const shrink = 0.55 + vis * 0.45;
      const sx = r.sx * shrink;
      const sy = r.sy * shrink;
      g.save();
      g.translate(r.x, r.y);
      g.rotate(r.rot);
      g.globalAlpha = Math.min(1, vis * 1.05);
      g.fillStyle = `rgba(0,0,0,${0.16 * vis})`;
      g.beginPath();
      g.ellipse(1, sy * 0.55, sx * 1.05, sy * 0.32, 0, 0, Math.PI * 2);
      g.fill();
      const rockBare = r.kind === "boulder" ? "#6a6258" : r.kind === "rock" ? "#7a7064" : "#8a8074";
      const rockMoss = r.kind === "boulder" ? "#4a6a48" : "#5a8a50";
      g.fillStyle = lerpColor(rockBare, rockMoss, moss * 0.65);
      g.beginPath();
      g.moveTo(-sx, sy * 0.2);
      g.quadraticCurveTo(-sx * 0.9, -sy, 0, -sy * 1.05);
      g.quadraticCurveTo(sx * 0.95, -sy * 0.7, sx, sy * 0.15);
      g.quadraticCurveTo(sx * 0.3, sy * 0.85, -sx * 0.2, sy * 0.7);
      g.closePath();
      g.fill();
      g.strokeStyle = `rgba(255,250,230,${0.1 * vis})`;
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(-sx * 0.35, -sy * 0.25);
      g.quadraticCurveTo(0, -sy * 0.8, sx * 0.3, -sy * 0.2);
      g.stroke();
      if (moss > 0.2 && vis > 0.2) {
        g.fillStyle = `rgba(40, 100, 50, ${0.22 * moss * vis})`;
        g.beginPath();
        g.ellipse(-sx * 0.12, sy * 0.08, sx * 0.32, sy * 0.22, 0.15, 0, Math.PI * 2);
        g.fill();
      }
      g.restore();
    }
    g.globalAlpha = 1;
    g.restore();
  }

  /**
   * 驛ｽ蟶ゅ・豌鈴・・育衍諱ｵ繝斐・繧ｯ縺ｧ豌ｸ邯壽・髟ｷ繝ｻ邏・0縺ｧMax・峨・   * 蜷・し繧､繝医・荳ｭ蠢・°繧・谿ｵ髫弱〒諡｡螟ｧ縲る％霍ｯ縺ｯ騾壼ｸｸ邱夲ｼ域ｩ九げ繝ｩ繝輔ぅ繝・け縺ｪ縺暦ｼ峨・   */
  function paintLandTowns(g, u) {
    ensureLandDecor();
    if (!_landTowns || !_landTowns.length) return;
    if (urbanPeakWisdom <= 0) return;

    const houseBody = "#f4f7fa";
    const houseRoof = "#6aa8d8";
    const houseEdge = "#4a6a88";
    const infraBody = "#e8eef4";
    const infraEdge = "#4a88b8";
    const tallBody = "#eef4f8";
    const tallCap = "#80b0d8";
    const mastRed = "#e84848";
    const mastArm = "#ff7040";
    const mastTip = "#ffd040";
    const padRx0 = 24;
    const padRy0 = 10;

    // 謌宣聞荳ｭ縺ｮ繧ｵ繧､繝茨ｼ・row>0・・    const active = [];
    for (let ti = 0; ti < _landTowns.length; ti++) {
      const site = _landTowns[ti];
      const grow = urbanSiteGrow(site.unlockAt || 0);
      if (grow > 0.04) active.push({ site, grow, ti });
    }
    if (!active.length) return;

    function ease(t0) {
      return t0 * t0 * (3 - 2 * t0);
    }

    function miniHouse(x, y, sc) {
      const w = 4.0 * sc;
      const h = 3.2 * sc;
      g.fillStyle = houseBody;
      g.strokeStyle = houseEdge;
      g.lineWidth = 0.9;
      g.fillRect(x - w * 0.5, y - h, w, h);
      g.strokeRect(x - w * 0.5, y - h, w, h);
      g.fillStyle = houseRoof;
      g.beginPath();
      g.moveTo(x - w * 0.7, y - h);
      g.lineTo(x, y - h - 2.8 * sc);
      g.lineTo(x + w * 0.7, y - h);
      g.closePath();
      g.fill();
      g.strokeStyle = houseEdge;
      g.stroke();
    }

    function miniDam(x, y, len, sc) {
      g.fillStyle = infraBody;
      g.strokeStyle = infraEdge;
      g.lineWidth = 1;
      g.fillRect(x, y - 1.8 * sc, len, 3.0 * sc);
      g.strokeRect(x, y - 1.8 * sc, len, 3.0 * sc);
      g.fillStyle = "#d0e4f0";
      g.fillRect(x - 1.5 * sc, y - 2.8 * sc, 2.2 * sc, 4.0 * sc);
      g.fillRect(x + len - 0.7 * sc, y - 2.8 * sc, 2.2 * sc, 4.0 * sc);
      g.strokeRect(x - 1.5 * sc, y - 2.8 * sc, 2.2 * sc, 4.0 * sc);
      g.strokeRect(x + len - 0.7 * sc, y - 2.8 * sc, 2.2 * sc, 4.0 * sc);
    }

    function miniMast(x, y, h, sc) {
      g.fillStyle = mastRed;
      g.fillRect(x - 1.1 * sc, y - 1.5 * sc, 2.2 * sc, 1.5 * sc);
      g.strokeStyle = mastRed;
      g.lineWidth = 1.85 * sc;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x, y - h);
      g.stroke();
      const arm = 3.2 * sc;
      g.strokeStyle = mastArm;
      g.lineWidth = 1.4 * sc;
      for (let i = 0; i < 2; i++) {
        const ay = y - h * (0.38 + i * 0.26);
        g.beginPath();
        g.moveTo(x - arm, ay);
        g.lineTo(x + arm, ay);
        g.stroke();
      }
      g.fillStyle = mastTip;
      g.beginPath();
      g.arc(x, y - h - 0.8 * sc, 1.35 * sc, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = mastRed;
      g.lineWidth = 0.8;
      g.stroke();
    }

    function miniTall(x, y, w, h) {
      g.fillStyle = tallBody;
      g.strokeStyle = infraEdge;
      g.lineWidth = 0.9;
      g.fillRect(x - w * 0.5, y - h, w, h);
      g.strokeRect(x - w * 0.5, y - h, w, h);
      g.fillStyle = tallCap;
      g.fillRect(x - w * 0.6, y - h - 1.4, w * 1.2, 1.5);
    }

    /** 驕薙ｒ荳譛ｬ邱壹〒謠上￥・亥ｷ晄ｨｪ譁ｭ繧る壼ｸｸ縺ｮ驕薙・讖九げ繝ｩ繝輔ぅ繝・け縺ｪ縺暦ｼ・*/
    function strokeRoadOrBridge(x0, y0, x1, y1, width, color, alpha) {
      g.globalAlpha = alpha;
      g.strokeStyle = color;
      g.lineWidth = width;
      g.beginPath();
      g.moveTo(x0, y0);
      g.lineTo(x1, y1);
      g.stroke();
    }

    g.save();
    g.lineCap = "round";

    // 窶披・1) 謌宣聞繧ｹ繧ｱ繝ｼ繝ｫ莉倥″繝代ャ繝・窶披・    for (let ai = 0; ai < active.length; ai++) {
      const { site, grow } = active[ai];
      const eg = ease(grow);
      const scale = 0.32 + 0.68 * eg; // 荳ｭ蠢・°繧画僑螟ｧ
      const padRx = padRx0 * scale;
      const padRy = padRy0 * scale;
      const cx = site.cx;
      const cy = site.cy;
      g.globalAlpha = 0.55 + 0.4 * eg;
      const pg = g.createRadialGradient(cx, cy, 1, cx, cy, padRx);
      pg.addColorStop(0, "#e8ecf0");
      pg.addColorStop(0.4, "#c8d0d8");
      pg.addColorStop(0.78, "#a0a8b0");
      pg.addColorStop(1, "rgba(140, 148, 156, 0.14)");
      g.fillStyle = pg;
      g.beginPath();
      g.ellipse(cx, cy + 0.5, padRx, padRy, 0, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 0.4 + 0.25 * eg;
      g.strokeStyle = "#f0f2f4";
      g.lineWidth = 1.1;
      g.beginPath();
      g.ellipse(cx, cy + 0.5, padRx * 0.94, padRy * 0.9, 0, 0, Math.PI * 2);
      g.stroke();
      if (eg > 0.35) {
        g.globalAlpha = 0.12 + 0.1 * eg;
        g.strokeStyle = "#ffffff";
        g.lineWidth = 0.65;
        for (let hi = -2; hi <= 2; hi++) {
          g.beginPath();
          g.moveTo(cx - padRx * 0.7, cy + hi * 2 * scale);
          g.lineTo(cx + padRx * 0.7, cy + hi * 2 * scale);
          g.stroke();
        }
      }
    }

    // 窶披・2) 驕楢ｷｯ・郁ｿ大ｍ謗･邯壹・荳譛ｬ邱夲ｼ俄披・    // 謗･邯・ 繧､繝ｳ繝・ャ繧ｯ繧ｹ鬆・・髫｣謗･ + 螂･(0-2)縺ｨ謇句燕(3-4) + 螂･-謇句燕縺ｮ莉｣陦ｨ繝ｪ繝ｳ繧ｯ
    const links = [];
    for (let i = 0; i < active.length; i++) {
      for (let j = i + 1; j < active.length; j++) {
        const a = active[i].site;
        const b = active[j].site;
        const dx = a.cx - b.cx;
        const dy = a.cy - b.cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        links.push({ i, j, dist, ga: active[i].grow, gb: active[j].grow });
      }
    }
    links.sort((p, q) => p.dist - q.dist);
    // 霑代＞鬆・↓譛螟ｧ 7 譛ｬ・医＠縺｣縺九ｊ縺､縺ｪ縺舌′蜈ｨ邨仙粋縺ｯ縺励↑縺・ｼ・    const used = links.slice(0, Math.min(7, links.length));
    for (let li = 0; li < used.length; li++) {
      const L = used[li];
      if (L.ga < 0.2 || L.gb < 0.2) continue;
      const a = active[L.i].site;
      const b = active[L.j].site;
      const yOff = (li % 3) * 1.4 - 1.4;
      const x0 = a.cx;
      const y0 = a.cy + padRy0 * 0.25 * (0.4 + 0.6 * L.ga) + yOff;
      const x1 = b.cx;
      const y1 = b.cy + padRy0 * 0.25 * (0.4 + 0.6 * L.gb) + yOff;
      const w = 2.2 + Math.min(L.ga, L.gb) * 0.9;
      strokeRoadOrBridge(x0, y0, x1, y1, w, "#c0c8d0", 0.75);
      strokeRoadOrBridge(x0, y0, x1, y1, 0.9, "#f2f4f6", 0.35);
    }
    // 繝代ャ繝牙・譫晞％
    for (let ai = 0; ai < active.length; ai++) {
      const { site, grow } = active[ai];
      if (grow < 0.25) continue;
      const eg = ease(grow);
      const s = site.seed | 0;
      const ang = (landHash(s, 100) - 0.5) * Math.PI * 0.7;
      const len = padRx0 * (0.25 + 0.25 * eg);
      strokeRoadOrBridge(
        site.cx, site.cy + 0.5,
        site.cx + Math.cos(ang) * len,
        site.cy + Math.sin(ang) * padRy0 * 0.4 * eg,
        1.3, "#c8d0d8", 0.5
      );
    }

    // 窶披・3) 讒矩迚ｩ・・row 縺ｧ谿ｵ髫守噪縺ｫ・俄披・    for (let ai = 0; ai < active.length; ai++) {
      const { site, grow } = active[ai];
      const eg = ease(grow);
      const s = site.seed | 0;
      const cx = site.cx;
      const cy = site.cy;
      const scale = 0.32 + 0.68 * eg;
      const padRx = padRx0 * scale;
      const padRy = padRy0 * scale;
      const sc = 0.85 + 0.4 * eg;
      const spreadX = padRx * 0.5;
      const spreadY = padRy * 0.32;

      // 谿ｵ髫・逶ｸ蠖・ 螳ｶ・・row 縺ｧ霆呈焚蠅暦ｼ・      const nHouse = grow < 0.35 ? 1 + (s % 2) : grow < 0.7 ? 2 + (s % 2) : 3 + (s % 2);
      g.globalAlpha = 0.7 + 0.25 * eg;
      for (let hi = 0; hi < nHouse; hi++) {
        const hx = cx + (landHash(s + hi, 70) - 0.5) * 2 * spreadX;
        const hy = cy + (landHash(s + hi, 71) - 0.5) * 2 * spreadY;
        miniHouse(hx, hy, sc * (0.85 + landHash(s + hi, 72) * 0.2));
      }

      // 谿ｵ髫・逶ｸ蠖・ 繝繝・井ｸｭ謌宣聞縺九ｉ・・      if (grow >= 0.38) {
        g.globalAlpha = 0.75 + 0.2 * eg;
        const len = Math.min(padRx * 1.1, 10 + landHash(s, 80) * 5) * (0.7 + 0.3 * eg);
        const bx = cx - len * 0.5 + (landHash(s, 81) - 0.5) * 2;
        const by = cy + spreadY * 0.55;
        miniDam(bx, by, len, sc);
      }

      // 谿ｵ髫・逶ｸ蠖・ 蝪斐・鬮伜ｻｺ迚ｩ・磯ｫ俶・髟ｷ縺九ｉ・・      if (grow >= 0.68) {
        const tGrow = (grow - 0.68) / 0.32;
        g.globalAlpha = 0.8 + 0.18 * tGrow;
        const mastX = cx + (landHash(s, 90) - 0.5) * spreadX;
        miniMast(mastX, cy, (10 + landHash(s, 91) * 3.5) * (0.75 + 0.25 * tGrow), sc);
        const nTall = 1 + (s % 2);
        for (let vi = 0; vi < nTall; vi++) {
          const tx = cx + (landHash(s + vi, 92) - 0.5) * 2 * spreadX * 0.85;
          const th = (7 + landHash(s + vi, 93) * 3.2) * (0.75 + 0.25 * tGrow);
          const tw = 3.2 + landHash(s + vi, 94) * 1.3;
          miniTall(tx, cy, tw, th);
        }
      }
    }

    g.globalAlpha = 1;
    g.restore();
  }

  /** 謗ｧ縺医ａ縺ｪ闃晉函・亥虚逧・・遏ｭ縺・ｼ・*/
  function drawLiveGrass(ctx, u) {
    const nearY = GROUND_Y;
    const grass = landSmooth(0.06, 0.45, u);
    if (grass < 0.08) return;
    const swayBase = Math.sin(t * 0.028) * 0.35;
    const dens = Math.max(7, 13 - groundLevel);
    const col =
      u > 0.5
        ? `rgba(72, 200, 78, ${0.35 + grass * 0.3})`
        : u > 0.25
          ? `rgba(100, 160, 70, ${0.3 + grass * 0.25})`
          : `rgba(110, 120, 70, ${0.22 * grass})`;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.lineCap = "round";
    for (let x = 4; x < W; x += dens) {
      const gh = (2.2 + u * 3.2 + (x % 3) * 0.4) * (0.5 + grass * 0.55);
      const sway = swayBase + ((x * 0.07) % 1) * 0.35 - 0.15;
      ctx.beginPath();
      ctx.moveTo(x, nearY + 1);
      ctx.lineTo(x + sway, nearY - gh);
      ctx.stroke();
    }
  }

  /** 蠎翫・髱咏噪驛ｨ蛻・ｼ亥・蟷・､ｧ蝨ｰ・句ｲｩ繝ｻ繝代・繧ｹ繧ｰ繝ｪ繝・ラ・区妙髱｢・峨ｒ繧ｭ繝｣繝・す繝･ */
  function rebuildGroundBaseCache(u) {
    if (!_groundBaseCache) _groundBaseCache = makeLayerCanvas();
    const g = _groundBaseCache.getContext("2d");
    g.clearRect(0, 0, W, H);

    const farY = GROUND_Y - GROUND_DEPTH;
    const nearY = GROUND_Y;
    const faceBottom = Math.min(H, GROUND_Y + GROUND_FACE);
    const bleed = GROUND_BLEED;
    const landL = -bleed;
    const landR = W + bleed;
    // 繧ｰ繝ｪ繝・ラ蜿取據逕ｨ・亥｡励ｊ縺ｯ蜈ｨ蟷・ｼ・    const farInset = GROUND_FAR_INSET;
    const vanishL = farInset;
    const vanishR = W - farInset;

    // 蛻晄悄縺ｯ荵ｾ縺・◆闕貞慍蟇・ｊ 竊・邱代∈
    const soilDeep = lerpColor("#3a322c", "#1e4a28", u);
    const soilMid = lerpColor("#5c4e42", "#2e7a38", u);
    const soilLite = lerpColor("#7a6a58", "#48a848", u);
    const topFar = lerpColor("#5a5048", "#3a8a48", u);
    const topNear = lerpColor("#9a8a70", "#60d858", u);
    const grassC = lerpColor("#8a7a50", "#50f058", u);
    const edgeHi = lerpColor("#b0a088", "#a0ff88", u);

    // 窶披・螟ｧ蝨ｰ譛ｬ菴難ｼ壼ｷｦ蜿ｳ縺ｯ逕ｻ髱｢螟悶∪縺ｧ邯壹￥蜈ｨ蟷・ｸｯ 窶披・    g.beginPath();
    g.moveTo(landL, farY);
    g.lineTo(landR, farY);
    g.lineTo(landR, nearY);
    g.lineTo(landL, nearY);
    g.closePath();
    const planeGrad = g.createLinearGradient(0, farY, 0, nearY);
    planeGrad.addColorStop(0, topFar);
    planeGrad.addColorStop(0.4, soilLite);
    planeGrad.addColorStop(1, topNear);
    g.fillStyle = planeGrad;
    g.fill();

    // 闕貞慍繝弱う繧ｺ・育ｷ大喧縺ｧ阮・ｌ繧具ｼ・    const barren = 1 - landSmooth(0.05, 0.5, u);
    if (barren > 0.06) {
      g.save();
      g.beginPath();
      g.rect(landL, farY, landR - landL, nearY - farY);
      g.clip();
      g.globalAlpha = barren * 0.3;
      for (let i = 0; i < 70; i++) {
        const hx = landHash(i, 40);
        const hy = landHash(i, 41);
        g.fillStyle = i % 3 === 0 ? "#4a4038" : "#6a5c4c";
        g.fillRect(landL + hx * (landR - landL), farY + hy * (nearY - farY), 1.5 + (i % 3), 1);
      }
      g.globalAlpha = 1;
      g.restore();
    }

    // 邱代ヱ繝・メ繝ｻ蟯ｩ・育ｷ大喧縺ｧ豸医∴繧具ｼ・    paintLandDecor(g, u);
    // 驕譎ｯ縺ｮ蟆上＆縺ｪ陦励・豌鈴・・育せ蝨ｨ繝ｻ邱大喧縺ｧ蠅励∴繧具ｼ・    paintLandTowns(g, u);

    // 繝代・繧ｹ繧ｰ繝ｪ繝・ラ・亥庶譚溽ｷ壹〒 2.5D縲ょ悄蝨ｰ蠅・阜縺ｧ縺ｯ縺ｪ縺・ｼ・    g.save();
    g.beginPath();
    g.rect(landL, farY, landR - landL, nearY - farY);
    g.clip();
    g.strokeStyle = u > 0.35 ? "rgba(40,100,50,0.26)" : "rgba(70,55,35,0.28)";
    g.lineWidth = 1;
    const hLines = 8;
    for (let i = 1; i <= hLines; i++) {
      const p = i / (hLines + 1);
      const ease = p * p;
      const y = farY + (nearY - farY) * ease;
      // 豌ｴ蟷ｳ邱壹・蜈ｨ蟷・ｼ育ｫｯ縺ｧ蛻・ｉ縺ｪ縺・ｼ・      g.beginPath();
      g.moveTo(landL, y);
      g.lineTo(landR, y);
      g.stroke();
    }
    const vLines = 11;
    for (let i = 0; i <= vLines; i++) {
      const tt = i / vLines;
      const nx = -bleed + (W + bleed * 2) * tt;
      const fx = vanishL + (vanishR - vanishL) * tt;
      g.beginPath();
      g.moveTo(fx, farY);
      g.lineTo(nx, nearY);
      g.stroke();
    }
    g.restore();

    // 蟾晏ｺ・    paintGroundRiverBeds(g, u);

    // 謇句燕邵√・縺ｿ繝上う繝ｩ繧､繝・    g.strokeStyle = edgeHi;
    g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(landL, nearY);
    g.lineTo(landR, nearY);
    g.stroke();

    // 譁ｭ髱｢・亥・蟷・ｼ・    const faceGrad = g.createLinearGradient(0, nearY, 0, faceBottom);
    faceGrad.addColorStop(0, soilLite);
    faceGrad.addColorStop(0.35, soilMid);
    faceGrad.addColorStop(1, soilDeep);
    g.fillStyle = faceGrad;
    g.fillRect(landL, nearY, landR - landL, faceBottom - nearY);

    g.fillStyle = "rgba(255,255,210,0.2)";
    g.fillRect(landL, nearY, landR - landL, 8);

    // 蟾ｦ蜿ｳ縺ｯ蛻・妙髱｢繧呈緒縺九★縲∬埋縺・ン繝阪ャ繝医・縺ｿ
    const sideVigL = g.createLinearGradient(0, 0, 32, 0);
    sideVigL.addColorStop(0, "rgba(0,0,0,0.07)");
    sideVigL.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = sideVigL;
    g.fillRect(0, farY, 32, nearY - farY);
    const sideVigR = g.createLinearGradient(W, 0, W - 32, 0);
    sideVigR.addColorStop(0, "rgba(0,0,0,0.07)");
    sideVigR.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = sideVigR;
    g.fillRect(W - 32, farY, 32, nearY - farY);

    if (faceBottom < H) {
      g.fillStyle = lerpColor("#2a2218", "#183820", u);
      g.fillRect(0, faceBottom, W, H - faceBottom);
    }

    // 繝励Ο繧ｰ繝ｬ繧ｹ繝舌・
    g.fillStyle = "rgba(0,0,0,0.3)";
    g.fillRect(W - 78, nearY + 12, 70, 10);
    g.fillStyle = grassC;
    g.fillRect(W - 76, nearY + 14, 66 * Math.max(0.05, u), 6);
  }

  function ensureSceneCaches() {
    const step = visStepOf(greenProgress);
    const urbanStep = Math.min(20, urbanPeakWisdom | 0);
    if (
      step === _visStep &&
      urbanStep === _urbanStep &&
      _skyMtnCache &&
      _groundBaseCache
    ) {
      return;
    }
    _visStep = step;
    _urbanStep = urbanStep;
    const u = step / 12;
    rebuildSkyMtnCache(u);
    rebuildGroundBaseCache(u);
  }

  /** 蜿瑚痩 (cotyledon) sprite */
  function drawCotyledon(x, y, scale, phase) {
    const sway = Math.sin(t * 0.05 + phase) * 1.2;
    ctx.save();
    ctx.translate(x + sway, y);
    ctx.scale(scale, scale);
    // stem
    ctx.strokeStyle = "#4a8a30";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -6);
    ctx.stroke();
    // two leaves
    ctx.fillStyle = "#6ec050";
    ctx.beginPath();
    ctx.ellipse(-4, -8, 4.5, 2.8, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(4, -8, 4.5, 2.8, 0.6, 0, Math.PI * 2);
    ctx.fill();
    // leaf veins (line)
    ctx.strokeStyle = "#3a7020";
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(-1, -7);
    ctx.lineTo(-5, -9);
    ctx.moveTo(1, -7);
    ctx.lineTo(5, -9);
    ctx.stroke();
    ctx.restore();
  }

  /** 闃ｱ縺ｳ繧・floating or on ground */
  function drawPetal(x, y, rot, color, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 1.4, s * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBg() {
    ensureSceneCaches();
    // 遨ｺ・句ｱｱ縺ｯ繧ｭ繝｣繝・す繝･縺九ｉ 1 蝗槭・ blit・域ｯ弱ヵ繝ｬ繝ｼ繝縺ｮ蜀崎ｨ育ｮ励ｒ蝗樣∩・・    ctx.drawImage(_skyMtnCache, 0, 0);
    // 遨ｺ荳ｭ縺ｮ闃ｱ縺ｳ繧峨・蟆第焚縺縺托ｼ磯㍾縺・・縺ｧ荳企剞繧呈椛縺医ｋ・・    const u = greenProgress;
    if (u > 0.2) {
      const n = Math.min(6, (u * 10) | 0);
      const cols = ["#e070a0", "#e0c040", "#d080e0"];
      for (let i = 0; i < n; i++) {
        const x = (i * 73 + t * 0.2 + seeds * 3) % W;
        const y = 50 + ((i * 97 + t * 0.15) % (GROUND_Y - 140));
        drawPetal(x, y, t * 0.02 + i, cols[i % 3], 2);
      }
    }
  }

  /**
   * 繝・ち縺ｮ闡会ｼ域・髟ｷ谿ｵ髫弱〒蠖｢縺悟､峨ｏ繧具ｼ・   * detail: 0=闃ｽ, 1=邁｡譏楢痩, 2=闡芽ц縺､縺・ 3=隍・痩繝ｻ蠖ｱ縺､縺・   */
  function drawVineLeaf(lx, ly, ang, size, side, detail, stages) {
    const sway = Math.sin(t * 0.055 + lx * 0.02 + ly * 0.01) * (0.8 + stages);
    ctx.save();
    ctx.translate(lx + sway * 0.3 * side, ly);
    ctx.rotate(ang + sway * 0.04);

    if (detail <= 0) {
      // 闃ｽ繝ｻ蟆上＆縺ｪ闃ｽ蜷ｹ縺・      ctx.fillStyle = `rgba(${60 + stages * 40}, ${140 + stages * 60}, 50, 0.85)`;
      ctx.beginPath();
      ctx.ellipse(side * 3, 0, size * 0.55, size * 0.35, side * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }

    // 蠖ｱ・郁ｩｳ邏ｰ蠎ｦ縺碁ｫ倥＞縺ｨ縺搾ｼ・    if (detail >= 3) {
      ctx.fillStyle = "rgba(20,50,15,0.22)";
      ctx.beginPath();
      ctx.ellipse(side * size * 0.55 + 1, 1.5, size * 1.05, size * 0.48, side * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    // 繝上・繝亥ｽ｢縺ｫ霑代＞闡会ｼ医・縺｣縺阪ｊ繝・ち縺ｮ闡会ｼ・    const gr = Math.floor(70 + stages * 50);
    const gg = Math.floor(150 + stages * 70);
    ctx.fillStyle = `rgba(${gr - 20}, ${gg}, ${40 + stages * 20}, ${0.72 + detail * 0.07})`;
    ctx.beginPath();
    const s = size;
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(side * s * 0.15, -s * 0.55, side * s * 1.05, -s * 0.5, side * s * 1.15, s * 0.05);
    ctx.bezierCurveTo(side * s * 1.0, s * 0.55, side * s * 0.2, s * 0.45, 0, s * 0.08);
    ctx.closePath();
    ctx.fill();

    // 繝上う繝ｩ繧､繝育ｸ・    if (detail >= 2) {
      ctx.strokeStyle = `rgba(${gr + 40}, ${Math.min(255, gg + 40)}, 80, 0.45)`;
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }

    // 闡芽ц
    if (detail >= 2) {
      ctx.strokeStyle = `rgba(30, 70, 25, ${0.35 + detail * 0.12})`;
      ctx.lineWidth = 0.65;
      ctx.beginPath();
      ctx.moveTo(side * 1, 0);
      ctx.quadraticCurveTo(side * s * 0.55, -s * 0.08, side * s * 1.0, s * 0.02);
      ctx.stroke();
      if (detail >= 3) {
        ctx.beginPath();
        ctx.moveTo(side * s * 0.35, -s * 0.05);
        ctx.lineTo(side * s * 0.55, -s * 0.32);
        ctx.moveTo(side * s * 0.4, s * 0.08);
        ctx.lineTo(side * s * 0.6, s * 0.28);
        ctx.stroke();
      }
    }

    // 隍・痩・亥・遶ｯ莉倩ｿ代・蟆上＆縺ｪ蜑ｯ闡会ｼ・    if (detail >= 3 && size > 5) {
      ctx.fillStyle = `rgba(${gr}, ${gg + 10}, 55, 0.7)`;
      ctx.beginPath();
      ctx.ellipse(side * s * 0.35, -s * 0.55, s * 0.32, s * 0.18, side * -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(side * s * 0.38, s * 0.48, s * 0.28, s * 0.15, side * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /** 蟾ｻ縺阪▽縺阪▽繧具ｼ郁楴譌具ｼ・*/
  function drawTendrilCoil(cx, cy, side, radius, turns, lineW, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lineW;
    ctx.lineCap = "round";
    ctx.beginPath();
    const steps = Math.max(8, (turns * 10) | 0);
    for (let k = 0; k <= steps; k++) {
      const q = k / steps;
      const a = q * Math.PI * 2 * turns + t * 0.04 * side;
      const rr = radius * (0.55 + q * 0.55);
      const px = cx + Math.cos(a) * rr * side;
      const py = cy - q * (radius * 1.6 + turns * 2);
      if (k === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  /**
   * 繧ｸ繝｣繝・け縺ｨ雎・・譛ｨ鬚ｨ・壽・髟ｷ縺ｫ縺､繧檎ｷ壺・蟷ｹ竊定痩竊貞ｷｻ縺阪▽縺坂・闃ｱ縺ｨ隧ｳ邏ｰ蛹・   * greenProgress / vineGrowth 縺ｧ鬮倥＆繝ｻ螟ｪ縺輔・陬・｣ｾ縺悟｢励∴繧・   */
  function drawVines() {
    if (vineGrowth < 0.02 && greenProgress < 0.02) return;
    const stages = Math.max(vineGrowth, greenProgress * 0.9);
    // 謌宣聞谿ｵ髫・ 0邱・竊・1遽繝ｻ闃ｽ 竊・2闡・竊・3蟾ｻ縺阪・蜑ｯ阡・竊・4闃ｱ繝ｻ隍・痩
    const detail =
      stages < 0.12 ? 0 :
      stages < 0.28 ? 1 :
      stages < 0.48 ? 2 :
      stages < 0.72 ? 3 : 4;

    const barkR = Math.floor(48 + stages * 55);
    const barkG = Math.floor(78 + stages * 90);
    const barkB = Math.floor(32 + stages * 30);
    const vineStroke = `rgb(${barkR}, ${barkG}, ${barkB})`;
    const vineHi = `rgb(${Math.min(255, barkR + 45)}, ${Math.min(255, barkG + 55)}, ${barkB + 20})`;
    const vineCore = `rgb(${Math.floor(barkR * 0.55)}, ${Math.floor(barkG * 0.55)}, ${Math.floor(barkB * 0.5)})`;

    const maxReach = GROUND_Y - 28;
    const reach = Math.min(maxReach, stages * maxReach * 1.05 + 18);

    function buildPath(side, trunkOff) {
      const baseX = side < 0 ? 6 + trunkOff : W - 6 - trunkOff;
      const segs = 10 + ((stages * 16) | 0);
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const p = i / segs;
        const climb = Math.pow(p, 0.88);
        const y = GROUND_Y - 2 - reach * climb;
        const swayW = Math.sin(p * 7.5 + t * 0.035 + side * 1.2 + trunkOff * 0.08) * (5 + stages * 12);
        // 蟾ｻ縺阪▽縺肴─: 陞ｺ譌九が繝輔そ繝・ヨ繧呈・髟ｷ縺ｨ縺ｨ繧ゅ↓蠑ｷ縺・        const helix = Math.sin(p * Math.PI * (2.5 + stages * 3) + t * 0.03) * (2 + stages * 7);
        const inward = side * (3 + p * 10 + stages * 16 * (1 - p * 0.25));
        let x = baseX + inward + swayW * 0.35 * side + helix * side * 0.55;
        if (side < 0) x = Math.min(x, 10 + W * 0.3 * stages);
        else x = Math.max(x, W - 10 - W * 0.3 * stages);
        // 譬ｹ蜈・・螟ｪ縺剰ｦ九∴繧九ｈ縺・凶蟷ｲ螟門・
        if (p < 0.08) x = baseX + side * p * 4;
        pts.push({ x, y, p });
      }
      return pts;
    }

    function strokeVinePath(pts, thickMul, layered) {
      if (pts.length < 2) return;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // 譬ｹ蜈・・蜈育ｫｯ縺ｧ繝・・繝代・・亥､ｪ縺・ｹｹ竊堤ｴｰ縺・▽繧具ｼ・      const baseW = (2.2 + stages * 3.4) * thickMul;
      const tipW = (0.9 + stages * 0.8) * thickMul;

      if (layered && detail >= 1) {
        // 蠖ｱ・亥ｹｹ縺ｮ螂･陦後″・・        ctx.strokeStyle = "rgba(20,35,15,0.28)";
        ctx.lineWidth = baseW + 1.6;
        ctx.beginPath();
        ctx.moveTo(pts[0].x + 1.2, pts[0].y + 0.8);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + 1.2, pts[i].y + 0.8);
        ctx.stroke();
      }

      // 譛ｬ菴難ｼ医そ繧ｰ繝｡繝ｳ繝医＃縺ｨ縺ｫ邱壼ｹ・､牙喧縺碁屮縺励＞縺ｮ縺ｧ2繝代せ・夊官・九ワ繧､繝ｩ繧､繝茨ｼ・      ctx.strokeStyle = vineStroke;
      ctx.lineWidth = baseW;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();

      if (layered && detail >= 2) {
        // 闃ｯ縺ｮ證励＞遲具ｼ域惠雉ｪ諢滂ｼ・        ctx.strokeStyle = vineCore;
        ctx.lineWidth = Math.max(0.6, baseW * 0.35);
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 繝上う繝ｩ繧､繝育ｸ・        ctx.strokeStyle = vineHi;
        ctx.lineWidth = Math.max(0.5, tipW * 0.7);
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        const ox = pts[0].p !== undefined ? -0.8 : -0.8;
        ctx.moveTo(pts[0].x + ox, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          const np = pts[i].p;
          const fade = 1 - np * 0.5;
          // 蜈育ｫｯ縺ｻ縺ｩ邏ｰ縺・ワ繧､繝ｩ繧､繝・          ctx.lineTo(pts[i].x - 0.8 * fade, pts[i].y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 遽・医ヮ繝ｼ繝会ｼ俄・繝・ち繧峨＠縺・      if (detail >= 1) {
        const step = detail >= 3 ? 2 : 3;
        for (let i = step; i < pts.length - 1; i += step) {
          const pt = pts[i];
          if (pt.p < 0.06 || pt.p > 0.96) continue;
          const nr = (1.1 + stages * 1.4) * thickMul * (1 - pt.p * 0.35);
          ctx.fillStyle = vineCore;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, nr, 0, Math.PI * 2);
          ctx.fill();
          if (detail >= 2) {
            ctx.fillStyle = vineHi;
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.arc(pt.x - 0.5, pt.y - 0.4, nr * 0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
        }
      }

      // 蟷ｹ縺ｫ蟾ｻ縺阪▽縺冗ｴｰ縺・▽繧・      if (detail >= 3) {
        const coilEvery = detail >= 4 ? 3 : 4;
        for (let i = coilEvery; i < pts.length - 2; i += coilEvery) {
          const pt = pts[i];
          if (pt.p < 0.12 || pt.p > 0.88) continue;
          const next = pts[Math.min(pts.length - 1, i + 1)];
          const dx = next.x - pt.x;
          const dy = next.y - pt.y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len;
          const ny = dx / len;
          const r = 3.5 + stages * 4;
          ctx.strokeStyle = vineHi;
          ctx.lineWidth = 0.9 * thickMul;
          ctx.globalAlpha = 0.7;
          ctx.beginPath();
          for (let k = 0; k <= 8; k++) {
            const q = k / 8;
            const along = q * 10;
            const spin = Math.sin(q * Math.PI * 2 + t * 0.05 + i) * r;
            const px = pt.x + (dx / len) * along + nx * spin;
            const py = pt.y + (dy / len) * along + ny * spin * 0.85;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }

    function vineSide(side, trunkOff, thickMul) {
      const pts = buildPath(side, trunkOff);
      strokeVinePath(pts, thickMul, thickMul >= 0.9);

      // 闡・      if (detail >= 1) {
        const leafStep = detail >= 4 ? 1 : detail >= 2 ? 2 : 3;
        const leafDetail = Math.min(3, detail - 1);
        for (let i = 1; i < pts.length; i += leafStep) {
          const pt = pts[i];
          if (pt.p < 0.07) continue;
          // 蟾ｦ蜿ｳ莠､莠偵↓闡・          const leafSide = (i % 2 === 0 ? 1 : -1) * side;
          const size = (3.2 + stages * 5.5 + (1 - pt.p) * 2) * (0.75 + thickMul * 0.35);
          const ang = leafSide * (0.55 + pt.p * 0.35) + Math.sin(t * 0.04 + i) * 0.08;
          const ox = leafSide * (4 + stages * 5 + detail);
          drawVineLeaf(pt.x + ox * 0.35, pt.y, ang, size, leafSide, leafDetail, stages);
        }
      }

      // 莠梧ｬ｡阡・      if (detail >= 3 && pts.length > 4) {
        const mid = pts[Math.floor(pts.length * 0.42)];
        const branchPts = [];
        const extra = reach * (0.28 + stages * 0.18);
        const n2 = 5 + ((stages * 7) | 0);
        for (let j = 0; j <= n2; j++) {
          const q = j / n2;
          const sy = mid.y - extra * q;
          const sx =
            mid.x +
            side * (6 + q * 22 + stages * 8) +
            Math.sin(q * 5.5 + t * 0.05 + trunkOff) * (5 + stages * 4) * side;
          branchPts.push({ x: sx, y: sy, p: q });
        }
        strokeVinePath(branchPts, thickMul * 0.55, false);
        // 譫晏・縺ｮ闡・        if (detail >= 3 && branchPts.length) {
          const tip = branchPts[branchPts.length - 1];
          drawVineLeaf(tip.x, tip.y, side * 0.4, 5 + stages * 5, side, Math.min(3, detail - 1), stages);
          drawVineLeaf(tip.x, tip.y + 4, side * -0.5, 4 + stages * 3, -side, Math.min(2, detail - 1), stages);
        }
      }

      // 闃ｱ
      if (detail >= 4) {
        for (let i = 3; i < pts.length; i += 4) {
          const pt = pts[i];
          if (pt.p < 0.18 || pt.p > 0.92) continue;
          const cols = ["#e070a0", "#e0c040", "#d080e0", "#f0a060"];
          const col = cols[i % cols.length];
          const fx = pt.x + side * (10 + stages * 6);
          const fy = pt.y - 3;
          for (let p = 0; p < 5; p++) {
            const a = (p / 5) * Math.PI * 2 + t * 0.02;
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.ellipse(fx + Math.cos(a) * 3.8, fy + Math.sin(a) * 2.6, 2.4, 1.5, a, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = "#f0e080";
          ctx.beginPath();
          ctx.arc(fx, fy, 1.9, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 鬆らせ縺ｮ蟾ｻ縺阪・縺・      if (detail >= 2 && pts.length) {
        const tip = pts[pts.length - 1];
        drawTendrilCoil(
          tip.x,
          tip.y - 2,
          side,
          3.5 + stages * 5,
          1.4 + stages * 1.2,
          1 + stages * 0.6,
          vineStroke
        );
        if (detail >= 4) {
          drawTendrilCoil(
            tip.x - side * 5,
            tip.y + 6,
            -side,
            2.5 + stages * 3,
            1.2,
            0.85,
            vineHi
          );
        }
      }
    }

    // 荳ｻ蟷ｹ
    vineSide(-1, 0, 1);
    vineSide(1, 0, 1);
    // 蜑ｯ蟷ｹ・域・髟ｷ荳ｭ逶､莉･髯搾ｼ・    if (stages > 0.42) {
      vineSide(-1, 11, 0.58);
      vineSide(1, 11, 0.58);
    }
    // 縺輔ｉ縺ｫ邏ｰ縺・х闃ｽ・育ｵら乢・・    if (stages > 0.75) {
      vineSide(-1, 22, 0.38);
      vineSide(1, 22, 0.38);
    }
  }

  /**
   * 蟾・ver.3.9+ 窶・謌宣聞縺吶ｋ豬∬ｷｯ・域峇邱壼ｲｸ繝ｻ荳ｭ蠢・ｷ夲ｼ・   * 蛻晄悄・夂ｴｰ縺・搨縺・ｷ・竊・蠕舌・↓螟ｪ縺・竊・譛邨ら噪縺ｫ縺励▲縺九ｊ縺励◆蟾・   * riverGrowth / greenProgress 騾｣蜍輔・螟画峩縺ｪ縺・   */
  function riverSmoothstep(a, b, x) {
    const t0 = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t0 * t0 * (3 - 2 * t0);
  }

  function samplePolyline(pts, p) {
    if (pts.length === 1) return { x: pts[0].x, y: pts[0].y };
    const n = pts.length - 1;
    const f = Math.max(0, Math.min(0.9999, p)) * n;
    const i = f | 0;
    const uu = f - i;
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[Math.min(n, i + 1)];
    const p3 = pts[Math.min(n, i + 2)];
    const u2 = uu * uu;
    const u3 = u2 * uu;
    return {
      x:
        0.5 *
        (2 * p1.x +
          (-p0.x + p2.x) * uu +
          (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 +
          (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
      y:
        0.5 *
        (2 * p1.y +
          (-p0.y + p2.y) * uu +
          (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 +
          (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3),
    };
  }

  /** 蟾晄ｺ先ｵ∫畑・壽立蜑肴勹螻ｱ繝ｬ繧､繝､逶ｸ蠖薙・蠎ｧ讓吝､画鋤・郁ｰｷ縺ｮ逕ｻ髱｢菴咲ｽｮ・・*/
  function mtnValleyScreen(ridgeX, ridgeY) {
    const farY = GROUND_Y - GROUND_DEPTH;
    const yBase = 6;
    const scaleX = 1.18;
    const scaleY = 1.14;
    const baseY = farY - yBase;
    return {
      x: W * 0.5 + (ridgeX - W * 0.5) * scaleX,
      y: baseY + ridgeY * scaleY,
    };
  }

  /**
   * 蟾昴・謌宣聞蠎ｦ 0..1・育ｷｩ繧・°縺ｫ蠅怜刈・・   * live=true 縺ｧ WAVE繝ｻ遞ｮ繧ょｰ代＠蜿肴丐
   */
  function riverGrowth(u, live) {
    let raw = u * 0.72;
    if (live) {
      raw += (typeof wave === "number" ? (wave - 1) * 0.038 : 0) + seeds * 0.012 + wisdom * 0.008;
    }
    // 蠎冗乢縺ｯ繧・▲縺上ｊ縲∽ｸｭ逶､縺九ｉ譛ｬ譬ｼ逧・↓閧ｲ縺､
    return Math.min(1, riverSmoothstep(0.0, 0.95, raw) * 0.35 + Math.pow(Math.min(1, raw), 1.15) * 0.65);
  }

  /**
   * 蟷・咲紫・壼ｺ冗乢縺ｯ邏ｰ縺・ｷ壹・縺ｾ縺ｾ縲∝粋豬∝ｾ鯉ｼ・rowth 荳ｭ逶､莉･髯搾ｼ峨↓繧・▲縺上ｊ螟ｪ繧・   * 蜈･蜉・growth 縺ｯ蠕捺擂縺ｩ縺翫ｊ riverGrowth(greenProgress, 窶ｦ) 逕ｱ譚･
   */
  function riverWidthMul(growth) {
    // 蜷域ｵ∝燕縺ｯ縺ｻ縺ｼ荳螳壹・邏ｰ縺輔∝粋豬∝ｾ後↓ 0.42竊・.95 縺ｧ譛ｬ譬ｼ蠅玲ｰｴ
    const base = 0.1;
    const plump = riverSmoothstep(0.42, 0.95, growth);
    // 莠梧ｬ｡繧医ｊ驕・＞遶九■荳翫′繧奇ｼ医・繝ｳ繝・ｒ驕ｿ縺代ｋ・・    const ease = plump * plump * plump * (2.5 - 1.5 * plump);
    return base + 0.9 * ease;
  }

  /** 蜷域ｵ∝ｾ後・縲悟｢玲ｰｴ縲・..1・亥ｹ・・豌ｴ髱｢縺ｮ髱｢縺ｫ蜈ｱ逕ｨ・・*/
  function riverPlump(growth) {
    return riverSmoothstep(0.42, 0.92, growth);
  }

  /**
   * RiverSurge 窶・螟ｪ縺上↑繧九→縺堺ｸ頑ｵ√°繧牙兇縺・′襍ｰ繧翫・夐℃蠕後↓蟷・′螳夂捩
   * greenProgress / riverGrowth 縺ｮ蠑上・螟画峩縺励↑縺・ｼ・lump 縺ｮ蟾ｮ蛻・□縺醍屮隕厄ｼ・   */
  const RiverSurge = {
    active: false,
    head: 1, // 0=貅先ｵ・竊・1=謇句燕
    band: 0.14,
    speed: 0.011,
    targetPlump: 0,
    settledPlump: 0,
    prevPlump: 0,

    reset() {
      this.active = false;
      this.head = 1;
      this.targetPlump = 0;
      this.settledPlump = 0;
      this.prevPlump = 0;
    },
    update(growth) {
      const plump = riverPlump(growth);
      // 邱大喧縺ｧ蠅玲ｰｴ縺励◆
      if (plump > this.prevPlump + 0.015) {
        if (!this.active) {
          this.active = true;
          this.head = 0;
        }
        this.targetPlump = plump;
      }
      // 邱代′貂帙▲縺溷ｴ蜷医・蜊ｳ蜷医ｏ縺帙ｋ・域ｼ泌・縺ｪ縺暦ｼ・      if (plump < this.settledPlump - 0.02) {
        this.settledPlump = plump;
        this.targetPlump = plump;
        this.active = false;
        this.head = 1;
      }
      // 繧・▲縺上ｊ蠅励∴縺溷ｴ蜷医ｂ繧ｵ繝ｼ繧ｸ縺ｧ霑ｽ縺・▽縺・      if (!this.active && plump > this.settledPlump + 0.04) {
        this.active = true;
        this.head = 0;
        this.targetPlump = plump;
      }
      this.prevPlump = plump;

      if (this.active) {
        this.head += this.speed;
        if (this.head >= 1) {
          this.head = 1;
          this.settledPlump = this.targetPlump;
          this.active = false;
        }
      } else if (this.settledPlump < plump) {
        // 繧ｵ繝ｼ繧ｸ邨ゆｺ・ｾ後・蠕ｮ隱ｿ謨ｴ
        this.settledPlump = plump;
        this.targetPlump = plump;
      }
    },
    /** p: 0荳頑ｵ√・荳区ｵ√る夐℃貂医∩縺ｻ縺ｩ target縲∵悴蛻ｰ驕斐・ settled */
    localPlump(p) {
      const settled = this.settledPlump;
      const target = Math.max(this.targetPlump, settled);
      if (!this.active) return target;
      const head = this.head;
      // head 繧医ｊ荳頑ｵ・p縺悟ｰ上＆縺・・晏字縺・      const t = 1 - riverSmoothstep(head - this.band, head + this.band * 0.15, p);
      return settled + (target - settled) * t;
    },
    /** halfW 繧偵し繝ｼ繧ｸ迥ｶ諷九〒繧ｹ繧ｱ繝ｼ繝ｫ・・efs 縺ｯ target 蟷・Φ螳夲ｼ・*/
    scaleHalfW(halfW, p, targetPlump) {
      if (!this.active) return halfW;
      const tp = Math.max(targetPlump, 0.05);
      const local = Math.max(0.02, this.localPlump(p));
      // target 蟷・ｒ local/target 縺ｧ邵ｮ繧√ｋ・域悴騾夐℃縺ｮ荳区ｵ√・邏ｰ縺・∪縺ｾ・・      return halfW * Math.max(0.22, Math.min(1.2, local / tp));
    },
    /** 蜍｢縺・・蜈育ｫｯ莉倩ｿ代° */
    nearHead(p) {
      if (!this.active) return 0;
      const d = Math.abs(p - this.head);
      if (d > this.band * 1.2) return 0;
      return 1 - d / (this.band * 1.2);
    },
  };

  /** 蟾晏ｺ奇ｼ亥慍蠖｢縺ｮ縺上⊂縺ｿ・峨・蠑ｷ縺包ｼ壼粋豬∝ｾ後°繧牙ｾ舌・↓ */
  function riverBedStrength(growth) {
    return riverSmoothstep(0.28, 0.82, growth);
  }

  /**
   * 蟾晏ｮ夂ｾｩ・郁・辟ｶ縺ｪ谿ｵ髫取・髟ｷ・・   * 1) 譛ｬ豬・ｼ亥ｷｦ隹ｷ・会ｼ・蜿ｳ隹ｷ縺ｮ蟾・   * 2) growth竕ｳ0.28: 荳ｭ螟ｮ蟇・ｊ謾ｯ豬∝・迴ｾ・域悴蜷域ｵ・ｼ・   * 3) growth竕ｳ0.40: 謾ｯ豬√′譛ｬ豬√↓譖ｲ邱壼粋豬・   * 4) 蜷域ｵ∝ｾ・ riverPlump 縺ｧ蠕舌・↓螟ｪ縺・   *
   * 貅先ｵ√・蟯ｩ螻ｱ縺ｮ陬ｾ・丞慍蟷ｳ邱壻ｻ倩ｿ代↓蝗ｺ螳夲ｼ育ｩｺ荳ｭ縺九ｉ蜃ｺ縺輔↑縺・ｼ・   */
  function getRiverDefs(growth) {
    const nearY = GROUND_Y;
    const farY = GROUND_Y - GROUND_DEPTH;
    const depth = nearY - farY;
    const wm = riverWidthMul(growth);
    const plump = riverPlump(growth);
    const midX = W * 0.5;

    // 蟯ｩ螻ｱ繝ｬ繧､繧｢繧ｦ繝医↓蜷医ｏ縺帙◆隹ｷ縺ｮ陬ｾ・亥ｱｱ縺ｮ雜ｳ蜈・・蝨ｰ蟷ｳ邱壻ｻ倩ｿ托ｼ・    // 蟾ｦ縲應ｸｭ螟ｮ縺ｮ隹ｷ / 荳ｭ螟ｮ縲懷承縺ｮ隹ｷ・育ｩｺ荳ｭ繧ｹ繧ｿ繝ｼ繝医ｒ驕ｿ縺代ｋ・・    const srcMain = { x: 148, y: farY + 2 };
    const srcRight = { x: 428, y: farY + 4 };
    const srcTrib = { x: 268, y: farY + 2 };

    // 蜷域ｵ∫せ・域悽豬∽ｸ翫・謾ｯ豬√・邨らせ・・    const merge = {
      x: midX + 4,
      y: farY + depth * 0.36,
    };

    // 荳頑ｵ√・縺九↑繧顔ｴｰ縺上∽ｸ区ｵ・ｼ域焔蜑搾ｼ峨∈蜷代￠縺ｦ繧・▲縺上ｊ螟ｪ繧・    const w0 = (0.18 + plump * 0.22) * wm * (0.85 + plump * 0.2);
    const w1 = (1.0 + plump * 6.5) * wm * (0.9 + plump * 0.5);

    const rivers = [
      {
        id: 0,
        minG: 0,
        scale: 1,
        pts: [
          // 蟾ｦ隹ｷ縺ｮ陬ｾ縺九ｉ蝨ｰ髱｢縺ｸ・亥ｱｱ閻ｹ縺ｮ遨ｺ荳ｭ蛹ｺ髢薙ｒ菴懊ｉ縺ｪ縺・ｼ・          { x: srcMain.x, y: srcMain.y },
          { x: srcMain.x - 4, y: farY + depth * 0.06 },
          { x: midX - 50, y: farY + depth * 0.12 },
          { x: midX - 28, y: farY + depth * 0.24 },
          { x: merge.x, y: merge.y },
          { x: midX + 16, y: farY + depth * 0.5 },
          { x: midX - 8, y: farY + depth * 0.68 },
          { x: midX + 10, y: farY + depth * 0.84 },
          { x: midX + 2, y: nearY - 1 },
        ],
        w0,
        w1,
      },
      // 蜿ｳ・壻ｸｭ螟ｮ螻ｱ縺ｨ蜿ｳ螻ｱ縺ｮ髢薙°繧会ｼ域悽豬√→蜷後§縺丈ｸ頑ｵ∫ｴｰ繝ｻ荳区ｵ√ｄ繧・､ｪ・・      {
        id: 2,
        minG: 0,
        scale: 0.88,
        pts: [
          { x: srcRight.x, y: srcRight.y },
          { x: srcRight.x + 4, y: farY + depth * 0.07 },
          { x: midX + 100, y: farY + depth * 0.16 },
          { x: midX + 82, y: farY + depth * 0.3 },
          { x: midX + 68, y: farY + depth * 0.48 },
          { x: midX + 58, y: farY + depth * 0.68 },
          { x: midX + 50, y: farY + depth * 0.86 },
          { x: midX + 44, y: nearY - 1 },
        ],
        w0: w0 * 0.9,
        w1: w1 * 0.72,
      },
    ];

    // 谿ｵ髫・: 謾ｯ豬∝・迴ｾ・域悴蜷域ｵ・ｼ俄・譛ｬ豬√↓螻翫°縺ｪ縺・    // 谿ｵ髫・: 蜷域ｵ・ｼ・erge 縺ｾ縺ｧ・・    if (growth > 0.28) {
      const tribAppear = riverSmoothstep(0.28, 0.55, growth);
      const joined = growth >= 0.4;
      const tribG = riverSmoothstep(0.28, 0.8, growth);

      const tribPts = joined
        ? [
            { x: srcTrib.x, y: srcTrib.y },
            { x: srcTrib.x + 6, y: farY + depth * 0.05 },
            { x: midX + 68, y: farY + depth * 0.16 },
            { x: midX + 40, y: farY + depth * 0.26 },
            { x: midX + 22, y: farY + depth * 0.32 },
            { x: merge.x + 8, y: merge.y - 6 },
            { x: merge.x, y: merge.y },
          ]
        : [
            { x: srcTrib.x, y: srcTrib.y },
            { x: srcTrib.x + 8, y: farY + depth * 0.08 },
            { x: midX + 72, y: farY + depth * 0.18 },
            { x: midX + 52, y: farY + depth * 0.26 },
            // 蜷域ｵ∵焔蜑阪〒豁｢縺ｾ繧・            { x: midX + 38, y: farY + depth * 0.3 },
          ];

      rivers.push({
        id: 1,
        minG: 0.28,
        scale: (joined ? 0.7 : 0.55) * tribAppear,
        joinMain: joined,
        pts: tribPts,
        // 謾ｯ豬√・邏ｰ繧√ょ粋豬∝ｾ後ｂ譛ｬ豬√⊇縺ｩ螟ｪ縺上＠縺ｪ縺・ｼ井ｸ頑ｵ√・縺輔ｉ縺ｫ邏ｰ縺擾ｼ・        w0: (0.16 + plump * 0.2) * wm * tribG,
        w1: (0.55 + plump * 0.9) * wm * tribG,
      });
    }
    return rivers;
  }

  function riverHalfWidth(def, p) {
    // 荳頑ｵ√⊇縺ｩ邏ｰ縺城聞縺丈ｿ昴■縲∽ｸ区ｵ√〒蠕舌・↓螟ｪ繧・    const g = riverSmoothstep(0.0, 0.98, p);
    const ease = Math.pow(g, 1.45);
    return Math.max(0.08, (def.w0 + (def.w1 - def.w0) * ease) * def.scale);
  }

  function buildRiverSamples(def, steps, growthForSurge) {
    const samples = [];
    const targetP =
      growthForSurge != null
        ? Math.max(0.05, riverPlump(growthForSurge))
        : Math.max(0.05, RiverSurge.targetPlump, RiverSurge.settledPlump, 0.05);
    for (let i = 0; i <= steps; i++) {
      const p = i / steps;
      const pt = samplePolyline(def.pts, p);
      let halfW = riverHalfWidth(def, p);
      // 繧ｵ繝ｼ繧ｸ・壽悴騾夐℃縺ｮ荳区ｵ√・ settled 蟷・・夐℃貂医∩縺ｯ target 蟷・      halfW = RiverSurge.scaleHalfW(halfW, p, targetP);
      samples.push({ x: pt.x, y: pt.y, p, halfW });
    }
    for (let i = 0; i < samples.length; i++) {
      const a = samples[Math.max(0, i - 1)];
      const b = samples[Math.min(samples.length - 1, i + 1)];
      let dx = b.x - a.x;
      let dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len;
      dy /= len;
      samples[i].tx = dx;
      samples[i].ty = dy;
      samples[i].nx = -dy;
      samples[i].ny = dx;
    }
    for (let pass = 0; pass < 2; pass++) {
      const nnx = samples.map((s) => s.nx);
      const nny = samples.map((s) => s.ny);
      for (let i = 1; i < samples.length - 1; i++) {
        let nx = nnx[i - 1] + nnx[i] * 2 + nnx[i + 1];
        let ny = nny[i - 1] + nny[i] * 2 + nny[i + 1];
        const nlen = Math.hypot(nx, ny) || 1;
        samples[i].nx = nx / nlen;
        samples[i].ny = ny / nlen;
      }
    }
    return samples;
  }

  /**
   * 繧ｵ繝ｳ繝励Ν轤ｹ蛻励ｒ莠梧ｬ｡譖ｲ邱壹〒霎ｿ繧・   * side: 0=荳ｭ蠢・ ﾂｱ1=豕慕ｷ壽婿蜷代↓ halfW*widthScale
   */
  function appendSmoothSampleSide(g, samples, widthScale, yBias, side, startWithMove) {
    if (samples.length < 2) return;
    const bias = yBias || 0;
    const sc = widthScale == null ? 1 : widthScale;
    const sd = side || 0;
    const pt = (s) => {
      const w = Math.max(0.15, s.halfW * sc) * sd;
      return { x: s.x + s.nx * w, y: s.y + s.ny * w + bias };
    };
    const n = samples.length;
    const p0 = pt(samples[0]);
    if (startWithMove !== false) g.moveTo(p0.x, p0.y);
    else g.lineTo(p0.x, p0.y);
    if (n === 2) {
      const p1 = pt(samples[1]);
      g.lineTo(p1.x, p1.y);
      return;
    }
    const p1 = pt(samples[1]);
    g.lineTo((p0.x + p1.x) * 0.5, (p0.y + p1.y) * 0.5);
    for (let i = 1; i < n - 1; i++) {
      const a = pt(samples[i]);
      const b = pt(samples[i + 1]);
      g.quadraticCurveTo(a.x, a.y, (a.x + b.x) * 0.5, (a.y + b.y) * 0.5);
    }
    const last = pt(samples[n - 1]);
    g.lineTo(last.x, last.y);
  }

  function riverPolyPath(g, samples, widthScale, yBias) {
    if (samples.length < 2) return false;
    g.beginPath();
    appendSmoothSampleSide(g, samples, widthScale, yBias, 1, true);
    const rev = samples.slice().reverse();
    appendSmoothSampleSide(g, rev, widthScale, yBias, -1, false);
    g.closePath();
    return true;
  }

  /** 荳ｭ蠢・ｷ壹ｒ譖ｲ邱・stroke */
  function strokeRiverCenterline(g, samples, lineW, color, alpha) {
    if (samples.length < 2) return;
    g.save();
    g.globalAlpha = alpha;
    g.strokeStyle = color;
    g.lineWidth = lineW;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.beginPath();
    appendSmoothSampleSide(g, samples, 1, 0, 0, true);
    g.stroke();
    g.restore();
  }

  /**
   * 螻ｱ縺ｮ荳頑ｵ・ｼ壽・髟ｷ縺ｫ蠢懊§縺ｦ邏ｰ縺・ｭ銀・縺上⊂縺ｿ
   */
  function paintMountainRiverGullies(g, u) {
    const growth = riverGrowth(u, false);
    if (growth < 0.02) return;
    const farY = GROUND_Y - GROUND_DEPTH;
    const defs = getRiverDefs(growth);
    const bed = riverBedStrength(growth);

    g.save();
    for (let di = 0; di < defs.length; di++) {
      const def = defs[di];
      if (growth < def.minG) continue;
      const samples = buildRiverSamples(def, 24, growth);
      const mtn = [];
      for (let i = 0; i < samples.length; i++) {
        if (samples[i].y <= farY + 2) mtn.push(samples[i]);
      }
      if (mtn.length < 2) continue;

      // 蠎冗乢・夂ｴｰ縺・囓髱偵・遲九□縺托ｼ医￥縺ｼ縺ｿ縺ｯ縺ｾ縺蠑ｱ縺・ｼ・      if (bed < 0.15) {
        strokeRiverCenterline(g, mtn, 0.9 + growth * 1.2, "rgba(50, 90, 120, 0.55)", 0.5 + growth);
        continue;
      }

      g.globalAlpha = bed;
      if (riverPolyPath(g, mtn, 1.2 + bed * 0.4, 0.6)) {
        g.fillStyle = lerpColor("#3a2e24", "#243820", u);
        g.fill();
      }
      if (riverPolyPath(g, mtn, 0.7 + bed * 0.35, 0.9)) {
        g.fillStyle = lerpColor("#2e2820", "#1a3830", u);
        g.fill();
      }
      if (riverPolyPath(g, mtn, 0.35 + bed * 0.25, 1.1)) {
        g.fillStyle = lerpColor("#3a4848", "#2a5860", Math.min(1, u * 1.2));
        g.globalAlpha = bed * 0.7;
        g.fill();
      }
      g.globalAlpha = bed * 0.45;
      g.strokeStyle = "rgba(15,12,8,0.4)";
      g.lineWidth = 1;
      g.lineCap = "round";
      g.lineJoin = "round";
      g.beginPath();
      appendSmoothSampleSide(g, mtn, 0.9, 0.8, 1, true);
      g.stroke();
      g.beginPath();
      appendSmoothSampleSide(g, mtn, 0.9, 0.8, -1, true);
      g.stroke();
    }
    g.restore();
  }

  /**
   * 螟ｧ蝨ｰ縺ｮ蟾晏ｺ奇ｼ壽・髟ｷ蠕後°繧峨￥縺ｼ縺ｿ縺悟ｾ舌・↓豺ｱ縺上↑繧・   */
  function paintGroundRiverBeds(g, u) {
    const growth = riverGrowth(u, false);
    const bed = riverBedStrength(growth);
    if (bed < 0.08) return;

    const farY = GROUND_Y - GROUND_DEPTH;
    const nearY = GROUND_Y;
    const bleed = GROUND_BLEED;
    const defs = getRiverDefs(growth);

    const bankCol = lerpColor("#5a4a38", "#3a6a40", u);
    const bedCol = lerpColor("#3a3228", "#1e4a40", u);
    const wetCol = lerpColor("#2a3838", "#1a4a58", Math.min(1, u * 1.1));
    const rimLite = lerpColor("#8a7858", "#5a9a50", u);

    g.save();
    // 蜈ｨ蟷・け繝ｪ繝・・・亥ｷｦ蜿ｳ縺ｫ邯壹￥螟ｧ蝨ｰ・・    g.beginPath();
    g.rect(-bleed, farY, W + bleed * 2, nearY - farY + 2);
    g.clip();

    for (let di = 0; di < defs.length; di++) {
      const def = defs[di];
      if (growth < def.minG) continue;
      const samples = buildRiverSamples(def, 32, growth);
      const ground = [];
      for (let i = 0; i < samples.length; i++) {
        if (samples[i].y >= farY - 2) ground.push(samples[i]);
      }
      if (ground.length < 2) continue;

      // 縺上⊂縺ｿ縺ｮ蠑ｷ縺輔・蟷・・謌宣聞縺ｫ豈比ｾ具ｼ域･縺ｫ螟ｪ縺上＠縺ｪ縺・ｼ・      const outer = 1.0 + bed * 0.9;
      const mid = 0.75 + bed * 0.55;
      const inner = 0.5 + bed * 0.4;

      g.globalAlpha = bed * 0.5;
      if (riverPolyPath(g, ground, outer, 0.4)) {
        g.fillStyle = bankCol;
        g.fill();
      }
      g.globalAlpha = bed * 0.75;
      if (riverPolyPath(g, ground, mid, 0.7)) {
        g.fillStyle = bedCol;
        g.fill();
      }
      g.globalAlpha = bed * 0.85;
      if (riverPolyPath(g, ground, inner, 1.0)) {
        g.fillStyle = wetCol;
        g.fill();
      }
      if (bed > 0.4 && riverPolyPath(g, ground, inner * 0.55, 1.2)) {
        g.fillStyle = "rgba(10, 20, 28, 0.3)";
        g.fill();
      }

      if (bed > 0.35) {
        g.globalAlpha = bed * 0.35;
        g.lineCap = "round";
        g.lineJoin = "round";
        const rimSide = ground[0].ny > 0 ? 1 : -1;
        g.strokeStyle = rimLite;
        g.lineWidth = 1.1;
        g.beginPath();
        appendSmoothSampleSide(g, ground, mid, 0.3, rimSide, true);
        g.stroke();
        g.strokeStyle = "rgba(20, 16, 10, 0.35)";
        g.lineWidth = 1.2;
        g.beginPath();
        appendSmoothSampleSide(g, ground, mid, 0.5, -rimSide, true);
        g.stroke();
      }
    }
    g.restore();
  }

  /**
   * 繝ｩ繧､繝匁ｰｴ髱｢・夂ｴｰ縺・搨邱・竊・蠕舌・↓髱｢縺ｸ・区ｳ｢繝ｻ豬√ｌ
   */
  function drawLiveRiverWater(def, growth, flow) {
    const steps = 40;
    const samples = buildRiverSamples(def, steps, growth);
    const farY = GROUND_Y - GROUND_DEPTH;
    const nearY = GROUND_Y;
    const bleed = GROUND_BLEED;
    const wm = riverWidthMul(growth);
    const bed = riverBedStrength(growth);
    // 豌ｴ髱｢縺ｮ髱｢縺ｯ蜷域ｵ∝ｾ後・蠅玲ｰｴ縺ｫ蜷医ｏ縺帙※繧・▲縺上ｊ蠎・′繧・    const plump = riverPlump(growth);
    const fillStage = riverSmoothstep(0.35, 0.85, growth) * (0.35 + plump * 0.65);

    // 窶披・螻ｱ蛛ｴ・域ｺ先ｵ√・邏ｰ縺・搨繝ｻ譖ｲ邱夲ｼ俄披・    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    // 貅先ｵ√・讌ｵ邏ｰ・・alfW 縺ｮ蟷ｳ蝮・ｂ蜿肴丐・・    let mtnHalfAvg = 0.4;
    const mtnSeg = [];
    for (let i = 0; i < samples.length; i++) {
      if (samples[i].y > farY + 1) break;
      mtnSeg.push(samples[i]);
      mtnHalfAvg += samples[i].halfW;
    }
    if (mtnSeg.length) mtnHalfAvg /= mtnSeg.length;
    const mtnLineW = Math.max(0.35, Math.min(1.6, 0.35 + mtnHalfAvg * 1.1 + wm * 0.35));
    if (mtnSeg.length >= 2) {
      ctx.strokeStyle = `rgba(90, 160, 210, ${0.45 + growth * 0.35})`;
      ctx.lineWidth = mtnLineW;
      ctx.beginPath();
      appendSmoothSampleSide(ctx, mtnSeg, 1, 0.5, 0, true);
      ctx.stroke();
    }
    if (growth > 0.08 && mtnSeg.length >= 2) {
      const upFlow = (flow * 0.55 + def.id * 0.2) % 1;
      const hiSeg = [];
      for (let i = 0; i < mtnSeg.length; i++) {
        const s = mtnSeg[i];
        if (s.p > 0.3) break;
        if (s.p >= upFlow && s.p <= upFlow + 0.08) hiSeg.push(s);
      }
      if (hiSeg.length >= 2) {
        ctx.strokeStyle = `rgba(200, 235, 255, ${0.25 + growth * 0.25})`;
        ctx.lineWidth = Math.max(0.35, mtnLineW * 0.45);
        ctx.beginPath();
        appendSmoothSampleSide(ctx, hiSeg, 1, 0.4, 0, true);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 窶披・蟷ｳ蝨ｰ・亥・蟷・ｼ壼ｷｦ蜿ｳ縺ｸ邯壹￥螟ｧ蝨ｰ・俄披・    ctx.save();
    ctx.beginPath();
    ctx.rect(-bleed, farY, W + bleed * 2, nearY - farY + 2);
    ctx.clip();

    const ground = [];
    for (let i = 0; i < samples.length; i++) {
      if (samples[i].y >= farY - 1) ground.push(samples[i]);
    }

    if (ground.length >= 2) {
      const waterScale = 0.35 + fillStage * 0.55;
      // 1) 蟶ｸ縺ｫ荳ｭ蠢・・髱偵＞邱夲ｼ域・髟ｷ縺励※繧り官縺ｨ縺励※谿九ｋ・・      const coreW = 1.0 + wm * 2.8;
      strokeRiverCenterline(
        ctx,
        ground,
        coreW,
        `rgb(${70 + growth * 20}, ${150 + growth * 30}, ${200 + growth * 20})`,
        0.55 + growth * 0.3
      );

      // 2) 謌宣聞縺ｫ蠢懊§縺ｦ豌ｴ髱｢縺ｮ髱｢繧貞ｺ・￡繧具ｼ・alfW 縺ｯ繧ｵ繝ｼ繧ｸ貂医∩・・      if (fillStage > 0.05) {
        if (riverPolyPath(ctx, ground, waterScale, 0.7)) {
          const grad = ctx.createLinearGradient(
            ground[0].x,
            ground[0].y,
            ground[ground.length - 1].x,
            ground[ground.length - 1].y
          );
          const a0 = (0.22 + fillStage * 0.2) * (0.7 + growth * 0.3);
          grad.addColorStop(0, `rgba(100, 170, 210, ${a0 * 0.85})`);
          grad.addColorStop(0.5, `rgba(60, 140, 190, ${a0})`);
          grad.addColorStop(1, `rgba(45, 120, 170, ${a0 * 1.05})`);
          ctx.fillStyle = grad;
          ctx.fill();
        }
      }

      // 蟾晄怙螟ｧ蛹門ｾ後・繧ｷ繝｣繝ｼ荳蛻・↑縺励よ悴螳梧・譎ゅ・縺ｿ遞ｮ騾｣邯・+縺ｧ荳譎り｡ｨ遉ｺ
      const riverMaxed = riverPlump(growth) >= 0.95;
      if (riverMaxed && RiverSheen.active) {
        RiverSheen.active = false;
        RiverSheen.head = 1;
      }

      // 2b) 遞ｮ騾｣邯壼叙蠕玲凾縺ｮ荳譎ゅす繝｣繝ｼ・井ｸ頑ｵ≫・荳区ｵ・ｼ峨ょｸｸ譎ゅ・蜃ｺ縺輔↑縺・      if (!riverMaxed && RiverSheen.active && (def.id === 0 || def.id === 2)) {
        const head = RiverSheen.head;
        const band = RiverSheen.band;
        const sheenPts = [];
        for (let i = 0; i < ground.length; i++) {
          const s = ground[i];
          const str = RiverSheen.strength(s.p);
          if (str < 0.05) continue;
          sheenPts.push({
            x: s.x,
            y: s.y + 0.4,
            p: s.p,
            halfW: s.halfW * (0.9 + str * 0.8),
            nx: s.nx,
            ny: s.ny,
            str,
          });
        }
        if (sheenPts.length >= 2) {
          ctx.strokeStyle = `rgba(30, 80, 120, ${0.35 + RiverSheen.strength(head) * 0.2})`;
          ctx.lineWidth = 4 + plump * 5;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          appendSmoothSampleSide(ctx, sheenPts, 0.35, 0.3, 0, true);
          ctx.stroke();
          ctx.strokeStyle = `rgba(200, 235, 255, ${0.45 + RiverSheen.strength(head) * 0.4})`;
          ctx.lineWidth = 2 + plump * 3.5;
          ctx.beginPath();
          appendSmoothSampleSide(ctx, sheenPts, 0.2, 0.2, 0, true);
          ctx.stroke();
          const tip = sheenPts[sheenPts.length - 1];
          const tipStr = tip.str || 0.5;
          ctx.fillStyle = `rgba(230, 250, 255, ${0.35 * tipStr})`;
          ctx.beginPath();
          ctx.ellipse(tip.x, tip.y, 3 + tipStr * 4, 1.5 + tipStr * 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        const passed = [];
        for (let i = 0; i < ground.length; i++) {
          if (ground[i].p <= head + band * 0.1) passed.push(ground[i]);
        }
        if (passed.length >= 2 && riverPolyPath(ctx, passed, Math.max(0.4, waterScale) * 0.85, 0.5)) {
          ctx.fillStyle = `rgba(140, 200, 230, ${0.08 + plump * 0.1})`;
          ctx.fill();
        }
      }

      // 3) 霆ｽ縺・ｳ｢繝ｻ豬√ｌ / 4) 縺阪ｉ縺阪ｉ 窶・譛螟ｧ蛹門燕縺ｮ縺ｿ・郁ご縺｡蛻・ｊ蠕後・騾壼ｸｸ陦ｨ遉ｺ・・      if (!riverMaxed) {
        const waveAmt = 0.4 + growth * 0.9;
        const nGlints = 2 + ((growth * 4) | 0);
        for (let gi = 0; gi < nGlints; gi++) {
          const speed = 0.14 + (gi % 3) * 0.06;
          const len = 0.06 + growth * 0.04;
          const base = (gi / nGlints) * 0.9;
          const gp = (base + flow * speed + def.id * 0.13) % 1;
          const g0 = gp;
          const g1 = Math.min(1, gp + len);
          const isFast = gi % 3 === 0;
          const wavePts = [];
          for (let i = 0; i < ground.length; i++) {
            const s = ground[i];
            if (s.p < g0 || s.p > g1) continue;
            const waveOff =
              Math.sin(s.p * Math.PI * 6 + flow * 2.2 + gi) * waveAmt * (0.4 + s.halfW * 0.08);
            wavePts.push({
              x: s.x + s.nx * waveOff,
              y: s.y + s.ny * waveOff * 0.5 + 0.5,
              halfW: 0.2,
              nx: 0,
              ny: 0,
            });
          }
          if (wavePts.length < 2) continue;
          ctx.strokeStyle = isFast
            ? `rgba(230, 245, 255, ${0.2 + growth * 0.25})`
            : `rgba(170, 215, 235, ${0.15 + growth * 0.2})`;
          ctx.lineWidth = (isFast ? 0.8 : 1.1) * (0.7 + fillStage * 0.6);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          appendSmoothSampleSide(ctx, wavePts, 1, 0, 0, true);
          ctx.stroke();
        }

        // 4) 豌ｴ髱｢縺ｮ縺阪ｉ繧√￥轤ｹ・域ｳ｡繝ｻ豕｢鬆ｭ・・        if (growth > 0.15) {
          const nSpark = 2 + ((growth * 5) | 0);
          for (let k = 0; k < nSpark; k++) {
            const sp = (k * 0.19 + flow * 0.22 + def.id * 0.07) % 1;
            const idx = Math.min(ground.length - 1, (sp * (ground.length - 1)) | 0);
            const s = ground[idx];
            const bob = Math.sin(t * 0.12 + k * 1.7) * 0.4;
            ctx.fillStyle = `rgba(220, 245, 255, ${0.15 + growth * 0.2})`;
            ctx.beginPath();
            ctx.ellipse(
              s.x + s.nx * bob,
              s.y + 0.4,
              1.0 + growth * 1.2,
              0.45 + growth * 0.3,
              Math.atan2(s.ty, s.tx),
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
        }
      }

      // 5) 蟯ｸ闕峨・蟾昴′螟ｪ縺上↑縺｣縺ｦ縺九ｉ
      if (bed > 0.45) {
        const reeds = 1 + ((bed * 4) | 0);
        ctx.strokeStyle = `rgba(45, ${100 + growth * 50}, 40, ${0.2 + bed * 0.2})`;
        ctx.lineWidth = 1;
        for (let k = 0; k < reeds; k++) {
          const rp = 0.55 + (k / Math.max(1, reeds)) * 0.38;
          const idx = Math.min(ground.length - 1, (rp * (ground.length - 1)) | 0);
          const s = ground[idx];
          const side = k % 2 === 0 ? 1 : -1;
          const bx = s.x + s.nx * side * (s.halfW * 1.15 + 0.5);
          const by = s.y + s.ny * side * (s.halfW * 1.15 + 0.5);
          const h = 2 + bed * 4;
          const sway = Math.sin(t * 0.045 + k) * 1.1;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(bx + sway, by - h * 0.5, bx + sway * 0.3, by - h);
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    return samples;
  }

  /** 蟾昴し繝ｳ繝励Ν繧剃ｸ頑ｵ√・荳ｭ豬√・荳区ｵ√↓蛻・￠繧・*/
  function collectFishZones(allSamples) {
    const up = [];
    const mid = [];
    const down = [];
    const farY = GROUND_Y - GROUND_DEPTH;
    for (let ri = 0; ri < allSamples.length; ri++) {
      const arr = allSamples[ri];
      for (let i = 0; i < arr.length; i++) {
        const s = arr[i];
        if (s.p < 0.06 || s.p > 0.97) continue;
        if (s.p < 0.38) up.push(s);
        else if (s.p < 0.68) mid.push(s);
        else down.push(s);
      }
    }
    return { up, mid, down, all: up.concat(mid, down), farY };
  }

  function ensureRiverFishShadows(allSamples, growth) {
    if (growth < 0.32) {
      riverFishShadows = [];
      return;
    }
    const zones = collectFishZones(allSamples);
    if (!zones.all.length) return;
    const nUp = 2 + Math.min(2, (growth * 3) | 0);
    const nMid = 2 + Math.min(2, (growth * 2) | 0);
    const nDown = 2 + Math.min(2, (growth * 2) | 0);
    const want = nUp + nMid + nDown;
    if (riverFishShadows.length >= want) return;

    function spawnIn(list, zone, sizeMul) {
      if (!list.length) list = zones.all;
      if (!list.length) return;
      const s = list[(Math.random() * list.length) | 0];
      riverFishShadows.push({
        x: s.x + (s.nx || 0) * (Math.random() - 0.5) * s.halfW * 0.4,
        y: s.y + (s.ny || 0) * (Math.random() - 0.5) * s.halfW * 0.3,
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.22 + Math.random() * 0.35),
        vy: (Math.random() - 0.5) * 0.12,
        phase: Math.random() * Math.PI * 2,
        size: (1.5 + Math.random() * 1.2) * sizeMul,
        zone,
      });
    }
    while (riverFishShadows.filter((f) => f.zone === "up").length < nUp) spawnIn(zones.up, "up", 0.85);
