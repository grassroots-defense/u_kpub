<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOCKING → BOSS INTRO TEST</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#050508;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    min-height:100vh;
    font-family:'Courier New', monospace;
    overflow:hidden; user-select:none;
  }
  #stage {
    position:relative;
    width:min(96vw, 960px);
    aspect-ratio: 960/720;
    background:#000;
    border:2px solid #1a3a5a;
    box-shadow:0 0 0 4px #0a1520, 0 0 40px rgba(0,80,180,0.3);
    overflow:hidden;
  }
  #stage img, #stage canvas {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    object-fit:contain;
  }
  #cmdScreen { z-index:10; }
  #dockCanvas { z-index:5; display:none; }
  #assembled {
    position: absolute;
    z-index: 8;
    display: none;
    left: 50%;
    top: 38%;
    width: auto !important;
    height: auto !important;
    max-width: 24%;
    max-height: 34%;
    transform: translate(-50%, -50%);
    object-fit: contain;
    transition: top 2.2s ease-in-out, transform 2.2s ease-in-out;
  }
  #flash {
    position:absolute; inset:0;
    background:#fff; opacity:0;
    z-index:20; pointer-events:none;
    transition: opacity 0.15s;
  }
  #btn {
    position:absolute;
    bottom:8%; left:50%; transform:translateX(-50%);
    z-index:15;
    padding:12px 28px;
    background:#1a3050;
    border:2px solid #3a80c0;
    color:#8cf;
    font-family:inherit; font-size:14px;
    letter-spacing:0.12em;
    cursor:pointer;
    box-shadow:0 0 16px rgba(40,120,255,0.4);
  }
  #btn:hover { background:#243e68; color:#fff; }
  #btn.hidden { display:none; }
  #bossMark {
    position:absolute; top:12%; left:50%;
    transform:translateX(-50%);
    color:#f44; font-size:18px; letter-spacing:0.2em;
    text-shadow:0 0 12px #f00;
    opacity:0; z-index:12;
    transition: opacity 0.6s;
  }
  #status {
    margin-top:10px; color:#4a9fff;
    font-size:13px; letter-spacing:0.12em;
  }
  #hint { margin-top:4px; color:#444; font-size:12px; }
</style>
</head>

<script>
const stage = document.getElementById('stage');
const cmdScreen = document.getElementById('cmdScreen');
const canvas = document.getElementById('dockCanvas');
const ctx = canvas.getContext('2d');
const assembled = document.getElementById('assembled');
const flashEl = document.getElementById('flash');
const btn = document.getElementById('btn');
const bossMark = document.getElementById('bossMark');
const statusEl = document.getElementById('status');
const W = 960, H = 720;

// ---------- docking animation (same as before) ----------
function lerp(a,b,t){return a+(b-a)*t;}
function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function p(t,a,b){if(t<a)return 0;if(t>b)return 1;return easeInOut((t-a)/(b-a));}

const stars = Array.from({length:120},()=>({
  x:Math.random()*W, y:Math.random()*H*0.68,
  r:Math.random()*1.5+0.2, a:Math.random()*0.8+0.2
}));

function drawStars(){
  for(const s of stars){
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(190,220,255,${s.a})`; ctx.fill();
  }
}
function drawEarth(){
  const cy=H+55,r=300;
  const g=ctx.createRadialGradient(W/2,cy,r*0.6,W/2,cy,r*1.25);
  g.addColorStop(0,'rgba(30,100,255,0)');
  g.addColorStop(0.7,'rgba(20,80,220,0.12)');
  g.addColorStop(1,'rgba(10,40,120,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(W/2,cy,r*1.25,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W/2,cy,r,0,Math.PI*2);
  const pg=ctx.createLinearGradient(W/2,cy-r,W/2,cy+r);
  pg.addColorStop(0,'#163878'); pg.addColorStop(0.5,'#0a2048'); pg.addColorStop(1,'#040c20');
  ctx.fillStyle=pg; ctx.fill();
  ctx.strokeStyle='rgba(60,150,255,0.5)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(W/2,cy,r,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
}
function drawSpaceX(x,y,s,glow=1){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.shadowColor=`rgba(40,160,255,${0.45*glow})`; ctx.shadowBlur=16*glow;
  ctx.fillStyle='#1c222c'; ctx.strokeStyle='#a0b4c8'; ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.moveTo(-42,-8); ctx.lineTo(-28,-22); ctx.lineTo(28,-22); ctx.lineTo(42,-8);
  ctx.lineTo(46,6); ctx.lineTo(36,20); ctx.lineTo(-36,20); ctx.lineTo(-46,6); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#0c1018'; ctx.fillRect(-26,-14,52,24);
  ctx.strokeStyle='#4a6a88'; ctx.strokeRect(-26,-14,52,24);
  ctx.strokeStyle='#e8f0ff'; ctx.lineWidth=4; ctx.lineCap='square';
  ctx.beginPath(); ctx.moveTo(-16,-8); ctx.lineTo(16,10); ctx.moveTo(16,-8); ctx.lineTo(-16,10); ctx.stroke();
  ctx.fillStyle='#2a3448'; ctx.strokeStyle='#7a90a8'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(-46,0); ctx.lineTo(-58,4); ctx.lineTo(-56,16); ctx.lineTo(-42,14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(46,0); ctx.lineTo(58,4); ctx.lineTo(56,16); ctx.lineTo(42,14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;
  const tg=ctx.createRadialGradient(0,28,2,0,28,28);
  tg.addColorStop(0,`rgba(80,200,255,${0.85*glow})`);
  tg.addColorStop(0.4,`rgba(30,120,255,${0.35*glow})`);
  tg.addColorStop(1,'rgba(10,40,120,0)');
  ctx.fillStyle=tg; ctx.beginPath(); ctx.ellipse(0,26,32,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2cf'; ctx.fillRect(-34,-16,6,4); ctx.fillRect(28,-16,6,4); ctx.fillRect(-8,14,16,3);
  ctx.fillStyle='#e85818'; ctx.fillRect(-22,16,8,3); ctx.fillRect(14,16,8,3);
  ctx.restore();
}
function drawMainBooster(x,y,s,rot=0,flame=1){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle='#252c38'; ctx.strokeStyle='#8a9cb0'; ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.moveTo(-32,-100); ctx.lineTo(32,-100); ctx.lineTo(42,-75); ctx.lineTo(42,75);
  ctx.lineTo(26,108); ctx.lineTo(-26,108); ctx.lineTo(-42,75); ctx.lineTo(-42,-75); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#080a10'; ctx.fillRect(-22,-48,44,96);
  ctx.strokeStyle='#3a5a7a'; ctx.lineWidth=2; ctx.strokeRect(-22,-48,44,96);
  ctx.fillStyle='#d05018';
  ctx.fillRect(-38,-60,6,22); ctx.fillRect(32,-60,6,22);
  ctx.fillRect(-38,30,6,22); ctx.fillRect(32,30,6,22);
  ctx.fillStyle='#1a2030';
  ctx.beginPath(); ctx.moveTo(-16,-100); ctx.lineTo(16,-100); ctx.lineTo(10,-118); ctx.lineTo(-10,-118); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#28f'; for(let i=-4;i<=4;i++) ctx.fillRect(-5,i*14-24,10,5);
  if(flame>0.05){
    const fg=ctx.createLinearGradient(0,108,0,108+65*flame);
    fg.addColorStop(0,`rgba(90,190,255,${0.95*flame})`);
    fg.addColorStop(0.35,`rgba(40,130,255,${0.55*flame})`);
    fg.addColorStop(1,'rgba(15,50,160,0)');
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.moveTo(-20,108); ctx.lineTo(20,108);
    ctx.lineTo(10,108+65*flame); ctx.lineTo(-10,108+65*flame); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawSideBooster(x,y,s,side=1,flame=1){
  ctx.save(); ctx.translate(x,y); ctx.scale(s*side,s);
  ctx.fillStyle='#283040'; ctx.strokeStyle='#8094a8'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-16,-78); ctx.lineTo(16,-78); ctx.lineTo(22,-55); ctx.lineTo(22,62);
  ctx.lineTo(12,85); ctx.lineTo(-12,85); ctx.lineTo(-22,62); ctx.lineTo(-22,-55); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#0a0e16'; ctx.fillRect(-10,-36,20,58);
  ctx.fillStyle='#c84818'; ctx.fillRect(-14,-48,5,14); ctx.fillRect(9,-48,5,14);
  ctx.fillStyle='#2af'; ctx.beginPath(); ctx.arc(0,-68,6,0,Math.PI*2); ctx.fill();
  if(flame>0.05){
    const fg=ctx.createLinearGradient(0,85,0,85+48*flame);
    fg.addColorStop(0,`rgba(70,170,255,${0.9*flame})`);
    fg.addColorStop(1,'rgba(20,70,180,0)');
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.moveTo(-11,85); ctx.lineTo(11,85);
    ctx.lineTo(6,85+48*flame); ctx.lineTo(-6,85+48*flame); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawHUD(){
  ctx.strokeStyle='rgba(40,120,200,0.4)'; ctx.lineWidth=2;
  const m=18;
  ctx.beginPath();
  ctx.moveTo(m,m+28); ctx.lineTo(m,m); ctx.lineTo(m+28,m);
  ctx.moveTo(W-m-28,m); ctx.lineTo(W-m,m); ctx.lineTo(W-m,m+28);
  ctx.moveTo(m,H-m-28); ctx.lineTo(m,H-m); ctx.lineTo(m+28,H-m);
  ctx.moveTo(W-m-28,H-m); ctx.lineTo(W-m,H-m); ctx.lineTo(W-m,H-m-28);
  ctx.stroke();
}
function drawScanlines(){
  ctx.fillStyle='rgba(0,0,0,0.1)';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
}

const TOTAL=17.5;
function update(t){
  // Single continuous timeline — no overlapping overwrites that cause jumps
  let coreX = W/2, coreY = H*0.42, coreS = 0.95, coreGlow = 1;

  // Main booster path (continuous from start to final)
  // t 1.5-2.4 fade in at far position
  // t 2.6-8.4 approach + settle to center (one continuous lerp)
  let mainX = W/2 + 340;
  let mainY = H * 0.55;
  let mainS = 0.28;
  let mainRot = -0.45;
  let mainFlame = 0.7;
  let mainVis = p(t, 1.5, 2.4);

  let sideLX = -150, sideRX = W + 150, sideY = H * 0.52, sideS = 0.45, sideFlame = 0.9, sideVis = 0;

  // One continuous approach for main booster (no phase break)
  if (t > 2.6) {
    const a = p(t, 2.6, 8.4);
    mainX = lerp(W/2 + 340, W/2, a);
    mainY = lerp(H * 0.55, H * 0.38, a);
    mainS = lerp(0.28, 1.10, a);
    mainRot = lerp(-0.45, 0, a);
    mainFlame = lerp(0.7, 0.35, a);
  }

  // Core docks smoothly during the second half of booster approach
  // starts when booster is getting close (t~5.5), finishes with booster
  if (t > 5.5) {
    const a = p(t, 5.5, 8.4);
    coreY = lerp(H * 0.42, H * 0.38, a);
    coreS = lerp(0.95, 0.48, a);
    coreGlow = lerp(1, 0.55, a);
  }

  // Side boosters
  sideVis = p(t, 10.0, 10.9);
  if (t > 10.2) {
    const a = p(t, 10.3, 14.6);
    sideLX = lerp(-160, W/2 - 100, a);
    sideRX = lerp(W + 160, W/2 + 100, a);
    sideY = lerp(H * 0.58, H * 0.40, a);
    sideS = lerp(0.35, 0.92, a);
    sideFlame = lerp(1.15, 0.5, a);
  }

  // Final tighten
  if (t > 15.0) {
    const a = p(t, 15.0, 16.8);
    sideLX = lerp(W/2 - 100, W/2 - 80, a);
    sideRX = lerp(W/2 + 100, W/2 + 80, a);
    sideS = lerp(0.92, 0.98, a);
    mainS = lerp(1.10, 1.15, a);
    mainFlame = lerp(0.35, 0.75, a);
    sideFlame = lerp(0.5, 0.85, a);
  }

  return {
    core: {x:coreX, y:coreY, s:coreS, glow:coreGlow},
    main: {x:mainX, y:mainY, s:mainS, rot:mainRot, flame:mainFlame, vis:mainVis},
    side: {lx:sideLX, rx:sideRX, y:sideY, s:sideS, flame:sideFlame, vis:sideVis}
  };
}
function renderDock(state){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  drawStars(); drawEarth();
  if(state.side.vis>0.04){ ctx.globalAlpha=state.side.vis;
    drawSideBooster(state.side.lx,state.side.y,state.side.s,-1,state.side.flame);
    drawSideBooster(state.side.rx,state.side.y,state.side.s,1,state.side.flame); ctx.globalAlpha=1; }
  if(state.main.vis>0.04){ ctx.globalAlpha=state.main.vis;
    drawMainBooster(state.main.x,state.main.y,state.main.s,state.main.rot,state.main.flame); ctx.globalAlpha=1; }
  drawSpaceX(state.core.x,state.core.y,state.core.s,state.core.glow);
  drawHUD(); drawScanlines();
}


// ---------- simple Web Audio SFX ----------
let actx = null;
function ensureAudio(){
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function beep(freq, dur, type, vol, slideTo){
  const c = ensureAudio();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, c.currentTime);
  if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, c.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.15, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + dur + 0.02);
}

function noiseBurst(dur, vol, filterFreq){
  const c = ensureAudio();
  const n = c.createBufferSource();
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.5);
  n.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = filterFreq || 800;
  const g = c.createGain();
  g.gain.setValueAtTime(vol || 0.12, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  n.connect(f); f.connect(g); g.connect(c.destination);
  n.start();
}

function thrusterHum(dur, vol, fadeSec){
  const c = ensureAudio();
  const o = c.createOscillator();
  const o2 = c.createOscillator();
  const g = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = 55;
  o2.type = 'sine'; o2.frequency.value = 110;
  const v = vol || 0.06;
  const fade = (fadeSec != null) ? fadeSec : 1.2;
  g.gain.setValueAtTime(0.001, c.currentTime);
  g.gain.linearRampToValueAtTime(v, c.currentTime + 0.35);
  // hold then fade out near the end
  const fadeStart = Math.max(0.4, dur - fade);
  g.gain.setValueAtTime(v, c.currentTime + fadeStart);
  g.gain.linearRampToValueAtTime(0.001, c.currentTime + dur);
  o.connect(g); o2.connect(g); g.connect(c.destination);
  o.start(); o2.start();
  o.stop(c.currentTime + dur + 0.05);
  o2.stop(c.currentTime + dur + 0.05);
}

// Construction-site heavy impacts
function heavyClang(){
  const c = ensureAudio();
  const t0 = c.currentTime;

  // deep sub boom (重機が着地したようなドーン)
  const o1 = c.createOscillator();
  const g1 = c.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(48, t0);
  o1.frequency.exponentialRampToValueAtTime(18, t0 + 0.9);
  g1.gain.setValueAtTime(0.85, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + 1.1);
  o1.connect(g1); g1.connect(c.destination);
  o1.start(t0); o1.stop(t0 + 1.15);

  // second layer boom slightly delayed
  const o1b = c.createOscillator();
  const g1b = c.createGain();
  o1b.type = 'sine';
  o1b.frequency.setValueAtTime(62, t0 + 0.05);
  o1b.frequency.exponentialRampToValueAtTime(22, t0 + 0.7);
  g1b.gain.setValueAtTime(0.55, t0 + 0.05);
  g1b.gain.exponentialRampToValueAtTime(0.001, t0 + 0.85);
  o1b.connect(g1b); g1b.connect(c.destination);
  o1b.start(t0 + 0.05); o1b.stop(t0 + 0.9);

  // thick metallic body (鉄骨がぶつかる)
  const o2 = c.createOscillator();
  const g2 = c.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(140, t0);
  o2.frequency.exponentialRampToValueAtTime(45, t0 + 0.5);
  g2.gain.setValueAtTime(0.4, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
  o2.connect(g2); g2.connect(c.destination);
  o2.start(t0); o2.stop(t0 + 0.6);

  // harsh scrap metal noise (ガシャーン本体)
  function metalNoise(delay, dur, vol, freq){
    const n = c.createBufferSource();
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 0.55);
    n.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = 0.6;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0 + delay);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + dur);
    n.connect(f); f.connect(g); g.connect(c.destination);
    n.start(t0 + delay);
  }
  metalNoise(0.00, 0.45, 0.5, 700);
  metalNoise(0.06, 0.35, 0.35, 1400);
  metalNoise(0.12, 0.25, 0.22, 2200);

  // residual rattle
  const o3 = c.createOscillator();
  const g3 = c.createGain();
  o3.type = 'square';
  o3.frequency.setValueAtTime(380, t0 + 0.08);
  o3.frequency.exponentialRampToValueAtTime(90, t0 + 0.4);
  g3.gain.setValueAtTime(0.1, t0 + 0.08);
  g3.gain.exponentialRampToValueAtTime(0.001, t0 + 0.42);
  o3.connect(g3); g3.connect(c.destination);
  o3.start(t0 + 0.08); o3.stop(t0 + 0.45);
}

function heavyLock(){
  const c = ensureAudio();
  const t0 = c.currentTime;

  // mid-heavy thud
  const o1 = c.createOscillator();
  const g1 = c.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(70, t0);
  o1.frequency.exponentialRampToValueAtTime(28, t0 + 0.55);
  g1.gain.setValueAtTime(0.7, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.7);
  o1.connect(g1); g1.connect(c.destination);
  o1.start(t0); o1.stop(t0 + 0.75);

  // scrap impact
  const n = c.createBufferSource();
  const len = Math.floor(c.sampleRate * 0.32);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 0.6);
  n.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 850; f.Q.value = 0.7;
  const g2 = c.createGain();
  g2.gain.setValueAtTime(0.4, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
  n.connect(f); f.connect(g2); g2.connect(c.destination);
  n.start(t0);

  // secondary clank
  const o2 = c.createOscillator();
  const g3 = c.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(220, t0 + 0.05);
  o2.frequency.exponentialRampToValueAtTime(70, t0 + 0.3);
  g3.gain.setValueAtTime(0.22, t0 + 0.05);
  g3.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
  o2.connect(g3); g3.connect(c.destination);
  o2.start(t0 + 0.05); o2.stop(t0 + 0.35);
}


function itemGet(){
  // special item pickup — bright ascending chime
  const c = ensureAudio();
  const t0 = c.currentTime;
  const notes = [523, 659, 784, 1046]; // C5 E5 G5 C6
  notes.forEach((freq, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t0 + i * 0.07);
    g.gain.setValueAtTime(0.001, t0 + i * 0.07);
    g.gain.linearRampToValueAtTime(0.18, t0 + i * 0.07 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.07 + 0.35);
    o.connect(g); g.connect(c.destination);
    o.start(t0 + i * 0.07);
    o.stop(t0 + i * 0.07 + 0.4);
  });
  // soft sparkle noise
  const n = c.createBufferSource();
  const len = Math.floor(c.sampleRate * 0.2);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
  n.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 2000;
  const g2 = c.createGain();
  g2.gain.setValueAtTime(0.08, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
  n.connect(f); f.connect(g2); g2.connect(c.destination);
  n.start(t0);
}


function fon(delay){
  // ふぉん — soft small pulse
  const c = ensureAudio();
  const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(420, t0);
  o.frequency.exponentialRampToValueAtTime(280, t0 + 0.18);
  g.gain.setValueAtTime(0.001, t0);
  g.gain.linearRampToValueAtTime(0.055, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + 0.22);
}


function shuuu(dur, vol){
  // しゅーーー fade while ship shrinks
  const c = ensureAudio();
  const t0 = c.currentTime;
  const n = c.createBufferSource();
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) {
    // soft noise with gentle high content
    d[i] = (Math.random()*2-1) * 0.7;
  }
  n.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(1800, t0);
  f.frequency.exponentialRampToValueAtTime(400, t0 + dur);
  f.Q.value = 0.7;
  const g = c.createGain();
  const v = vol || 0.08;
  g.gain.setValueAtTime(0.001, t0);
  g.gain.linearRampToValueAtTime(v, t0 + 0.15);
  g.gain.linearRampToValueAtTime(v * 0.55, t0 + dur * 0.45);
  g.gain.linearRampToValueAtTime(0.001, t0 + dur);
  n.connect(f); f.connect(g); g.connect(c.destination);
  n.start(t0);
  n.stop(t0 + dur + 0.05);
}

const sfxFlags = {};
function sfxOnce(key, fn){
  if (sfxFlags[key]) return;
  sfxFlags[key] = true;
  fn();
}
function resetSfx(){ for (const k in sfxFlags) delete sfxFlags[k]; }

function triggerDockSfx(t){
  // main booster じーーー — hold until core fully docked, then quick mute
  if (t >= 2.7) sfxOnce('thrust', ()=>{
    thrusterHum(5.85, 0.014, 0.35);
  });
  // side boosters じーーー much quieter
  if (t >= 10.3) sfxOnce('side', ()=>{
    thrusterHum(5.8, 0.006, 1.0);
  });
}


// ---------- sequence control ----------
let phase = 'cmd'; // cmd | dock | flash | ship | descend | boss
let dockT0 = null;
let animId = null;

function setStatus(s){ statusEl.textContent = s; }

function startDock(){
  phase = 'dock';
  btn.classList.add('hidden');
  cmdScreen.style.display = 'none';
  canvas.style.display = 'block';
  dockT0 = performance.now();
  resetSfx();
  ensureAudio();
  setStatus('DOCKING SEQUENCE');
  function loop(now){
    if(phase !== 'dock') return;
    let t = (now - dockT0)/1000;
    if(t >= TOTAL){
      t = TOTAL;
      renderDock(update(t));
      doFlash();
      return;
    }
    renderDock(update(t));
    triggerDockSfx(t);
    animId = requestAnimationFrame(loop);
  }
  animId = requestAnimationFrame(loop);
}

function doFlash(){
  phase = 'flash';
  setStatus('FLASH');
  flashEl.style.opacity = '1';
  setTimeout(()=>{
    flashEl.style.opacity = '0';
    canvas.style.display = 'none';
    // show assembled ship at center
    assembled.style.display = 'block';
    assembled.style.left = '50%';
    assembled.style.top = '38%';
    assembled.style.width = 'auto';
    assembled.style.height = 'auto';
    assembled.style.transform = 'translate(-50%, -50%)';
    setStatus('ブースター＋スペースX号 出現');
    phase = 'ship';
    setTimeout(doDescend, 900);
  }, 280);
}

function doDescend(){
  phase = 'descend';
  setStatus('機体降下');
  try { shuuu(2.2, 0.07); } catch(e){}
  assembled.style.left = '50%';
  assembled.style.top = '78%';
  assembled.style.transform = 'translate(-50%, -50%) scale(0.7)';
  setTimeout(()=>{
    phase = 'boss';
    bossMark.style.opacity = '1';
    setStatus('BOSS APPROACHING');
  }, 2400);
}

function resetAll(){
  if(animId) cancelAnimationFrame(animId);
  phase = 'cmd';
  dockT0 = null;
  canvas.style.display = 'none';
  assembled.style.display = 'none';
  assembled.style.left = '50%';
  assembled.style.top = '38%';
  assembled.style.transform = 'translate(-50%, -50%)';
  bossMark.style.opacity = '0';
  flashEl.style.opacity = '0';
  cmdScreen.style.display = 'block';
  btn.classList.remove('hidden');
  setStatus('緊急指令室');
}

btn.addEventListener('click', startDock);
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); resetAll(); }
});
